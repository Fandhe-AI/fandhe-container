# cargo の runner 設定（#3504・REPAIR-5・REPAIR-7）。
# reusable の rust-ci（Fandhe-AI/actions の rust-base-ci）の `cargo test` は間欠的にジョブ上限まで止まりログが残らない。
# reusable にはステップも env も差し込めないため、試験バイナリごとに期限つきの wrapper で包み、期限切れ時に
# 診断（プロセス木・スレッド名）を出して子孫を回収する。期限を使う条件・既定 300 秒の根拠は scripts/test-bin-watchdog.sh と
# .claude/rules/ci.md。CI 外・cargo bench は素通しのため、手元の cargo run / cargo test は変わらない。
# Linux（x86_64・aarch64）に限る理由: 止まる症状は ubuntu の rust-ci でしか観測されておらず、wrapper は /proc と procps に
# 依存し、Windows は .sh を直接起動できず、macOS・Windows の cargo test は main の platform-ci のステップ期限で既に有界。
# aarch64 Linux は platform-ci の arm64 の leg（ubuntu-24.04-arm。main・workflow_dispatch のみ。#4807）の cargo test を包む。
# runner の相対パスは cargo が `.cargo` の親（ワークスペースルート）基準で解決する（crates/ 配下の cwd からの cargo test で実測済み）。
[target.x86_64-unknown-linux-gnu]
runner = "scripts/test-bin-watchdog.sh"

[target.aarch64-unknown-linux-gnu]
runner = "scripts/test-bin-watchdog.sh"
