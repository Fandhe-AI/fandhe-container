      # production_launcher・rootless_file_owner・rootless_image_rootfs_remove・seccomp（`crates/core/tests/`。CORE-1・CORE-5・CORE-6・SEC-1・
      # SEC-4・SEC-5・#2376）と、rootless_launch・rootless・rootless_uid_mapping（core）・supervisor_bin_real（supervisor）・
      # start_stop_delete_real（cli）（CORE-6・SUP-4・REPAIR-7・#2596。前提は同じ。Landlock ABI 6 以上と user manager の
      # private ソケットは前提確認ステップで fail-closed にする）: `--ignored` の実機前提テスト（harness = false）を非 root で実行する。
      # 範囲写像（`FANDHE_CONTAINER_TEST_ID_HELPER=1`。uidmap・subuid）と委譲 cgroup の前提は、`linux-env-probe.yml` の
      # `id-mapping-probe`（run 39295761418・2026-10-19・#2244）で ubuntu-latest が既定で満たすと実測済み。
      # 準備ステップは sudo を使わず確認だけを行い、欠けていれば fail-closed にする（sudo の用途は増やさない）。
      # ubuntu-latest が新しい世代へ変わってここが落ちたら、確認を緩めず `id-mapping-probe` を回し直して判断する。
      # root で走る分岐（root=true）は CI では回さない（実機確認は #1621）。新しい check-run・permissions は追加しない。
      - name: 範囲写像と委譲 cgroup の前提確認（sudo なし。CORE-6・SEC-5・#2376）
        if: runner.os == 'Linux' && env.HANG_PROBE != 'true'
        timeout-minutes: 2
        run: |
          set -euo pipefail
          fail() { echo "::error::precondition missing: $1" >&2; exit 1; }
          [ "$(id -u)" != 0 ] || fail "must run as non-root"
          [ -u /usr/bin/newuidmap ] || fail "setuid /usr/bin/newuidmap"
          [ -u /usr/bin/newgidmap ] || fail "setuid /usr/bin/newgidmap"
          user="$(id -un)"
          grep -q "^${user}:" /etc/subuid || fail "/etc/subuid entry"
          grep -q "^${user}:" /etc/subgid || fail "/etc/subgid entry"
          [ -n "${XDG_RUNTIME_DIR:-}" ] || fail "XDG_RUNTIME_DIR"
          state="$(systemctl --user is-system-running || true)"
          [ "${state}" = running ] || fail "systemctl --user is-system-running = ${state}"
          # supervisor_bin_real・start_stop_delete_real（#2596）の前提: user manager の private ソケット（パスの値は出さない）
          [ -S "${XDG_RUNTIME_DIR}/systemd/private" ] || fail "systemd user manager private socket"
          # rootless・rootless_uid_mapping（#2596）の前提: Landlock ABI 6 以上（linux-env-probe.yml と同じ測り方）
          abi_py='import ctypes; l=ctypes.CDLL(None, use_errno=True); print(l.syscall(444, None, 0, 1))'
          abi="$(python3 -c "${abi_py}" || echo -1)"
          [ "${abi}" -ge 6 ] 2>/dev/null || fail "Landlock ABI >= 6 (got ${abi})"
          {
            echo "subuid: $(grep "^${user}:" /etc/subuid)"
            echo "subgid: $(grep "^${user}:" /etc/subgid)"
            echo "systemctl --user: ${state}"
            echo "systemd user manager private socket: present"
            echo "Landlock ABI: ${abi}"
          } >> "$GITHUB_STEP_SUMMARY"

      # userns_extract（`crates/oci/tests/userns_extract.rs`。OCI-2・SEC-5・CORE-6・REPAIR-7・#2542・#2642）: rootless の
      # user namespace 内でのレイヤー展開（所有者・setuid・写像外 ID の拒否）を照合する実機前提テスト（harness = false）。
      # 単一行写像（`unshare --user --map-root-user`）に加え、`newuidmap` / `newgidmap` の範囲写像（subuid / subgid）のケース
      # （`subordinate_*`）を含む。範囲写像は上の前提確認ステップ（uidmap・subuid / subgid の行）に依存するため、その後に置く。
      # 試験は `USER`（subuid の所有者名）を使うので渡す。新しい check-run・sudo・permissions は追加しない。
