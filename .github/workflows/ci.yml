name: CI

# TASK-1（#7）・TASK-1.h1（#9）で workspace（Cargo.toml）とメンバー crate（19 crate＋
# benches）を作成済みのため、TASK-86.1（#35・REPAIR-7）で発火条件を有効化した。
# pull_request は fork PR でも secrets なし・read-only トークンで動くイベントを使い、
# pull_request_target は使わない（フォークからの secrets 露出・書き込み権限奪取を防ぐ）。
# lint-docs が参照する設定ファイル（.markdownlint.jsonc 等）・3 OS matrix
# （ubuntu / macos / windows）・cache-key-prefix のリポ名化は fandhe-browser の
# ci.yml から取り込み済み。
# ruleset（branch protection）の必須チェックには、implement-issue-tree の自動マージ前
# ゲート（G0。PR 上の全 check-run context が必須チェックに含まれることを要求する）に
# 適合させるため、本 workflow が pull_request で生成する check-run 14 件（ci-complete・
# lint-docs / * 5 件・rust-ci (ubuntu-latest) / * 5 件・platform-ci (ubuntu-latest) 1 件・
# bench-regression 1 件・cross-target-check 1 件）をすべて個別に登録する。
# push（main）・workflow_dispatch では platform-ci が 3 OS になり 16 件
# （platform-ci (macos-latest)・platform-ci (windows-latest) が加わる）。
# 2026-10-10 に macOS ランナーの同時実行枠（1 枠程度）待ちで全 PR の CI が詰まったため、
# オーナー承認のもとで 3 OS のジョブを 2 段階で再構成した。
# - 1 段階目（#1724）: rust-ci は ubuntu のみ・rust-ci-default-features と integration-test は
#   platform-ci へ統合（1 回の CI の macOS ジョブは 7 本から 1 本）。再構成前は 29 件
#   （rust-ci (<os>) / * 15 件・rust-ci-default-features (<os>) 3 件・integration-test (<os>) 3 件を含む）
# - 2 段階目: pull_request では macOS・Windows のネイティブランナーを使わない（platform-ci は
#   ubuntu のみ）。代わりに cross-target-check（旧 aarch64-linux-check を拡張）が Linux 上で
#   macOS・Windows 向けの型検査を行う。macOS・Windows のネイティブ実行は main への push と
#   workflow_dispatch（release 前の 3 OS 確認を含む）で行う（ci.md「3 OS CI」）
# 差し替えの ruleset 更新は main セッションが行う（下の ci-complete ジョブのコメント参照）。
# ruleset に登録するのは PR で生成される 14 件で、push（main）だけで生成される
# platform-ci (macos-latest|windows-latest) は登録しない（登録すると PR が永久に待ちになる）。
# 件数の範囲に注意: 14 件は本 workflow 分のみで、ruleset の必須チェック全体は
# 本 workflow 分に本 workflow の外が生成する 4 件を足した 18 件になる。外の 4 件は
# ai-review.yml の codex / preflight・codex / review・codex / post_feedback 3 件と、
# 外部 GitHub App の Cursor Bugbot 1 件。数え方: 本 workflow 分は
# PR の `gh pr checks <PR> --json name,workflow` を workflow 名 CI で絞った件数、
# ruleset 全体は ruleset の required_status_checks の件数
# ジョブの追加・改名・matrix 変更で check-run 名が変わる場合は ruleset 側も
# 同時に更新する（リポジトリ設定の変更のためオーナー作業とする）
on:
  workflow_dispatch:
    inputs:
      hang-probe:
        description: >-
          true にすると、platform-ci ジョブでリポ外の使い捨て crate に
          仕込んだハングするテストを実行し、REPAIR-5（タイムアウト保護）が
          実際に fail することを実証する（TASK-86.2）。既定 false では通常の
          結合試験を実行する。PR・push イベントではこの入力自体が存在しない
          （既定 false 相当）
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PR ごとに一意な番号を group に含める（head_ref のみだと fork 間で同名ブランチの
  # 別 PR が同一グループになり、互いの CI を cancel し合う）。
  # push（main）では group が `CI-refs/heads/main` になり、cancel-in-progress により main への
  # 新しい push は実行中の古い main の CI（macOS・Windows のネイティブ実行を含む 3 OS）を
  # 取り消す。取り消された commit の macOS・Windows の結果は残らず、OS 固有の実行時の誤りは
  # 後続 commit の main の CI（最新 commit を含む 3 OS 実行）で検出する（オーナー承認の挙動。
  # ci.md「3 OS CI」）。workflow_dispatch を main へ向けて起動した場合も同じ group になる
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------
  # lint-docs（ドキュメント／設定ファイル系 lint）
  # --------------------------------------------------
  # Fandhe-AI/actions の lint-docs reusable workflow（lint ツールバージョンは
  # 共通側で固定。agent-cli-skills の同名ジョブと同型）を呼び出す。
  # 設定はそれぞれ `.markdownlint.jsonc` / `.markdownlintignore` /
  # `.editorconfig` + `.editorconfig-checker.json` / `.yamllint` /
  # `commitlint.config.mjs` を参照する。
  #
  # 必須チェックの集約: reusable 側の lint-docs 自体も集約ジョブ
  # `lint-docs / lint-docs-complete`（fail-closed。各 lint ジョブは boolean input の
  # if: を持つ条件付きジョブとして明示リストで skipped を判定する）で単一の result に
  # まとめられているため、本 workflow からは `needs.lint-docs.result` を信頼できる
  # 単一値として扱える。rust-ci（ubuntu 1 要素の matrix）・platform-ci（pull_request では
  # ubuntu 1 要素、push（main）・workflow_dispatch では 3 OS の matrix）は
  # matrix の値ごとに別名のチェックが生成される。本 workflow 内の集約ジョブ
  # `ci-complete`（下部）は lint-docs・rust-ci・platform-ci・
  # bench-regression・cross-target-check の結果をまとめて fail-closed 判定する
  # ゲートとして残しつつ、ruleset（branch protection）の
  # 必須チェックには本 workflow が生成する check-run（`ci-complete` を含む全件）を
  # 個別に登録している（冒頭コメント参照。implement-issue-tree の自動マージ前ゲート
  # G0 が全 check-run の必須チェック登録を要求するため）。lint ジョブの追加・改名や
  # matrix の OS 変更で check-run 名が変わったら ruleset 側も同時に更新する
  # （オーナー作業）。
  lint-docs:
    # Fandhe-AI/actions は可変タグ latest（move-latest-tag 管理で main へ追従）で
    # 参照する（組織現行標準）
    uses: Fandhe-AI/actions/.github/workflows/lint-docs.yml@latest
    permissions:
      contents: read
    with:
      # public リポジトリのため GitHub ホステッド runner を明示指定（組織 runner 方針）
      runner-label: ubuntu-latest
      markdownlint: true
      editorconfig: true
      yamllint: true
      # commitlint は PR の base/head から commit 範囲を取るため pull_request 専用
      # （reusable 側は他イベントを fail-closed で拒否する）。push でも動く本
      # workflow では event で切り替え、main への push では実行しない
      commitlint: ${{ github.event_name == 'pull_request' }}

  # --------------------------------------------------
  # rust-ci（Rust ベースライン品質ゲート: fmt / clippy / test / cargo-deny）
  # --------------------------------------------------
  # reusable workflow 側の `test` ジョブが `cargo test --workspace --all-features` を
  # continue-on-error 無しで実行し、集約ジョブ `rust-base-ci-complete` が
  # fmt/clippy/test/deny 各ジョブの result を明示チェックしてフェイルクローズで判定する
  # （本呼び出しからは `rust-ci (ubuntu-latest) / rust-base-ci-complete` として見える）。
  #
  # ubuntu-latest のみで実行する（2026-10-10 のジョブ再構成・オーナー承認）: reusable は
  # 呼び出し 1 回で fmt / clippy / test / deny / complete の 5 ジョブを生み、3 OS matrix では
  # macOS ジョブが 5 本になって macOS ランナーの同時実行枠（1 枠程度）を占有していた。
  # fmt・deny は結果が OS に依らず、macOS・Windows の `--all-features` の clippy / test は
  # platform-ci ジョブ（下記）のステップとして同じコマンドで実行する（platform-ci の macOS・
  # Windows は push（main）・workflow_dispatch のみ。pull_request では cross-target-check の
  # 型検査が代わる。ci.md「3 OS CI」）。
  # matrix を ubuntu 1 要素で残すのは、check-run 名を `rust-ci (ubuntu-latest) / ...` のまま
  # 保ち、ruleset（必須チェック）の差し替えを macOS・Windows 分の削除だけに留めるため。
  #
  # deny ジョブ（REPAIR-7 ステージ 5: セキュリティチェック・依存監査。TASK-86.4・#38）は
  # 次の 4 種を `make deny` と同一集合で実行する。
  #   - advisories: RUSTSEC アドバイザリ（脆弱・unmaintained・unsound・yanked。REPAIR-9）
  #   - bans: wildcards 等の禁止設定（rust-vmm 系クレートの禁止リストは MVM-4・
  #     TASK-73 で deny.toml の [bans] へ追記予定。本 PR では追記しない）
  #   - licenses: 許可ライセンス外の依存を検出（OSS-4・OSS-5）
  #   - sources: crates.io 以外のレジストリ / git 依存を拒否
  # 「禁止 API リント」（REPAIR-7 ステージ 5 のもう一方の観点）は対応する TASK が
  # spec 側に見当たらず未導入（スタブ扱い。REPAIR-3）。導入の要否は別途 spec 側で
  # 判断してもらう
  rust-ci:
    strategy:
      matrix:
        # 1 要素の matrix（check-run 名の `(ubuntu-latest)` を保つため。上記コメント参照）
        os: [ubuntu-latest]
    uses: Fandhe-AI/actions/.github/workflows/rust-base-ci.yml@latest
    permissions:
      contents: read
    with:
      # matrix.os をそのまま runner-label へ渡す
      # （public リポジトリの GitHub ホステッド runner 方針は維持）
      runner-label: ${{ matrix.os }}
      # make deny（Makefile の deny ターゲット）と同一のチェック集合。
      # licenses チェックは OSS-4（deny.toml の [licenses] 参照）
      deny-checks: advisories bans licenses sources
      # cargo-deny のバージョンを Makefile の CARGO_DENY_VERSION・Dockerfile の
      # `cargo install cargo-deny@...` と明示的に同期させる（3 箇所とも 0.20.2）。
      # reusable workflow 側の入力既定値（cargo-deny-version の default）に
      # 暗黙依存すると、上流 Fandhe-AI/actions が既定値を上げた際に検査の挙動が
      # 黙って変わり得るため、ここで固定して再現性を保つ（`@latest` 追従との
      # トレードオフを埋める。値を上げる場合は Makefile・Dockerfile 側も同時に
      # 更新し、3 箇所の整合をレビューで確認する）
      cargo-deny-version: "0.20.2"
      # cargo レジストリ・target の cache（reusable 側のオプトイン入力。
      # key は `**/Cargo.lock` のハッシュに加え `runner.os` を含む形で reusable
      # workflow 側が OS ごとに分離する）。ホステッド runner は毎回まっさらなため、
      # 無効のままだと各ジョブが依存クレートを毎回フルビルドすることになる。
      # cache-key-prefix は他リポジトリとの衝突回避のため本リポ名にする。
      # 以前は windows-latest のみ無効化していた（reusable の prune ステップが Windows で
      # 誤検出する既知の問題。fandhe-browser PR #409）が、ubuntu のみの実行になったため
      # 条件式は不要になった
      cache: true
      cache-key-prefix: fandhe-container

  # --------------------------------------------------
  # platform-ci（ネイティブのビルド・テスト・タイムアウト保護付き結合試験。REPAIR-7 ステージ 1〜3）
  # --------------------------------------------------
  # 実行 OS はイベントで切り替える（2026-10-10 の 2 段階目の再構成・オーナー承認）:
  # - pull_request: ubuntu-latest のみ（macOS・Windows のネイティブランナーを使わない）。
  #   macOS・Windows 向けのコンパイル・lint の誤りは cross-target-check（Linux 上の型検査）で
  #   PR ごとに検出する
  # - push（main）・workflow_dispatch: ubuntu・macos・windows の 3 OS（従来どおり全ステップ。
  #   macOS・Windows の `--all-features` の clippy / test を含む）。release 前の 3 OS 確認は
  #   workflow_dispatch で本 workflow を実行して行う
  # PR で見落とすのは macOS・Windows 固有の実行時の誤り（テストの失敗・BSD / Git Bash のツール差・
  # cfg(target_os) 限定項目への rustdoc リンク）で、main への push 後の 3 OS 実行で検出する。
  # main への新しい push は古い main の実行を取り消す（concurrency のコメント参照）。
  # check-run 名 `platform-ci (ubuntu-latest)` はどのイベントでも変わらない。
  #
  # 2026-10-10 のジョブ再構成（オーナー承認）で、旧 rust-ci-default-features（既定 feature の
  # ローカルゲート再現）と旧 integration-test（タイムアウト保護された結合試験）を 1 つの
  # 3 OS matrix ジョブへ統合し、macOS・Windows では rust-ci（reusable。ubuntu のみになった）が
  # 担っていた `--all-features` の clippy / test もステップとして実行する。
  # 統合の理由: macOS ランナーは同時実行枠が 1 枠程度しかなく、1 回の CI で macOS ジョブが
  # 7 本（rust-ci の 5 本＋旧 2 ジョブ）並んで全 PR の CI が待ち行列で詰まったため。各ジョブ
  # 自体は 2〜5 分で、問題はジョブ本数だった。ジョブを 1 本にまとめてもステップ・コマンド・
  # ステップごとの timeout-minutes は旧ジョブのまま移しており、検証範囲は変わらない。
  # check-run 名は pull_request では `platform-ci (ubuntu-latest)` の 1 件、push（main）・
  # workflow_dispatch では `platform-ci (<os>)` の 3 件。ruleset へは PR で出る 1 件だけを
  # 登録する（登録は main セッションが行う）。
  #
  # 実行順: 既定 feature のステップ（旧 rust-ci-default-features）→ macOS・Windows の
  # `--all-features` の clippy / test → 結合試験のステップ（旧 integration-test）。Linux 限定の
  # AppArmor 緩和は結合試験の通常実行より後ろに置く（下記「unshare_isolation」の項参照）。
  #
  # キャッシュ: 旧 rust-ci-default-features・旧 integration-test と同じく actions/cache を
  # 使わない（毎回コールドビルド）。reusable の cache は Windows で prune ステップが正当な
  # crate 名を誤検出する既知の問題（fandhe-browser PR #409）があり、本ジョブは reusable を
  # 経由しないため影響は受けないが、キャッシュの導入は別途の判断とする。
  # ツールチェーン: reusable は Fandhe-AI/actions/rust-toolchain-setup を使うが、本ジョブは旧 2
  # ジョブと同じ dtolnay/rust-toolchain（SHA 固定・stable）を使う。
  #
  # 以下は旧 rust-ci-default-features の説明（既定 feature 側のステップ）:
  #
  # rust-ci（reusable workflow）と本ジョブの macOS・Windows の `--all-features` ステップは
  # `cargo clippy/test --all-features` で検証するため、既定 feature（`--all-features` なし）の
  # 構成は別途検証されない。
  #   cargo build --workspace（REPAIR-7 ステージ 1: ビルド・型検査）
  #   cargo clippy --workspace --all-targets -- -D warnings
  #   cargo test --workspace（REPAIR-7 ステージ 2: ユニット / 統合テスト）
  #   RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps（make doc。#1300）
  # （いずれも既定 feature）を本 workflow 内で直接実行し、既定 feature 側の回帰も
  # CI で検出できるようにする。Makefile の `lint`/`test`/`doc` ターゲット（既定 feature 用）と
  # 同一コマンドを実行する（`cargo build` は `--locked` を付けず、他ステップと条件を
  # そろえる）。push（main）・workflow_dispatch では 3 OS で実行する（既定 feature 構成の OS 依存
  # 回帰を --all-features 側だけでは検出できないため）。
  # 生の steps を持つジョブのため、第三者 action は SHA 固定で参照する
  # （`@latest` が許されるのは Fandhe-AI/actions のみ）。
  #
  # 以下は旧 integration-test の説明（結合試験側のステップ）:
  #
  # spec の REPAIR-5（PoC-8 の BREAK-1: ACK 未送信、MS-0）は `cargo build` でも
  # ユニットテストでも検出できず、ハングとしてしか表面化しない。ハングする
  # テストを有限時間で打ち切り CI を fail させるのが本ジョブの役割
  # （TASK-86.2・#36）。
  #
  # 「結合試験」は Cargo の integration test target（各 crate の `tests/*.rs`。
  # `cargo metadata` 上で kind が "test" のもの）を指す。lib 内 unit test
  # （`#[cfg(test)]`）は rust-ci と本ジョブの既定 feature 側ステップ（ステージ 2）が
  # 既に担っており、ここでは重複させない。
  #
  # integration test target が 0 件のまま `cargo test --workspace --test '*'`
  # を呼ぶと「no test target matches pattern」で非 0 終了するため、実行前に
  # `cargo metadata` + jq で件数を数え、0 件なら notice を出して成功で終える
  # （無言の skip にはしない）。jq の失敗は fail-closed で扱う。
  #
  # タイムアウトは二段構え: ジョブ全体 60 分（統合前の 2 ジョブ各 30 分の合計に見合う
  # 多層防御）、実行ステップ 10 分（ハング検出の本体）。テスト 1 件ごとの推奨タイムアウト値
  # （PoC-8 実測に基づく 5〜10 秒のレンジ）は TASK-87.1（#40）で
  # FANDHE_CONTAINER_TEST_TIMEOUT_SECS（下記 env）として設定済み。main の 3 OS 実行
  # （特に macOS/Windows runner のノイズ）を踏まえ上限寄りの 10 秒を採用した。
  # 値を渡すだけで、これを読んで Duration を組み立て recv_timeout 等へ使うのは
  # 各テスト側の責務である。消費側は `crates/io/tests/responsiveness.rs` と
  # `crates/io/tests/break_detection.rs`（いずれも TEST_TIMEOUT_ENV 定数で読む）で
  # 実装済み。`crates/core/tests/unshare_isolation.rs` も子プロセス待ちで読む。
  # crash_safety は本値を読まず（自前の試行ループで制御）、他のテストは
  # 対象テストごとに順次消費側になる（未実装のテストは実装済みを装わない。REPAIR-3）。
  #
  # crash_safety（`crates/io/tests/crash_safety.rs`。IO-3・TASK-18.3.1・#827）:
  # SIGKILL 耐性の結合試験は本ジョブ（PR は ubuntu・main は 3 OS）の既定 CI 集合で実行し、root・KVM・
  # GPU・WSL2 を要する実機前提テストとしては分離しない（ci.md「実機前提テスト」）。
  # SIGKILL の対象はテスト自身が起動した子プロセス（crash_test_server）のみで、
  # UDS は 0700 の一時ディレクトリ内に作るためホストの設定に触れない。カーネル版数
  # 依存の永続化対応可否は skip ではなくテスト内の分岐で契約として検証する。
  # Windows は UDS 未対応の段階なので「未対応終了コード」の契約確認のみ行う。
  # 本 CI が保証しない範囲: 電源断・カーネルクラッシュ後の媒体永続化（IO-2）、
  # および実測レポート・対照の妥当性判断（TASK-18 の人間担当分）。
  # crash_safety と crash_test_server は required-features 付きのため、
  # `--test '*'` の glob は feature が欠けると黙って除外する（fail-open）。
  # そこで「crash_safety の存在確認」ステップを置き、ビルド・確認・実行の 3 箇所が
  # 同一の INTEGRATION_TEST_FEATURES を参照する形で feature 欠落を検出する。
  # rust-ci（ubuntu）と本ジョブの macOS・Windows の `--all-features` ステップでも
  # 同テストは重複して実行される。
  #
  # unshare_isolation（`crates/core/tests/unshare_isolation.rs`。CORE-1・SEC-5・
  # TASK-27.2・#1159）: namespace 分離の実挙動を検証する実機前提テストで、
  # `harness = false` のため `-- --ignored` を付けたときだけ分離を検証し、付けない
  # 上記の既定実行では「ignored」を出力して成功終了するだけになる。この穴を塞ぐため、
  # 既定の結合試験の実行ステップの後ろに Linux 限定の 3 ステップを置いて
  # `--ignored` 付きで実行する。
  # - Linux 限定なのは本テストが Linux 専用（`exec` モジュールが非 Linux ではビルド
  #   対象外で OS 非該当）だからで、ポータブルなテストを特定 OS で飛ばすものではない。
  # - 新しい check-run を増やさないため別ジョブにせず本ジョブのステップとした
  #   （ruleset への個別登録が要るため）。
  # - ubuntu 24.04 以降のランナーは AppArmor の
  #   `kernel.apparmor_restrict_unprivileged_userns=1` で非特権 user namespace を
  #   制限する。sudo で rootful 実行する案ではなく、この sysctl を 0 に緩めて非 root
  #   のまま実行する案を採った。SEC-5 の既定である rootless 経路
  #   （`RootlessSingleId`）を CI が検証でき、テストバイナリと cargo に特権を
  #   与えず sudo を固定キーの sysctl 書き込みだけに限れるため。rootful
  #   （`RootfulHostRoot`）経路は本ステップでは未検証。
  # - sysctl の変更はジョブ終了で破棄されるエフェメラル VM のカーネル設定に閉じ、
  #   リポジトリ・secrets・他ジョブへ影響しない。結合試験の実行ステップより後ろに
  #   置き、他の結合試験の環境を変えない。
  # - `harness = false` のため `--ignored` が届かなくても exit 0 になる。false-green を
  #   防ぐため、成功行がログにあることを grep で照合する。
  #
  # TASK-87.2（#41）: CI ジョブ全体のハング防止の最終確認について。下記の
  # ハングプローブ機構自体は TASK-86.2（#36）で実装済み。本 concurrency
  # グループ（`${{ github.workflow }}-${{ github.event.pull_request.number ||
  # github.ref }}`・`cancel-in-progress: true`）は `workflow_dispatch` を
  # `main` ブランチへ向けて起動した場合、`push`（main）トリガーの通常 CI と
  # 同一グループになり互いを cancel し合う。そのため他エージェントの並列
  # 自動実装・自動マージが落ち着き、concurrency グループが衝突しないタイミ
  # ングを選んで実施した: 2026-09-27、main（4469898）に対し
  # `gh workflow run ci.yml --ref main -f hang-probe=true` を実行。実行時点
  # で open PR は 0 件・main への直近 push の CI 完了後だったため衝突なし。
  # run: https://github.com/Fandhe-AI/fandhe-container/actions/runs/36335480476
  # 当時の integration-test ジョブの 3 OS（ubuntu-latest / macos-latest / windows-latest）
  # すべてで、実行ステップ「結合試験の実行（ステージ 3・タイムアウト保護。
  # REPAIR-5 / REPAIR-7）」が「has timed out after 10 minutes」で fail し、
  # ジョブ全体は開始から約 10〜11 分で終了した（ジョブの timeout-minutes
  # 30 分に達する前に、詰まらず fail することを確認済み）。今後再実行する
  # 際も、他エージェントの CI と concurrency グループが衝突しないタイミン
  # グを選ぶこと。
  #
  # ハングプローブ（workflow_dispatch の hang-probe=true）: リポジトリに
  # ハングするテストを常設せず、$RUNNER_TEMP 配下（リポ外）に依存なしの
  # 使い捨て crate を都度生成し、同じ実行ステップ・同じ timeout-minutes で
  # 実行することで「そのステップの timeout で fail する」ことを実証する。
  # プローブのテストが戻ってきた場合（sleep がタイムアウトより先に終わる等）
  # は exit 1 で fail させ、プローブ無効化による false-green を防ぐ。
  #
  # Windows runner の既定シェルは pwsh のため、bash のヒアドキュメント・
  # `set -euo pipefail` をそのまま使えるよう defaults.run.shell を明示する。
  #
  # 以下のステップのコメント・ステップ名にある「3 OS」「ubuntu・macos・windows」は、
  # push（main）・workflow_dispatch での実行を指す（pull_request では ubuntu のみ）。
  platform-ci:
    strategy:
      fail-fast: false
      matrix:
        # pull_request では ubuntu のみ、push（main）・workflow_dispatch では 3 OS（上記コメント参照）。
        # `&&` / `||` の三項相当は両分岐とも空でない文字列リテラルのため取り違えない。
        # github.event_name は GitHub が設定する値で、利用者の入力を含まない
        os: >-
          ${{ fromJSON(github.event_name == 'pull_request'
          && '["ubuntu-latest"]'
          || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    # ハングしたジョブの無期限実行を防ぐ多層防御（統合前の 2 ジョブ各 30 分の合計に見合う値）。
    # 実測（2026-10-10 時点）は統合前の 2 ジョブの合計で ubuntu 約 8 分・macOS 約 6 分
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    # env の 3 つは旧 integration-test のジョブ env をそのまま移したもの。統合により既定 feature の
    # `cargo test --workspace` にも FANDHE_CONTAINER_TEST_TIMEOUT_SECS が渡るが、消費側の既定値は
    # 10 秒（一部の実機前提テストは 20・30 秒）で、旧 integration-test は同じ 10 秒で同じ test
    # target を実行していたため、挙動の差は実質生じない
    env:
      # inputs.hang-probe は workflow_dispatch 以外のイベントでは存在しないため
      # github.event_name で明示的に絞る。値は env 経由でのみ受け取り、
      # run: スクリプトへ `${{ }}` を直接埋め込まない（スクリプトインジェクション対策）
      HANG_PROBE: ${{ github.event_name == 'workflow_dispatch' && inputs.hang-probe == true }}
      # 個別テスト 1 件ごとの推奨タイムアウト値（秒。PoC-8 実測に基づく
      # 5〜10 秒のレンジの上限寄り。TASK-87.1・#40・REPAIR-5）。この値を読んで
      # 使う消費側は `crates/io/tests/responsiveness.rs` と
      # `crates/io/tests/break_detection.rs`・`crates/core/tests/unshare_isolation.rs` で
      # 実装済み（REPAIR-3）。crash_safety は
      # 本値を読まず、他のテストは対象ごとに順次消費側になる
      FANDHE_CONTAINER_TEST_TIMEOUT_SECS: "10"
      # crash_safety 等 required-features 付き結合試験を有効化する feature。
      # ビルド・存在確認・実行の全ステップで同一値を参照する（#827）
      INTEGRATION_TEST_FEATURES: fandhe-container-io/crash-test-server
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      # REPAIR-7 ステージ 5（セキュリティチェック・依存監査。TASK-86.4・#38）の
      # 前提ファイル検証（fail-closed）。rust-ci が呼ぶ reusable
      # rust-base-ci.yml 側の deny ジョブは、Cargo.toml・deny.toml のいずれかが
      # 無いと deny ステップ自体を skip して success 扱いにする（fail-open）ため、
      # 変更でこれらのファイルが誤って削除・改名されても rust-ci 側の結果だけでは
      # 気付けない。新しいジョブを追加すると check-run 名が増えて ruleset
      # （branch protection の必須チェック。オーナー作業）の更新が要るため、
      # 既存の steps を持つ本ジョブへ検証ステップとして追加する（上流
      # Fandhe-AI/actions にこの検証が入れば削除してよい）。
      # `${{ }}` 式は run へ埋め込まず、固定のファイル名リストのみを扱う
      - name: ステージ 5 前提ファイルの存在検証（fail-closed）
        shell: bash
        run: |
          set -euo pipefail
          missing=""
          for f in Cargo.toml Cargo.lock deny.toml; do
            if [ ! -f "${f}" ]; then
              missing="${missing} ${f}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "::error::required file(s) for cargo deny stage are missing:${missing}"
            exit 1
          fi
      # stable（rust-toolchain.toml の channel = "stable" を単一真実源として追従）。
      # rustfmt は下の venus 試験治具の fmt-check（make poc-venus-jig-check）が使う
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: clippy, rustfmt
      # crates/supervisor の workspace members 登録を検証する（TASK-157.1・#235・SUP-1）。
      # members から外れると cargo test --workspace が機械照合テストごと実行しなくなるため、
      # workspace 外の make ターゲットで検出する。既存ジョブへの追加（新ジョブは必須チェック名が増える）
      - name: workspace manifest・supervisor 登録の検証
        shell: bash
        run: make check-workspace-manifest
      - name: cargo build（既定 feature。ステージ 1）
        run: cargo build --workspace
      - name: cargo clippy（既定 feature）
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test（既定 feature）
        run: cargo test --workspace
      # macOS・Windows の `--all-features` の clippy / test（2026-10-10 の再構成で rust-ci〔reusable
      # rust-base-ci.yml の clippy / test ジョブ〕から移したもの）。コマンドは reusable と同一
      # （`--locked` なし）。Linux は rust-ci (ubuntu-latest) が実行するため重複させない。
      # timeout-minutes は reusable の clippy / test ジョブの既定値（各 30 分）に合わせる
      - name: cargo clippy（--all-features。macOS・Windows のみ）
        if: runner.os != 'Linux'
        timeout-minutes: 30
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: cargo test（--all-features。macOS・Windows のみ）
        if: runner.os != 'Linux'
        timeout-minutes: 30
        run: cargo test --workspace --all-features
      # rustdoc の警告（壊れた intra-doc リンク・private 項目へのリンク等）を -D warnings で fail
      # させる（REPAIR-3・REPAIR-7・#1300）。Makefile の `doc` ターゲット（既定 feature・--no-deps）を
      # そのまま実行する。新ジョブは check-run 名が増えて ruleset の更新が要るため、既定 feature の
      # ローカルゲートを再現する本ジョブへステップとして追加する（check-run 件数は不変）。
      # push（main）・workflow_dispatch では 3 OS で実行する: cfg(target_os) 限定の項目へのリンクは
      # OS ごとに解決結果が変わり、Linux では通るが macOS / Windows でだけ壊れる（またはその逆の）
      # リンクがあるため。pull_request では ubuntu のみのため、macOS / Windows でだけ壊れるリンクは
      # main への push 後に検出する（cross-target-check は rustdoc を実行しない）
      - name: cargo doc（既定 feature・-D warnings）
        shell: bash
        timeout-minutes: 10
        run: make doc
      # core の plugin 無効構成（--no-default-features）の検証（PLUG-3・TASK-111.1・#262）。
      # 新ジョブは必須チェック名が増えるため既存ジョブへのステップとして追加する。
      - name: core plugin 無効構成の検証
        shell: bash
        run: make test-core-no-plugin
      # CLI がバックエンド実装 crate へ直接依存しない（CLI-1・PLUG-4・TASK-79.4）。既存ジョブへのステップ追加
      - name: cli のバックエンド直接依存なしの検証
        shell: bash
        run: make check-cli-backend-deps
      # venus 試験治具（poc/venus-decoder/jig。GPU-6・TASK-172.4・#888）の fmt-check・clippy・test。
      # 治具はルート workspace 外の独立パッケージで cargo build/test --workspace の対象に入らないが、
      # crates/plugin-macos（gpu::venus）へ path 依存するため、plugin-macos 側の変更で治具が壊れても
      # 他のステップでは検出できない。依存先の plugin-macos・platform-macos は上の cargo build
      # --workspace が 3 OS でビルドしており、治具自身にも OS 分岐（cfg(target_os)）が無いため、
      # 本ジョブの matrix でそのまま実行する（特定 OS の skip はしない。pull_request では ubuntu のみで、
      # macOS 向けの型検査は cross-target-check が aarch64-apple-darwin で行う）。実機前提テスト
      # （tests/real_machine_capset_log.rs）は #[ignore] で既定集合から分離済みで、ここでは走らない。
      # 治具は独自の Cargo.lock を持ち、clippy / test は --locked で lock を固定する（lock が黙って再解決
      # されない）。target は治具ディレクトリ配下（.gitignore 済み）に作る。
      # 新ジョブは check-run 名が増えるため既存ジョブのステップとする（check-run 件数は不変）
      - name: venus 試験治具の fmt-check・clippy・test（GPU-6・TASK-172.4）
        shell: bash
        timeout-minutes: 15
        run: make poc-venus-jig-check
      # 治具の Cargo.lock の依存監査（REPAIR-7 ステージ 5・REPAIR-9・OSS-4・MVM-4）。rust-ci の deny
      # （reusable workflow）はルート workspace だけを見るため、治具の lock は別に検査する。ルートの
      # deny.toml を共有し、ルートと同じ 4 種（advisories・bans・licenses・sources）を --locked で実行する。
      # cargo-deny は Makefile の CARGO_DENY_VERSION（rust-ci の cargo-deny-version と同じ 0.20.2）を
      # cargo install --locked で導入する（action は追加しない）。deny.toml に targets の指定が無く、
      # cargo-deny は実行ホストに関係なく全ターゲットの依存グラフを検査するため、結果は OS に依らない。
      # 導入のビルド時間を 3 重に払わないよう ubuntu のみで実行する（ビルド・テストのゲートではなく
      # 依存監査のため、ci.md「3 OS CI」の main での 3 OS ネイティブ実行の対象外。bench-regression と同じ扱い）
      - name: venus 試験治具の Cargo.lock の依存監査（cargo deny。ubuntu のみ）
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 20
        run: make deny-poc-venus-jig

      # 以下は旧 integration-test のステップ（REPAIR-7 ステージ 3: タイムアウト保護された結合試験）
      - name: integration test target 件数の判定
        id: count
        run: |
          set -euo pipefail
          metadata="$(cargo metadata --no-deps --format-version 1)"
          count="$(printf '%s' "${metadata}" | jq -er '[.packages[].targets[] | select(.kind[]? == "test")] | length')"
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "integration test targets: ${count}" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::integration test targets: ${count}"

      - name: 結合試験のビルド（ステージ 3。実行タイムアウトの時間枠を消費しないよう分離）
        if: steps.count.outputs.count != '0' && env.HANG_PROBE != 'true'
        run: cargo test --workspace --test '*' --features "${INTEGRATION_TEST_FEATURES}" --no-run

      - name: crash_safety の存在確認（IO-3・TASK-18.3.1。glob による無言除外の検出）
        if: steps.count.outputs.count != '0' && env.HANG_PROBE != 'true'
        run: |
          set -euo pipefail
          listed="$(cargo test --workspace --test '*' --features "${INTEGRATION_TEST_FEATURES}" -- --list)"
          case "${RUNNER_OS}" in
            Linux|macOS)
              expected=(
                "unix::io3_flushed_data_survives_10_valid_sigkills"
                "unix::io3_unflushed_control_records_loss_without_asserting"
              )
              ;;
            Windows)
              expected=("other::io3_crash_test_server_reports_unsupported_platform")
              ;;
            *)
              echo "::error::unsupported RUNNER_OS: ${RUNNER_OS}" >&2
              exit 1
              ;;
          esac
          for name in "${expected[@]}"; do
            if ! grep -Fxq "${name}: test" <<< "${listed}"; then
              echo "::error::crash_safety test not listed: ${name}" >&2
              exit 1
            fi
          done
          echo "crash_safety (IO-3) listed: ${expected[*]}" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::crash_safety (IO-3) listed"

      - name: ハングプローブ crate の生成（workflow_dispatch の hang-probe=true 時のみ）
        if: env.HANG_PROBE == 'true'
        run: |
          set -euo pipefail
          probe_dir="${RUNNER_TEMP}/hang-probe"
          mkdir -p "${probe_dir}/src" "${probe_dir}/tests"
          cat > "${probe_dir}/Cargo.toml" <<'EOF'
          # REPAIR-5（TASK-86.2）のハング検出を実証するための使い捨て crate。
          # 親 workspace から切り離すため空の [workspace] テーブルを持つ。依存は持たない
          [package]
          name = "fandhe-container-hang-probe"
          version = "0.0.0"
          edition = "2021"
          publish = false

          [workspace]
          EOF
          # 結合試験（tests/hang.rs）だけでは cargo の対象 target にならず、
          # 通常の lib/bin target を持たない manifest では `cargo test --no-run`
          # が「no targets specified in the manifest」相当で失敗し、ハングする
          # テストが実行ステップへ到達しない（レビュー指摘。REPAIR-5 の実証不成立）。
          # 空の src/lib.rs で lib target を用意し、tests/hang.rs が確実にビルド・
          # 実行される状態にする。
          touch "${probe_dir}/src/lib.rs"
          cat > "${probe_dir}/tests/hang.rs" <<'EOF'
          // platform-ci ジョブ（TASK-86.2・REPAIR-5）が実行ステップの
          // timeout-minutes で fail することを実証するためだけのプローブ。
          // 戻ってきた場合（timeout より先に sleep が終わる等）はプローブが
          // 機能していないことを意味するため、false-green を防ぐため fail させる。
          #[test]
          fn hang_forever() {
              loop {
                  std::thread::sleep(std::time::Duration::from_secs(3600));
              }
          }
          EOF
          cargo test --manifest-path "${probe_dir}/Cargo.toml" --no-run

      - name: 結合試験の実行（ステージ 3・タイムアウト保護。REPAIR-5 / REPAIR-7）
        timeout-minutes: 10
        env:
          # 前段ステップの outputs も `${{ }}` を run: へ直接埋め込まず env 経由で
          # 受け渡す（HANG_PROBE と同じスクリプトインジェクション対策）
          COUNT: ${{ steps.count.outputs.count }}
        run: |
          set -euo pipefail
          if [ "${HANG_PROBE}" = "true" ]; then
            cargo test --manifest-path "${RUNNER_TEMP}/hang-probe/Cargo.toml"
            echo "hang probe test returned without timing out" >&2
            exit 1
          fi
          if [ "${COUNT}" = "0" ]; then
            echo "::notice::integration test targets: 0 (nothing to run)"
            exit 0
          fi
          cargo test --workspace --test '*' --features "${INTEGRATION_TEST_FEATURES}"
          # crash_test_server bin 内のユニットテスト（--test '*' の対象外）も実行する
          cargo test -p fandhe-container-io --bins --features crash-test-server

      # PLUG-4 判定スクリプト（scripts/check-plug4-core-invariance.sh）の自己テスト（TASK-109.4・REPAIR-12）。
      # 判定本体は bench-regression（ubuntu 単独）で走るが、`make plug4-core-invariance` は開発者が各 OS で
      # 実行するため、GNU / BSD 双方のツールと Windows の Git Bash（本ジョブ既定の shell: bash）で動くことを
      # 3 OS の実行で確かめる。fixture の最小 workspace（依存 0 件）だけを使い、ネットワーク・secrets・
      # `${{ }}` の埋め込みは使わない。symlink を辿らず symlink のまま複製することは、ubuntu・macos で fixture の
      # build.rs が判定スクリプトの一時 workspace を検査して確かめる。Windows の Git Bash では fixture の
      # `ln -s` が複製になるため、空白を含むパスと複製の経路だけを確かめる（詳細は自己テスト冒頭のコメント）。
      # 新ジョブは check-run 名が増えるため既存ジョブのステップとする（check-run 件数は不変）
      - name: PLUG-4 判定スクリプトの自己テスト（TASK-109.4・REPAIR-12。ubuntu・macos・windows）
        if: env.HANG_PROBE != 'true'
        timeout-minutes: 5
        run: make plug4-core-invariance-selftest

      # CLI 3 OS 比較スクリプト（scripts/cli-parity-check.sh）の自己テスト（TASK-125.1・CLI-1・REPAIR-12）。
      # スタブ CLI だけを使い、製品バイナリ・root・ネットワーク・secrets は使わない。3 OS すべてで実行し、
      # macOS の BSD ツール（timeout 不在・sed / mktemp の差）と Windows の Git Bash（本ジョブ既定の
      # shell: bash）で動くことを確かめる。本ジョブの自己テスト 3 件（PLUG-4・CLI・virtio-gpu）はいずれも
      # make ターゲット経由で起動する（Makefile は SHELL := /bin/bash で、windows runner の make は Git Bash の
      # bash でレシピを実行する。本ジョブの既定 feature 側のステップも windows で make を使う）。
      # 新ジョブは check-run 名が増えるため既存ジョブのステップとする（check-run 件数は不変）
      - name: CLI 3 OS 比較スクリプトの自己テスト（TASK-125.1・CLI-1。ubuntu・macos・windows）
        if: env.HANG_PROBE != 'true'
        timeout-minutes: 5
        run: make cli-parity-selftest

      # capture のタイムアウトでネイティブ exe の子孫が回収されるかの実測（#1548・TASK-125・CLI-1・REPAIR-5）。
      # ログの `cli-parity native reclaim:` 行が Windows での確認結果。既存ジョブのステップ（check-run 件数は不変）
      - name: CLI 比較スクリプトのタイムアウト回収確認（ネイティブ exe・#1548）
        if: env.HANG_PROBE != 'true'
        timeout-minutes: 5
        run: make cli-parity-native-reclaim-check

      # virtio-gpu ゲスト側確認スクリプト（poc/vz-custom-virtio-gpu/guest/check-virtio-gpu.sh）の自己テスト
      # （TASK-172.6・GPU-6・REPAIR-12・#1056）。合成 fixture（testdata/）と偽の dmesg だけを使い、
      # 実機・ゲスト VM・root・ネットワーク・secrets は使わない。本体はゲスト Linux 内で実行するが、
      # 自己テストは README のとおり開発者が macOS でも回すため、README が前提とする BSD 系ツール
      # （head -c・dd・mktemp・sed -E 等）で動くことを macOS runner で確かめる。Windows（Git Bash）も
      # 自己テストの実行環境として 3 OS で回す。新ジョブは check-run 名が増えるため既存ジョブの
      # ステップとする（check-run 件数は不変）
      - name: virtio-gpu ゲスト側確認スクリプトの自己テスト（TASK-172.6・GPU-6。ubuntu・macos・windows）
        if: env.HANG_PROBE != 'true'
        timeout-minutes: 5
        run: make vz-virtio-gpu-guest-check-selftest

      - name: AppArmor の非特権 user namespace 制限を緩和（unshare_isolation 用・Linux のみ。CORE-1・SEC-5）
        if: runner.os == 'Linux' && env.HANG_PROBE != 'true'
        timeout-minutes: 2
        run: |
          set -euo pipefail
          key_file="/proc/sys/kernel/apparmor_restrict_unprivileged_userns"
          if [ -e "${key_file}" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            value="$(cat "${key_file}")"
            if [ "${value}" != "0" ]; then
              echo "::error::apparmor_restrict_unprivileged_userns is ${value}, expected 0" >&2
              exit 1
            fi
            echo "apparmor_restrict_unprivileged_userns=${value}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::apparmor_restrict_unprivileged_userns not present (nothing to relax)"
          fi

      - name: unshare_isolation のビルド（実行タイムアウトの時間枠を消費しないよう分離）
        if: runner.os == 'Linux' && env.HANG_PROBE != 'true'
        run: cargo test -p fandhe-container-core --test unshare_isolation --no-run

      - name: unshare_isolation の実行（実機前提テスト・--ignored。CORE-1・SEC-5・TASK-27.2）
        if: runner.os == 'Linux' && env.HANG_PROBE != 'true'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/unshare_isolation.log"
          cargo test -p fandhe-container-core --test unshare_isolation -- --ignored 2>&1 | tee "${log}"
          if ! grep -Fq 'unshare_isolation: full isolation verified (root=false)' "${log}"; then
            echo "::error::unshare_isolation did not report full isolation (possibly not executed)" >&2
            exit 1
          fi
          echo "unshare_isolation: full isolation verified (root=false)" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::unshare_isolation verified"

      # exec_setns_join（`crates/supervisor/tests/exec_setns_join.rs`。SUP-6・TASK-163.1・#500）:
      # 実 pid1 の 5 種 namespace への setns 参加を検証する実機前提テスト。unshare_isolation と同じ理由で
      # `harness = false`・`--ignored` 限定のため、緩和済みの AppArmor 設定のもとで実行し、成功行を照合する。
      # 試験専用の入口（`exec::identify_pid1_in`）を使うため `exec-test-support` feature を付ける
      # （付けないビルドは本体を持たず、`--ignored` 実行が非ゼロ終了になる。成功行の照合と合わせて fail-closed）。
      # 成功行はシナリオごとに照合する: 別の user namespace の対象の拒否・pivot 済みの対象へ参加した後の `/`・
      # `setgroups` が deny の user namespace での補助グループの扱い（TASK-163 追補・#1457・#1460）。
      - name: exec_setns_join のビルド（Linux のみ。SUP-6・TASK-163.1）
        if: runner.os == 'Linux' && env.HANG_PROBE != 'true'
        run: cargo test -p fandhe-container-supervisor --features exec-test-support --test exec_setns_join --no-run

      - name: exec_setns_join の実行（実機前提テスト・--ignored。SUP-6・TASK-163.1）
        if: runner.os == 'Linux' && env.HANG_PROBE != 'true'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/exec_setns_join.log"
          cargo test -p fandhe-container-supervisor --features exec-test-support \
            --test exec_setns_join -- --ignored 2>&1 | tee "${log}"
          # 最後の成功行だけでなく、各シナリオの成功行をすべて照合する（シナリオが黙って外れた場合を
          # 成功にしない。TASK-163 追補・#1460）。
          for line in \
            'exec_setns_join: target in another user namespace rejected' \
            'exec_setns_join: root after joining a pivoted target equals the pinned rootfs' \
            'exec_setns_join: supplementary groups kept and recorded where setgroups is denied' \
            'exec_setns_join: namespace join verified'; do
            if ! grep -Fxq "${line}" "${log}"; then
              echo "::error::exec_setns_join did not report: ${line} (possibly not executed)" >&2
              exit 1
            fi
            echo "${line}" >> "$GITHUB_STEP_SUMMARY"
          done

      # exec（`crates/supervisor/tests/exec.rs`。SUP-6・TASK-163.4・#503）: 稼働中コンテナへの setns・cgroup join・
      # 制限の再適用・execve の通し結合試験。rootful の pivot_root と cgroup v2 の書き込みに root が必要で、
      # hosted runner では実行しない（sudo の用途は増やさない）ため、ここでは型検査・ビルドだけを行う。
      # 実行は AGENTS.md「実機前提テスト」の手順で実機に対して行い、結果を PR に記録する。
      - name: exec のビルド（Linux のみ。実行は実機前提。SUP-6・TASK-163.4）
        if: runner.os == 'Linux' && env.HANG_PROBE != 'true'
        run: cargo test -p fandhe-container-supervisor --features exec-test-support --test exec --no-run

      # container_options_ipc（`crates/supervisor/tests/container_options_ipc.rs`。SUP-12・TASK-169.3・#528）:
      # `--ipc=host` / `shareable` の IPC namespace 共有・分離を検証する実機前提テスト（harness = false）。
      # unshare_isolation と同じく Linux 限定・上で緩和した sysctl を再利用し、新しい check-run・sudo・
      # permissions は追加しない。`--ignored` が届かなくても exit 0 になるため成功行を grep で照合する。
      - name: container_options_ipc のビルド（実行タイムアウトの時間枠を消費しないよう分離）
        if: runner.os == 'Linux' && env.HANG_PROBE != 'true'
        run: cargo test -p fandhe-container-supervisor --test container_options_ipc --no-run

      - name: container_options_ipc の実行（実機前提テスト・--ignored。SUP-12・TASK-169.3）
        if: runner.os == 'Linux' && env.HANG_PROBE != 'true'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/container_options_ipc.log"
          cargo test -p fandhe-container-supervisor --test container_options_ipc -- --ignored 2>&1 | tee "${log}"
          if ! grep -Fq 'container_options_ipc: host shared / shareable isolated verified (root=false)' "${log}"; then
            echo "::error::container_options_ipc did not report verification (possibly not executed)" >&2
            exit 1
          fi
          echo "container_options_ipc: host shared / shareable isolated verified (root=false)" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::container_options_ipc verified"

      # tmpfs_mount（`crates/core/tests/tmpfs_mount.rs`。SUP-12・TASK-169.2・#527）:
      # `--shm-size` / `--tmpfs` の実マウント（新マウント API: `fsopen`・`fsconfig`・`fsmount`・`move_mount`。
      # #1472）・失敗時の `umount2(2)` と作成ディレクトリの後始末・検査後の差し替え・
      # `ro,exec` の実フラグ・サイズ未指定のマウントを検証する実機前提テスト（harness = false）。
      # unshare_isolation と同じく Linux 限定・上で緩和した sysctl を再利用し、新しい check-run・sudo・
      # permissions は追加しない（rootless 経路のみ。rootful 経路は未検証）。`--ignored` が届かなくても
      # exit 0 になるため成功行を grep で照合する。
      - name: tmpfs_mount のビルド（実行タイムアウトの時間枠を消費しないよう分離）
        if: runner.os == 'Linux' && env.HANG_PROBE != 'true'
        run: cargo test -p fandhe-container-core --test tmpfs_mount --no-run

      - name: tmpfs_mount の実行（実機前提テスト・--ignored。SUP-12・TASK-169.2）
        if: runner.os == 'Linux' && env.HANG_PROBE != 'true'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/tmpfs_mount.log"
          cargo test -p fandhe-container-core --test tmpfs_mount -- --ignored 2>&1 | tee "${log}"
          if ! grep -Fq 'tmpfs_mount: mounts, flags and rollback verified (root=false)' "${log}"; then
            echo "::error::tmpfs_mount did not report verification (possibly not executed)" >&2
            exit 1
          fi
          echo "tmpfs_mount: mounts, flags and rollback verified (root=false)" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::tmpfs_mount verified"

      # inject_files（`crates/core/tests/inject_files.rs`。SUP-12・TASK-169.4.2・#1473）:
      # secrets / configs の専用 tmpfs への注入・read-only 再マウント・EROFS による書き込み拒否・
      # 失敗時の後始末・内容がホストのディスクへ出ないことを検証する実機前提テスト（harness = false）。
      # tmpfs_mount と同じく上で緩和した sysctl を再利用し、新しい check-run・sudo・permissions は
      # 追加しない（rootless 経路のみ。rootful 経路は未検証）。成功行を grep で照合する。
      - name: inject_files のビルド（実行タイムアウトの時間枠を消費しないよう分離）
        if: runner.os == 'Linux' && env.HANG_PROBE != 'true'
        run: cargo test -p fandhe-container-core --test inject_files --no-run

      - name: inject_files の実行（実機前提テスト・--ignored。SUP-12・TASK-169.4.2）
        if: runner.os == 'Linux' && env.HANG_PROBE != 'true'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/inject_files.log"
          cargo test -p fandhe-container-core --test inject_files -- --ignored 2>&1 | tee "${log}"
          if ! grep -Fq 'inject_files: content, read-only and rollback verified (root=false)' "${log}"; then
            echo "::error::inject_files did not report verification (possibly not executed)" >&2
            exit 1
          fi
          echo "inject_files: content, read-only and rollback verified (root=false)" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::inject_files verified"

  # --------------------------------------------------
  # bench-regression（ベンチ回帰「比較の仕組み」導入: TASK-86.3・REPAIR-7 第 4 段階・REPAIR-8）
  # --------------------------------------------------
  # ベンチ実行結果を基準値（benches/baseline.json）と比較し、15% 超の悪化を
  # 検出したら fail する判定ロジック（scripts/check-bench-regression.sh。閾値・
  # 判定式は同スクリプト内のコメントを参照）とその自己テスト・CI 組み込みを
  # TASK-86.3 で導入した。ただし計測対象は決定的な固定値を出力するだけの
  # プレースホルダベンチ（benches/benches/regression_placeholder.rs）と暫定基準値
  # （benches/baseline.json の placeholder: true）であり、実装の性能を計測して
  # いない。そのため本ジョブは実際の性能回帰を検出せず、実装が 15% 超悪化しても
  # 成功し続ける。本ジョブの成功を「性能回帰がない」根拠にしないこと。実測を
  # 伴う本物のベンチ（TASK-113・#269）と実測に基づく基準値（TASK-88・#227）へ
  # 置き換えて初めて、性能回帰ゲートとして機能する。
  # plugin 境界ベンチの Δp50（TASK-113.3）は計測ログ出力と fixture での判定検証まで
  # 接続済みで、基準値との常時比較は実測基準値の登録後（TASK-88.h1・TASK-113.h1）。
  #
  # ubuntu-latest 単独とし 3 OS matrix にしない: ベンチの数値は OS 間の実行環境
  # （CPU・ノイズ）が異なり比較できないこと、check-run が増えると ruleset
  # （branch protection）の登録作業が増えることが理由。ci.md「3 OS CI」の 3 OS ネイティブ実行は
  # ビルド・テストのゲート（platform-ci）を対象とする規則
  # であり、ベンチ回帰チェックはその対象外と整理する。
  bench-regression:
    runs-on: ubuntu-latest
    # ハングに対する多層防御（他ジョブの timeout-minutes と同じ位置づけ）
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - name: fio 4K ランダム write ベンチスクリプトの自己テスト（TASK-25.1・IO-8。実 fio は使わない）
        run: make fio-bench-selftest
      - name: fio ベースライン比算出スクリプトの自己テスト（TASK-25.2・IO-8。実 fio は使わない）
        run: make fio-baseline-ratio-selftest
      - name: ベンチ回帰比較スクリプトの自己テスト（受け入れ基準 2 の記録。REPAIR-12）
        run: make bench-check-selftest
      - name: baseline.json 生成スクリプトの自己テスト（TASK-88.1・REPAIR-8・REPAIR-12）
        run: make bench-baseline-selftest
      - name: 起動時間計測スクリプトの自己テスト（TASK-46.1・CORE-10。スタブランタイムで実ランタイムは使わない）
        run: make startup-latency-selftest
      # スタブ exe の固定 JSONL だけで集計値と異常系を照合し、実 netns・root は使わない（実測は TASK-140）
      - name: ネットワーク作成/接続/削除の所要時間計測スクリプトの自己テスト（TASK-139.5・NET-4・REPAIR-12）
        run: make net-setup-timing-selftest
      # スタブ exe・疑似 cgroup・疑似 /proc だけで集計値と PID 取得の異常系を照合し、実 netns・実 cgroup・root は使わない（実測は TASK-142）
      - name: DNS ヘルパー計測スクリプトの自己テスト（TASK-141.3・NET-5・REPAIR-12）
        run: make dns-helper-measure-selftest
      # 疑似 /proc（mktemp -d 配下）だけで照合し、ランナーの実プロセスは計測しない。
      # 非 root で実行されるため chmod 000 を使う読み取り失敗ケースも実行される
      - name: アイドル時常駐メモリ計測スクリプトの自己テスト（TASK-45.1・CORE-7・SUP-1・REPAIR-12）
        run: make idle-memory-selftest
      # スタブ launcher・スタブ docker CLI と疑似 /proc だけで照合し、実コンテナ・実ランタイム・実 Docker は使わない（docker・report モードを含む）
      - name: 50 コンテナ同時起動メモリ計測スクリプトの自己テスト（TASK-50.1・TASK-50.2・CORE-9・SUP-1・REPAIR-12）
        run: make concurrent-memory-selftest
      # スタブ計測・スタブ driver だけで照合し、実コンテナ・実プロセスは起動しない。実計測は root の操作者が明示実行する
      - name: 監視プロセス込みアイドル常駐メモリ回帰テストの自己テスト（TASK-47・CORE-7・SUP-1・REPAIR-12）
        run: make idle-memory-supervised-selftest
      # スタブ launcher だけで照合し、実コンテナ・実ランタイム・root は使わない。実機での N=50 実証は #499（人間担当）
      - name: 監視プロセス独立性実証スクリプトの自己テスト（TASK-162・SUP-5・REPAIR-12）
        run: make supervisor-independence-selftest
      # 疑似 /proc（mktemp -d 配下）だけで照合し、ランナーの実プロセスは計測しない（実測は製品バイナリ提供後に #485）
      - name: 監視プロセス常駐メモリ計測スクリプトの自己テスト（TASK-158・SUP-2・REPAIR-12）
        run: make supervisor-pss-selftest
      # スタブ launcher だけで照合し、実コンテナ・root は使わない。実機での実測と SUP-3 の判定は #491（人間担当）
      - name: restart レイテンシ計測スクリプトの自己テスト（TASK-160・SUP-3・REPAIR-12）
        run: make restart-latency-selftest
      - name: ベンチ比較の配線確認（プレースホルダ・性能回帰は未検出）
        run: make bench-check
      # 計測とログ出力のみ。baseline.json 未登録のため基準値比較はせず、Δp50 の 15% 回帰判定は
      # 上の bench-check-selftest（fixture）でのみ検証している（TASK-113.3・PLUG-5・REPAIR-8）。
      # 実測基準値の登録と bench-check 対象化は TASK-88.h1・TASK-113.h1 待ち。
      # check-run 名は増やさず既存ジョブのステップとする（本 workflow の check-run 件数は不変）
      - name: plugin 境界 Δp50 と CORE-10 比の計測ログ（計測とログ出力のみ・性能回帰は未判定。TASK-113.3）
        run: make bench-plugin-boundary
      # core の既定 / plugin 除外（--no-default-features）release ビルドと成果物サイズの記録
      # （PLUG-3・TASK-111.2・#263）。新ジョブは check-run 名が増え ruleset 変更が要るため
      # 既存ジョブのステップとする（本 workflow の check-run 件数は不変）。計測対象は rlib（最終バイナリ未実装。
      # TASK-79 後に実行ファイルへ切り替える）で、差は僅少のため軽量化効果の実測ではない
      - name: plugin feature 除外ビルドとサイズ記録（PLUG-3・TASK-111.2）
        shell: bash
        run: |
          set -euo pipefail
          make plugin-feature-size | tee -a "${GITHUB_STEP_SUMMARY}"

      # PLUG-4（TASK-109.4）: plugin 追加前後の別ビルドで core の指紋（ソース一覧・依存木・rlib sha256）を比較する。
      # スクリプトの自己テストは platform-ci ジョブ（pull_request は ubuntu、main は 3 OS）で実行する。
      # 既存ジョブのステップとして追加（check-run 件数は不変）
      - name: plugin 追加前後の core 不変性（PLUG-4・TASK-109.4）
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # pull_request では base を取得し、plugin 追加 PR が core を変更していないかも検査する
          if [ -n "${BASE_REF}" ]; then
            # merge-base を求めるため履歴を深くする（shallow なら unshallow してから base を取得）
            if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
              git fetch --no-tags --unshallow origin
            fi
            git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            export PLUG4_BASE_REF="origin/${BASE_REF}"
          fi
          make plug4-core-invariance

  # --------------------------------------------------
  # cross-target-check（Linux 上のクロス型検査: aarch64 Linux・macOS・Windows。
  # #1120・REPAIR-7 第 1 段階を補うアーキ・OS 網羅）
  # --------------------------------------------------
  # 旧 aarch64-linux-check（aarch64-unknown-linux-gnu のみ）を拡張したジョブ（2026-10-10 の 2 段階目の
  # 再構成・オーナー承認）。pull_request では platform-ci が ubuntu のみになり macOS・Windows の
  # ネイティブランナーを使わないため、x86_64 の ubuntu ランナー上で次の 3 ターゲットを順に型検査し、
  # OS・アーキ固有のコンパイルエラーと clippy 警告を PR ごとに検出する。
  #   - aarch64-unknown-linux-gnu: `cfg(target_arch = "aarch64")` 分岐（crates/io/src/sys.rs の
  #     SO_PEERCRED、seccomp・新マウント API の syscall 番号表等）
  #   - aarch64-apple-darwin: `cfg(target_os = "macos")` 分岐（platform-macos・plugin-macos の
  #     objc2 系 FFI 等）。macOS ランナー（GitHub ホステッドの macos-latest）は arm64 のため
  #   - x86_64-pc-windows-msvc: `cfg(target_os = "windows")` 分岐（platform-windows の windows-sys 等）。
  #     windows-latest ランナーと同じターゲット
  # check / clippy のみでリンクもテスト実行もしないため、実行時の正しさ（struct のレイアウト・
  # OS の挙動差・BSD / Git Bash のツール差）は保証しない。macOS・Windows の実行時の検証は
  # push（main）・workflow_dispatch の platform-ci（3 OS ネイティブ）が担い、aarch64 Linux での
  # 実行はネイティブ arm64 ランナーでのテスト実行が将来の課題（ci.md「3 OS CI」参照）。
  #
  # 外部依存は純 Rust のクレートのみ（serde / serde_json / sha2 と推移依存。ターゲットにより
  # libc・cpufeatures・objc2 系・windows-sys / windows-link も入る）で、build.rs・cc 等のネイティブ
  # ビルドを伴わないため、クロスリンカ・SDK（macOS SDK・MSVC）無しで成立する（2026-10-10 に
  # 3 ターゲットとも cargo check / clippy が通ることをローカルで確認）。cc 等ネイティブビルドを
  # 伴う依存を承認・追加した場合は、cross toolchain か各 OS のネイティブランナーへ切り替えること。
  # --locked・cache を使わないのは platform-ci と条件をそろえるため。ビルド・テストのゲートでは
  # なく型検査ゲートのため、ネイティブランナー規則の対象外とする（bench-regression と同じ整理。
  # ci.md「3 OS CI」参照）。
  #
  # 実コマンドはターゲットごとに `cargo check|clippy --workspace --all-targets --all-features
  # --target <target>`（AGENTS.md と一致。旧 aarch64-linux-check と同じ形）。--all-features を付けるのは、
  # required-features を持つ target（crates/io の crash_test_server bin・crash_safety test）、
  # `#![cfg(feature = "wsl2-test-support")]` の結合試験、exec-test-support の入口を
  # 型検査の対象に入れるため。feature は io の crash-test-server、core の
  # default = ["plugin"]・plugin・escape-probe・exec-test-support、supervisor の
  # exec-test-support、platform-windows の wsl2-test-support。exec-test-support は
  # 最適化ビルドで compile_error! になるが、check / clippy は dev プロファイルなので影響しない。
  # 未検査の範囲（REPAIR-3）: 既定 feature（--all-features なし）の構成・cfg(not(feature = "exec-test-support"))
  # 分岐（supervisor/tests/exec_setns_join.rs・core/tests/exec_child_setup.rs・
  # core/src/exec/reapply.rs の cfg_attr）・plugin を無効にした構成（--no-default-features）・rustdoc は
  # 本ジョブでは型検査されない（macOS・Windows では main の platform-ci が検査する）。x86_64 Linux でも、
  # lib 側の cfg_attr（core/src/exec/reapply.rs）は cargo build --workspace が、plugin 無効構成は
  # make test-core-no-plugin が検査するのみで、テスト側の cfg(not(feature)) 分岐は
  # 自己参照 dev-dependency による feature 統一で常に有効になるため、どの CI ジョブでも
  # 型検査されない。
  #
  # venus 試験治具（poc/venus-decoder/jig。ルート workspace 外。crates/plugin-macos へ path 依存。
  # GPU-6・TASK-172.4）も aarch64-apple-darwin で型検査する。治具は --workspace の対象外のため、
  # pull_request で plugin-macos の macOS 専用コードの変更が治具を壊しても他のステップでは
  # 検出できない（platform-ci の make poc-venus-jig-check は PR では ubuntu のみ）。
  # 治具の Cargo.lock を固定するため --locked を付ける（make poc-venus-jig-check と同じ）。
  cross-target-check:
    runs-on: ubuntu-latest
    # ハングに対する多層防御。旧 aarch64-linux-check（1 ターゲット）の実測は約 1 分で、3 ターゲットと
    # 治具でも数分の見込み。旧ジョブと同じ値を維持する
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: clippy
          targets: aarch64-unknown-linux-gnu,aarch64-apple-darwin,x86_64-pc-windows-msvc
      - name: cargo check（aarch64-unknown-linux-gnu・クロス型検査）
        run: cargo check --workspace --all-targets --all-features --target aarch64-unknown-linux-gnu
      - name: cargo clippy（aarch64-unknown-linux-gnu）
        run: cargo clippy --workspace --all-targets --all-features --target aarch64-unknown-linux-gnu -- -D warnings
      - name: cargo check（aarch64-apple-darwin・クロス型検査）
        run: cargo check --workspace --all-targets --all-features --target aarch64-apple-darwin
      - name: cargo clippy（aarch64-apple-darwin）
        run: cargo clippy --workspace --all-targets --all-features --target aarch64-apple-darwin -- -D warnings
      - name: cargo check（x86_64-pc-windows-msvc・クロス型検査）
        run: cargo check --workspace --all-targets --all-features --target x86_64-pc-windows-msvc
      - name: cargo clippy（x86_64-pc-windows-msvc）
        run: cargo clippy --workspace --all-targets --all-features --target x86_64-pc-windows-msvc -- -D warnings
      - name: venus 試験治具の cargo check（aarch64-apple-darwin・GPU-6・TASK-172.4）
        run: >-
          cargo check --manifest-path poc/venus-decoder/jig/Cargo.toml --locked --all-targets
          --target aarch64-apple-darwin
      - name: venus 試験治具の cargo clippy（aarch64-apple-darwin・GPU-6・TASK-172.4）
        run: >-
          cargo clippy --manifest-path poc/venus-decoder/jig/Cargo.toml --locked --all-targets
          --target aarch64-apple-darwin -- -D warnings

  # --------------------------------------------------
  # ci-complete（全ジョブ結果の fail-closed 集約ゲート）
  # --------------------------------------------------
  # lint-docs・rust-ci・platform-ci・bench-regression・cross-target-check の結果を
  # 集約し、いずれかが失敗・キャンセルされれば本ジョブも failure にする fail-closed ゲート。
  # rust-ci（ubuntu 1 要素）・platform-ci（pull_request は ubuntu 1 要素、push（main）・
  # workflow_dispatch は 3 OS）は matrix ジョブのため、needs 上では OS ごとの結果ではなく
  # 1 つの result に集約される（いずれかの OS が失敗・キャンセルされれば全体が failure /
  # cancelled になる。fail-fast: false でも集約結果には影響しない）。したがって本ジョブは
  # pull_request では ubuntu の結果だけを、push（main）・workflow_dispatch では 3 OS すべての
  # 結果を見る（判定ロジックはイベントで分けない）。
  #
  # ruleset（branch protection）の必須チェックには本ジョブに加え、本 workflow が
  # 生成する check-run 全件を個別に登録する（冒頭コメント参照。implement-issue-tree
  # の自動マージ前ゲート G0 が要求するため）。ジョブを追加・改名したら、本ジョブの
  # needs への追加（漏れると新ジョブの失敗が本ジョブに反映されない）に加えて、
  # ruleset の必須チェック一覧も同時に更新すること（更新漏れの影響: 増えた
  # チェックが未登録だと自動マージが G0 で止まる。改名された旧名が必須のまま
  # 残ると新たな check-run が報告されず全 PR がマージ不能になる）。ruleset の
  # 変更はリポジトリ設定の変更のためオーナー承認を経る。
  # 本 workflow の check-run の内訳は pull_request で 1 + lint-docs 5 + rust-ci (ubuntu-latest) 5 +
  # platform-ci (ubuntu-latest) 1 + bench-regression 1 + cross-target-check 1 = 14、push（main）・
  # workflow_dispatch では platform-ci が 3 件になり 16（冒頭コメントと一致させる）。
  # 2 段階目の再構成（pull_request で macOS・Windows のネイティブランナーを使わない。オーナー承認）で、
  # ruleset から platform-ci (macos-latest)・platform-ci (windows-latest)・aarch64-linux-check を外し、
  # cross-target-check を足す（差し替えは main セッションが行う）。
  # 2026-10-10 のジョブ再構成（macOS ランナー待ちの解消。オーナー承認）で、旧構成の
  # rust-ci (macos-latest|windows-latest) / * 10 件・rust-ci-default-features (<os>) 3 件・
  # integration-test (<os>) 3 件を platform-ci (<os>) 3 件へ差し替えた（ruleset の差し替えは
  # main セッションが行う）。ruleset の必須チェック全体は、PR の 14 件に ai-review.yml の codex 3 件と
  # 外部 App の Cursor Bugbot 1 件（本 workflow の外）を足した 18 件（冒頭コメント参照）。
  # platform-ci は if: を持たない（常に実行される）ため、allow_skipped には入れない。
  ci-complete:
    needs:
      [
        lint-docs,
        rust-ci,
        platform-ci,
        bench-regression,
        cross-target-check,
      ]
    if: always()
    permissions: {}
    runs-on: ubuntu-latest
    # 判定は jq のみの軽量処理のため短時間で終わる想定（ハング時の多層防御）
    timeout-minutes: 5
    steps:
      - name: needs の result を検証（fail-closed）
        env:
          # ${{ }} を run スクリプトへ直接埋め込むとログインジェクション /
          # スクリプトインジェクションの経路になるため、env 経由で受け渡す
          NEEDS_CONTEXT: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          # skipped を許容するジョブ名の明示リスト（現状は if: を持つ条件付き
          # ジョブが無いため空。将来 if: 付きジョブを追加する場合はここへ
          # ジョブ ID を追加し、skipped も合格扱いにする）
          allow_skipped=()

          # jq の失敗（needs が不正な JSON 等）でループが空回りして合格扱いに
          # ならないよう、プロセス置換ではなく変数へ先に取り出して set -e で止める。
          # needs の件数が 0 の場合も異常として扱う（fail-closed）
          entries="$(printf '%s' "${NEEDS_CONTEXT}" | jq -er 'to_entries[] | [.key, .value.result] | @tsv')"
          if [ -z "${entries}" ]; then
            echo "needs context is empty" >&2
            exit 1
          fi

          failed=""
          while IFS=$'\t' read -r job result; do
            if [ "${result}" = "success" ]; then
              continue
            fi
            skip_ok="false"
            for allowed in "${allow_skipped[@]:-}"; do
              if [ "${job}" = "${allowed}" ] && [ "${result}" = "skipped" ]; then
                skip_ok="true"
                break
              fi
            done
            if [ "${skip_ok}" = "true" ]; then
              continue
            fi
            failed="${failed}${job}: ${result}\n"
          done <<< "${entries}"

          if [ -n "${failed}" ]; then
            echo "The following required jobs did not succeed:" >&2
            printf '%b' "${failed}" >&2
            exit 1
          fi

          echo "All required jobs succeeded."
