      # テスト側の `ContainerRuntime`（`unshare(1)` で起動）を注入しているため、core の分離実装そのものは照合しない。
      # 他のステップと違い `harness = false` ではなく libtest で、試験が自分で出す成功行が無い。そのため libtest の
      # 結果行（`test <名前> ... ok`）を 1 行ずつ完全一致 grep する（`--ignored` が届かなければ `ignored` となり
      # `ok` の行が出ないので fail-closed）。`--test-threads=1` は、解放された namespace の inode 番号を並行して走る
      # 別の試験の新しい namespace が再利用し「参照者 0 件」の判定が誤って失敗するのを避けるため（判定は緩めない）。
