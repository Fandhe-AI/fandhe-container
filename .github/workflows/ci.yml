            exit 1
          fi
          echo "unshare_isolation: full isolation verified (root=false)" >> "$GITHUB_STEP_SUMMARY"
          echo "unshare_isolation: subordinate isolation kept the caller non-dumpable" >> "$GITHUB_STEP_SUMMARY"
