name: Linux env probe

# GitHub ホステッド Linux runner が issue #26（TASK-8・CLOSE-1・MS-0）の環境要件
# 「sudo / AppArmor 調整可能で /dev/kvm 権限のある Linux 環境」を満たせるかを
# 実測で確かめるための検証用ワークフロー。判定は人間が行う事項（ci.md・
# delegation-impl.md）のため、本ワークフローは計測結果を
# $GITHUB_STEP_SUMMARY へ表として出すところまでに留め、合否の最終判断は
# ユーザーへ委ねる。ただし x86_64 runner（assert_kvm=true）では、KVM 関連の
# プローブ（/dev/kvm open・API_VERSION=12・KVM_CREATE_VM・qemu の KVM 起動）の
# いずれか 1 つでも失敗した場合は明確な失敗として検出できるよう最後にジョブを
# fail させる（arm64・その他のプローブは失敗しても後続へ進み、結果を蓄積して表にする）。
#
# 発火条件は手動実行と本ファイルの変更時のみに絞る（広い発火条件は付けない）。
# runner イメージの更新で結果が変わり得るため、再確認用の手順として残す。
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/linux-env-probe.yml"

# GITHUB_TOKEN を使う処理（checkout・API 呼び出し）が無いため権限は付与しない
permissions: {}

concurrency:
  # PR ごとに一意な番号を group に含める（head_ref のみだと fork 間で同名ブランチの
  # 別 PR が同一グループになり、互いの CI を cancel し合う）
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------
  # probe（3 種類の GitHub ホステッド Linux runner で実機プローブ）
  # --------------------------------------------------
  # matrix.assert_kvm: x86_64 の 2 種（ubuntu-24.04 / ubuntu-22.04）は KVM が
  # 使えることを期待して最後に assert する。ubuntu-24.04-arm は KVM
  # （ネストした仮想化）を前提にできないため報告のみに留める。
  # fail-fast: false は 1 OS の失敗で他 OS の実行を打ち切らせないため
  # （3 種すべての実測結果を必ず得る）。
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04, ubuntu-24.04-arm]
        include:
          - os: ubuntu-24.04
            assert_kvm: true
          - os: ubuntu-22.04
            assert_kvm: true
          - os: ubuntu-24.04-arm
            assert_kvm: false
    runs-on: ${{ matrix.os }}
    # ハングしたジョブの無期限実行を防ぐ多層防御。L2 ゲスト起動プローブに
    # 90 秒の timeout を持たせているが、apt-get 等を含めた全体の上限として設定する
    timeout-minutes: 20
    permissions: {}
    defaults:
      run:
        shell: bash
    env:
      # 各ステップが記録した項目を貯めるための一時ファイル名（ジョブ内の
      # ステップ間でファイルシステムを共有できることを前提にする）。
      # 最後の集計ステップでここから summary 表を組み立てる。
      # runner context は job 単位の env: では参照できないため（actionlint 検出）、
      # 実際の絶対パスは各ステップの実行時に $RUNNER_TEMP（runner が設定する
      # 実環境変数）と組み合わせて "${RUNNER_TEMP}/${RESULTS_FILE}" として使う
      RESULTS_FILE: probe-results.tsv
    steps:
      # --------------------------------------------------
      # 1. 環境情報
      # --------------------------------------------------
      - name: Collect host environment info
        continue-on-error: true
        run: |
          set +e
          set +o pipefail
          RESULTS_FILE="${RUNNER_TEMP}/${RESULTS_FILE}"
          : > "${RESULTS_FILE}"
          record() { printf '%s\t%s\n' "$1" "$2" >> "${RESULTS_FILE}"; }

          record "ImageOS" "${ImageOS:-unknown}"
          record "ImageVersion" "${ImageVersion:-unknown}"
          record "kernel (uname -r)" "$(uname -r)"
          record "arch (uname -m)" "$(uname -m)"

          os_pretty="$(grep -m1 '^PRETTY_NAME=' /etc/os-release 2>/dev/null | cut -d= -f2- | tr -d '"')"
          record "OS PRETTY_NAME" "${os_pretty:-unknown}"

          record "nproc" "$(nproc)"

          mem_total="$(free -m | awk '/^Mem:/ {print $2}')"
          record "memory total (MB)" "${mem_total:-unknown}"

          cpu_model="$(grep -m1 '^model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ *//')"
          record "CPU model" "${cpu_model:-not reported}"

          vmx_svm="$(grep -cwE 'vmx|svm' /proc/cpuinfo)"
          record "vmx/svm flag count (/proc/cpuinfo)" "${vmx_svm:-0}"

          virt_type="$(systemd-detect-virt 2>/dev/null || echo "detection failed")"
          record "systemd-detect-virt" "${virt_type}"
          exit 0

      # --------------------------------------------------
      # 2. sudo
      # --------------------------------------------------
      - name: Check passwordless sudo
        continue-on-error: true
        run: |
          set +e
          set +o pipefail
          RESULTS_FILE="${RUNNER_TEMP}/${RESULTS_FILE}"
          record() { printf '%s\t%s\n' "$1" "$2" >> "${RESULTS_FILE}"; }
          if sudo -n true 2>/dev/null; then
            record "sudo -n true" "success"
          else
            record "sudo -n true" "failed"
          fi
          exit 0

      # --------------------------------------------------
      # 3. /dev/kvm（アクセス権付与前）
      # --------------------------------------------------
      - name: Check /dev/kvm before ACL grant
        continue-on-error: true
        run: |
          set +e
          set +o pipefail
          RESULTS_FILE="${RUNNER_TEMP}/${RESULTS_FILE}"
          record() { printf '%s\t%s\n' "$1" "$2" >> "${RESULTS_FILE}"; }
          if [ -e /dev/kvm ]; then
            record "/dev/kvm before ACL grant" "$(ls -l /dev/kvm)"
          else
            record "/dev/kvm before ACL grant" "not present"
          fi
          exit 0

      # --------------------------------------------------
      # 4. /dev/kvm へのアクセス権付与
      # --------------------------------------------------
      # udev ルールで MODE="0666" にする例が多いが、全ユーザーへの書き込み許可は
      # 最小権限に反するため、ACL でジョブ実行ユーザーだけに rw を付与する
      - name: Grant /dev/kvm access to the runner user
        continue-on-error: true
        run: |
          set +e
          set +o pipefail
          RESULTS_FILE="${RUNNER_TEMP}/${RESULTS_FILE}"
          record() { printf '%s\t%s\n' "$1" "$2" >> "${RESULTS_FILE}"; }
          if [ -e /dev/kvm ]; then
            if ! command -v setfacl >/dev/null 2>&1; then
              sudo apt-get install -y -qq acl >/dev/null
            fi
            if sudo setfacl -m "u:$(id -un):rw" /dev/kvm; then
              acl_users="$(getfacl -p /dev/kvm 2>/dev/null | grep '^user:[^:]' | tr '\n' ' ')"
              record "/dev/kvm after ACL grant" "$(ls -l /dev/kvm) / ${acl_users}"
            else
              record "/dev/kvm after ACL grant" "setfacl failed"
            fi
          else
            record "/dev/kvm after ACL grant" "not applicable (no /dev/kvm)"
          fi
          exit 0

      # --------------------------------------------------
      # 5. KVM ioctl（非 root で /dev/kvm を open して確認）
      # --------------------------------------------------
      - name: Probe KVM ioctls as non-root
        continue-on-error: true
        run: |
          set +e
          set +o pipefail
          RESULTS_FILE="${RUNNER_TEMP}/${RESULTS_FILE}"
          record() { printf '%s\t%s\n' "$1" "$2" >> "${RESULTS_FILE}"; }

          probe_out="$(python3 - <<'PY'
          import fcntl
          import os

          # KVM_GET_API_VERSION / KVM_CREATE_VM の ioctl 番号（KVM API の固定値。
          # 期待する API_VERSION は 12）
          KVM_GET_API_VERSION = 0xAE00
          KVM_CREATE_VM = 0xAE01

          try:
              fd = os.open("/dev/kvm", os.O_RDWR)
          except OSError as exc:
              print(f"open_error={exc}")
              raise SystemExit

          print("open_ok=true")

          try:
              version = fcntl.ioctl(fd, KVM_GET_API_VERSION)
              print(f"api_version={version}")
          except OSError as exc:
              print(f"api_version_error={exc}")

          try:
              vm_fd = fcntl.ioctl(fd, KVM_CREATE_VM, 0)
              print(f"create_vm_fd={vm_fd}")
          except OSError as exc:
              print(f"create_vm_error={exc}")

          os.close(fd)
          PY
          )"
          echo "${probe_out}"

          open_ok="false"
          api_ok="false"
          create_vm_ok="false"

          if printf '%s\n' "${probe_out}" | grep -q '^open_ok=true'; then
            open_ok="true"
            record "KVM ioctl: open /dev/kvm" "success"
          else
            open_error="$(printf '%s\n' "${probe_out}" | grep -m1 '^open_error' || echo "failed")"
            record "KVM ioctl: open /dev/kvm" "${open_error}"
          fi

          api_line="$(printf '%s\n' "${probe_out}" | grep -m1 '^api_version')"
          if printf '%s' "${api_line}" | grep -q '^api_version=12$'; then
            api_ok="true"
          fi
          record "KVM ioctl: KVM_GET_API_VERSION (expect 12)" "${api_line:-skipped (open failed)}"

          # create_vm_fd= と create_vm_error= の両方を拾い、失敗理由を表に残す
          vm_line="$(printf '%s\n' "${probe_out}" | grep -m1 '^create_vm')"
          if printf '%s' "${vm_line}" | grep -Eq '^create_vm_fd=[0-9]+$'; then
            create_vm_ok="true"
          fi
          record "KVM ioctl: KVM_CREATE_VM" "${vm_line:-skipped (open failed)}"

          {
            echo "KVM_OPEN_OK=${open_ok}"
            echo "KVM_API_OK=${api_ok}"
            echo "KVM_CREATE_VM_OK=${create_vm_ok}"
          } >> "$GITHUB_ENV"
          exit 0

      # --------------------------------------------------
      # 6. ネストした仮想化の設定（参考情報。assert はしない）
      # --------------------------------------------------
      - name: Check nested virtualization parameter
        continue-on-error: true
        run: |
          set +e
          set +o pipefail
          RESULTS_FILE="${RUNNER_TEMP}/${RESULTS_FILE}"
          record() { printf '%s\t%s\n' "$1" "$2" >> "${RESULTS_FILE}"; }
          nested="none"
          if [ -e /sys/module/kvm_intel/parameters/nested ]; then
            nested="$(cat /sys/module/kvm_intel/parameters/nested)"
          elif [ -e /sys/module/kvm_amd/parameters/nested ]; then
            nested="$(cat /sys/module/kvm_amd/parameters/nested)"
          fi
          record "nested virtualization parameter" "${nested}"
          exit 0

      # --------------------------------------------------
      # 7. L2 ゲスト起動（x86_64 かつ KVM_CREATE_VM 成功時のみ）
      # --------------------------------------------------
      - name: Boot minimal L2 guest under KVM
        if: matrix.assert_kvm == true && env.KVM_CREATE_VM_OK == 'true'
        continue-on-error: true
        run: |
          set +e
          set +o pipefail
          RESULTS_FILE="${RUNNER_TEMP}/${RESULTS_FILE}"
          record() { printf '%s\t%s\n' "$1" "$2" >> "${RESULTS_FILE}"; }

          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86
          # qemu パッケージ導入時の udev 再適用で /dev/kvm の ACL が初期化されるため
          # （実測で Permission denied になった）、起動直前に付け直す
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm

          # ホストカーネルは root 専用読み取り（0600）のため、非 root の qemu プロセスが
          # 読めるコピーを作業ディレクトリへ用意する
          kernel_copy="${RUNNER_TEMP}/vmlinuz-probe"
          sudo install -m 0644 "/boot/vmlinuz-$(uname -r)" "${kernel_copy}"

          log_file="${RUNNER_TEMP}/l2-guest-boot.log"
          start_ts="$(date +%s.%N)"
          timeout 90 qemu-system-x86_64 \
            -accel kvm -cpu host -m 256 -nographic -no-reboot \
            -kernel "${kernel_copy}" \
            -append 'console=ttyS0 panic=-1' \
            > "${log_file}" 2>&1
          qemu_status=$?
          end_ts="$(date +%s.%N)"
          duration="$(awk -v a="${start_ts}" -v b="${end_ts}" 'BEGIN { printf "%.1f", b - a }')"

          echo "---- last 20 lines of guest boot log ----"
          tail -n 20 "${log_file}"
          echo "---- end of guest boot log ----"

          # initrd を渡していないため root マウントに失敗して panic する想定
          # （panic=-1 で即座に再起動を要求し、-no-reboot により QEMU がそこで終了する）。
          # 成否は KVM 上でゲストカーネルが動いたこと（ブートメッセージ "Linux version"）で
          # 判定し、終了経路（正常終了か timeout の exit 124 か）は結果に併記するだけにする
          if grep -q 'Linux version' "${log_file}"; then
            if [ "${qemu_status}" -eq 124 ]; then
              exit_note="terminated by timeout"
            else
              exit_note="qemu exit=${qemu_status}"
            fi
            record "L2 guest boot (qemu+kvm)" "kernel started in ${duration}s (${exit_note})"
            echo "L2_BOOT_OK=true" >> "$GITHUB_ENV"
          else
            record "L2 guest boot (qemu+kvm)" "failed (no kernel boot message, qemu exit=${qemu_status}, ${duration}s)"
            echo "L2_BOOT_OK=false" >> "$GITHUB_ENV"
          fi
          exit 0

      - name: Record L2 guest boot as skipped
        if: "!(matrix.assert_kvm == true && env.KVM_CREATE_VM_OK == 'true')"
        continue-on-error: true
        run: |
          set +e
          set +o pipefail
          RESULTS_FILE="${RUNNER_TEMP}/${RESULTS_FILE}"
          record() { printf '%s\t%s\n' "$1" "$2" >> "${RESULTS_FILE}"; }
          record "L2 guest boot (qemu+kvm)" "skipped (assert_kvm=false or KVM_CREATE_VM failed)"
          echo "L2_BOOT_OK=false" >> "$GITHUB_ENV"
          exit 0

      # --------------------------------------------------
      # 8. user namespace / AppArmor（報告のみ。fail させない）
      # --------------------------------------------------
      - name: Check user namespace and AppArmor restrictions
        continue-on-error: true
        run: |
          set +e
          set +o pipefail
          RESULTS_FILE="${RUNNER_TEMP}/${RESULTS_FILE}"
          record() { printf '%s\t%s\n' "$1" "$2" >> "${RESULTS_FILE}"; }

          max_userns="$(cat /proc/sys/user/max_user_namespaces 2>/dev/null || echo "unknown")"
          record "max_user_namespaces" "${max_userns}"

          apparmor_restrict="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo "none")"
          record "apparmor_restrict_unprivileged_userns (before)" "${apparmor_restrict}"

          if unshare -Ur true 2>/dev/null; then
            record "unshare -Ur true (before adjustment)" "success"
          else
            record "unshare -Ur true (before adjustment)" "failed"
          fi

          if [ "${apparmor_restrict}" = "1" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 >/dev/null 2>&1
            apparmor_restrict_after="$(
              sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo "none"
            )"
            record "apparmor_restrict_unprivileged_userns (after adjustment)" "${apparmor_restrict_after}"

            if unshare -Ur true 2>/dev/null; then
              record "unshare -Ur true (after adjustment)" "success"
            else
              record "unshare -Ur true (after adjustment)" "failed"
            fi
          else
            record "apparmor_restrict_unprivileged_userns (after adjustment)" \
              "not applicable (already 0 or unavailable)"
            record "unshare -Ur true (after adjustment)" "not applicable"
          fi

          if unshare -Urmpf --mount-proc true 2>/dev/null; then
            record "unshare -Urmpf --mount-proc true (after adjustment)" "success"
          else
            record "unshare -Urmpf --mount-proc true (after adjustment)" "failed"
          fi
          exit 0

      # --------------------------------------------------
      # 9. cgroup
      # --------------------------------------------------
      - name: Check cgroup configuration
        continue-on-error: true
        run: |
          set +e
          set +o pipefail
          RESULTS_FILE="${RUNNER_TEMP}/${RESULTS_FILE}"
          record() { printf '%s\t%s\n' "$1" "$2" >> "${RESULTS_FILE}"; }
          fs_type="$(stat -fc %T /sys/fs/cgroup 2>/dev/null || echo "unknown")"
          record "/sys/fs/cgroup filesystem type (expect cgroup2fs)" "${fs_type}"
          controllers="$(cat /sys/fs/cgroup/cgroup.controllers 2>/dev/null || echo "unknown")"
          record "cgroup.controllers" "${controllers}"
          exit 0

      # --------------------------------------------------
      # 10. seccomp / Landlock
      # --------------------------------------------------
      - name: Check seccomp and Landlock availability
        continue-on-error: true
        run: |
          set +e
          set +o pipefail
          RESULTS_FILE="${RUNNER_TEMP}/${RESULTS_FILE}"
          record() { printf '%s\t%s\n' "$1" "$2" >> "${RESULTS_FILE}"; }

          seccomp="$(grep '^Seccomp:' /proc/self/status 2>/dev/null || echo "unknown")"
          record "Seccomp (/proc/self/status)" "${seccomp}"

          lsm_list="$(sudo cat /sys/kernel/security/lsm 2>/dev/null || echo "unavailable")"
          record "active LSMs (/sys/kernel/security/lsm)" "${lsm_list}"

          landlock_abi="$(python3 - <<'PY'
          import ctypes

          libc = ctypes.CDLL(None, use_errno=True)
          libc.syscall.restype = ctypes.c_long

          # landlock_create_ruleset(NULL, 0, LANDLOCK_CREATE_RULESET_VERSION) は
          # ABI バージョン問い合わせ専用の呼び出し。syscall 番号 444 は
          # x86_64 / aarch64 で共通
          LANDLOCK_CREATE_RULESET = 444
          LANDLOCK_CREATE_RULESET_VERSION = 1 << 0

          ret = libc.syscall(LANDLOCK_CREATE_RULESET, None, 0, LANDLOCK_CREATE_RULESET_VERSION)
          if ret < 0:
              err = ctypes.get_errno()
              print(f"error (errno={err})")
          else:
              print(f"abi_version={ret}")
          PY
          )"
          record "Landlock ABI version" "${landlock_abi}"
          exit 0

      # --------------------------------------------------
      # 集計・summary 出力
      # --------------------------------------------------
      - name: Build step summary table
        if: always()
        continue-on-error: true
        env:
          MATRIX_OS: ${{ matrix.os }}
          ASSERT_KVM: ${{ matrix.assert_kvm }}
        run: |
          RESULTS_FILE="${RUNNER_TEMP}/${RESULTS_FILE}"
          # Step Summary は API で取得できないため、gh run view --log で読めるよう
          # 同じ表をジョブログにも出す（tee）
          {
            echo "### Linux env probe results — ${MATRIX_OS} (assert_kvm=${ASSERT_KVM})"
            echo ""
            echo "| Item | Result |"
            echo "| ---- | ------ |"
            if [ -f "${RESULTS_FILE}" ]; then
              while IFS=$'\t' read -r item value; do
                escaped_value="${value//|/\\|}"
                echo "| ${item} | ${escaped_value} |"
              done < "${RESULTS_FILE}"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      # --------------------------------------------------
      # KVM 判定（assert_kvm=true の runner のみ。arm64 は報告のみで fail させない）
      # --------------------------------------------------
      - name: Assert all KVM checks succeeded (x86_64 runners only)
        if: always()
        env:
          ASSERT_KVM: ${{ matrix.assert_kvm }}
        run: |
          if [ "${ASSERT_KVM}" != "true" ]; then
            echo "assert_kvm is false for this runner; reporting only, not asserting."
            exit 0
          fi

          failed=""
          kvm_checks=(
            "open /dev/kvm after ACL grant:${KVM_OPEN_OK:-false}"
            "KVM_GET_API_VERSION=12:${KVM_API_OK:-false}"
            "KVM_CREATE_VM:${KVM_CREATE_VM_OK:-false}"
            "qemu KVM guest boot:${L2_BOOT_OK:-false}"
          )
          for check in "${kvm_checks[@]}"; do
            name="${check%%:*}"
            result="${check##*:}"
            if [ "${result}" != "true" ]; then
              failed="${failed}${name}; "
            fi
          done

          if [ -n "${failed}" ]; then
            echo "The following KVM checks did not succeed on this x86_64 runner: ${failed}" >&2
            exit 1
          fi

          echo "All KVM checks succeeded."

  # --------------------------------------------------
  # escape-suite-probe（ubuntu-latest で ESC スイートの実機ケースを実行できるかの計測。
  # #2022・TASK-43 追補・SEC-2。計測のみで必須チェックではない。ケースの失敗では
  # ジョブを落とさず、結果を表にして記録する）
  # #2483: 加えて opt-in のカーネル監査の段（FANDHE_CONTAINER_TEST_KERNEL_AUDIT=1。
  # ESC-01・07・10 の LANDLOCK_ACCESS）と landlock_audit_exec を回せるかを計測する
  # （SEC-4・REPAIR-7）。計測のみで platform-ci へは組み込まない（組み込みは人間の判断）。
  # sudo の用途は AppArmor 緩和・auditd の導入・audit ログの ACL 付与・root での
  # テストバイナリ実行に限る（エフェメラルな runner のみ。全ユーザーへの許可はしない）
  # --------------------------------------------------
  # yamllint disable rule:line-length
  escape-suite-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        timeout-minutes: 10
        with:
          toolchain: stable
      - name: Record environment (kernel, Landlock ABI, LSM)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set +e
          abi="$(python3 - <<'PY'
          import ctypes
          libc = ctypes.CDLL(None, use_errno=True)
          libc.syscall.restype = ctypes.c_long
          ret = libc.syscall(444, None, 0, 1)
          print(f"abi_version={ret}" if ret >= 0 else f"error (errno={ctypes.get_errno()})")
          PY
          )"
          {
            echo "### escape-suite-probe environment"
            echo "- ImageOS: ${ImageOS:-unknown}"
            echo "- ImageVersion: ${ImageVersion:-unknown}"
            echo "- kernel: $(uname -r)"
            echo "- arch: $(uname -m)"
            echo "- os: $(. /etc/os-release && echo "${PRETTY_NAME}")"
            echo "- LSM: $(sudo cat /sys/kernel/security/lsm 2>/dev/null || echo unavailable)"
            echo "- apparmor_restrict_unprivileged_userns(before): $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo n/a)"
            echo "- max_user_namespaces: $(cat /proc/sys/user/max_user_namespaces 2>/dev/null || echo n/a)"
            echo "- sudo: $(sudo -n true 2>/dev/null && echo ok || echo no)"
            echo "- Landlock ABI: ${abi}"
            echo "- kernel config (AUDIT/AUDITSYSCALL/SECURITY_LANDLOCK): $(grep -E '^CONFIG_(AUDIT|AUDITSYSCALL|SECURITY_LANDLOCK)=' "/boot/config-$(uname -r)" 2>/dev/null | tr '\n' ' ')"
            echo "- cmdline audit=/lsm= tokens: $(grep -oE '(^| )(audit|lsm)=[^ ]*' /proc/cmdline 2>/dev/null | tr '\n' ' ')"
            echo "- auditd (before): command=$(command -v auditd || echo none) active=$(systemctl is-active auditd 2>&1 | head -n1) log=$(ls /var/log/audit/audit.log 2>/dev/null || echo none)"
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Relax AppArmor unprivileged userns restriction
        timeout-minutes: 2
        run: |
          set -euo pipefail
          key_file="/proc/sys/kernel/apparmor_restrict_unprivileged_userns"
          if [ -e "${key_file}" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            value="$(cat "${key_file}")"
            [ "${value}" = "0" ] || { echo "::error::value is ${value}" >&2; exit 1; }
            echo "apparmor_restrict_unprivileged_userns(after)=${value}" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install and start auditd (kernel audit measurement)
        continue-on-error: true
        timeout-minutes: 8
        run: |
          set +e
          {
            echo "### auditd install (#2483)"
            sudo apt-get update -qq > /dev/null 2>&1
            sudo apt-get install -y -qq --no-install-recommends auditd acl > /dev/null 2>&1
            echo "- apt-get install auditd acl (exit): $?"
            sudo systemctl start auditd 2>&1 | head -n3
            echo "- systemctl is-active auditd: $(systemctl is-active auditd 2>&1 | head -n1)"
            echo "- auditctl -s: $(sudo auditctl -s 2>&1 | grep -E '^(enabled|failure|backlog_limit|lost) ' | tr '\n' ';')"
            echo "- audit.log: $(sudo ls -l /var/log/audit/audit.log 2>&1 | awk '{print $1, $3, $4}')"
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build escape_suite (unprivileged user)
        timeout-minutes: 20
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/esc-build.json"
          cargo test -p fandhe-container-core --test escape_suite --no-run --message-format=json > "${out}"
          bins="$(jq -r 'select(.profile.test == true and .target.name == "escape_suite") | .executable' "${out}" | grep -v '^null$' | sort -u)"
          [ -n "${bins}" ] && [ "$(printf '%s\n' "${bins}" | wc -l)" = "1" ] || { echo "::error::expected exactly one escape_suite binary" >&2; exit 1; }
          echo "ESC_BIN=${bins}" >> "$GITHUB_ENV"
      - name: Run escape_suite --ignored (non-root)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set +e
          FANDHE_CONTAINER_TEST_TIMEOUT_SECS=30 "${ESC_BIN}" --ignored 2>&1 | tee "${RUNNER_TEMP}/esc-nonroot.log"
          echo "exit=${PIPESTATUS[0]}" > "${RUNNER_TEMP}/esc-nonroot.exit"
      - name: Run escape_suite --ignored (root via sudo)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set +e
          sudo -n env FANDHE_CONTAINER_TEST_TIMEOUT_SECS=30 "${ESC_BIN}" --ignored 2>&1 | tee "${RUNNER_TEMP}/esc-root.log"
          echo "exit=${PIPESTATUS[0]}" > "${RUNNER_TEMP}/esc-root.exit"
      - name: Run escape_suite --ignored with kernel audit (root via sudo)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set +e
          sudo -n env FANDHE_CONTAINER_TEST_KERNEL_AUDIT=1 FANDHE_CONTAINER_TEST_TIMEOUT_SECS=30 "${ESC_BIN}" --ignored 2>&1 | tee "${RUNNER_TEMP}/esc-root-kaudit.log"
          echo "exit=${PIPESTATUS[0]}" > "${RUNNER_TEMP}/esc-root-kaudit.exit"
      - name: Run escape_suite --ignored with kernel audit (non-root, audit log read via ACL)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set +e
          # ジョブ実行ユーザーだけに audit ログの読み取りを付与する（全ユーザーへは許可しない）
          me="$(id -un)"
          sudo setfacl -m "u:${me}:x" /var/log/audit
          sudo setfacl -m "u:${me}:r" /var/log/audit/audit.log
          echo "setfacl (exit)=$?" | tee -a "$GITHUB_STEP_SUMMARY"
          FANDHE_CONTAINER_TEST_KERNEL_AUDIT=1 FANDHE_CONTAINER_TEST_TIMEOUT_SECS=30 "${ESC_BIN}" --ignored 2>&1 | tee "${RUNNER_TEMP}/esc-nonroot-kaudit.log"
          echo "exit=${PIPESTATUS[0]}" > "${RUNNER_TEMP}/esc-nonroot-kaudit.exit"
      - name: Build landlock_audit_exec (unprivileged user)
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/lae-build.json"
          cargo test -p fandhe-container-core --test landlock_audit_exec --no-run --message-format=json > "${out}"
          bins="$(jq -r 'select(.profile.test == true and .target.name == "landlock_audit_exec") | .executable' "${out}" | grep -v '^null$' | sort -u)"
          [ -n "${bins}" ] && [ "$(printf '%s\n' "${bins}" | wc -l)" = "1" ] || { echo "::error::expected exactly one landlock_audit_exec binary" >&2; exit 1; }
          echo "LAE_BIN=${bins}" >> "$GITHUB_ENV"
      - name: Run landlock_audit_exec --ignored (root via sudo)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set +e
          sudo -n env FANDHE_CONTAINER_TEST_TIMEOUT_SECS=30 "${LAE_BIN}" --ignored 2>&1 | tee "${RUNNER_TEMP}/lae-root.log"
          echo "exit=${PIPESTATUS[0]}" > "${RUNNER_TEMP}/lae-root.exit"
      - name: Summarize escape_suite verdicts
        if: always()
        timeout-minutes: 3
        run: |
          set +e
          {
            for mode in nonroot root nonroot-kaudit root-kaudit; do
              echo "### escape_suite verdicts (${mode}) $(cat "${RUNNER_TEMP}/esc-${mode}.exit" 2>/dev/null || echo exit=missing)"
              grep -E '^escape_suite: .*(verdict=|harness verified|audit not verified|kernel_audit=)' "${RUNNER_TEMP}/esc-${mode}.log" 2>/dev/null | cut -c1-300
            done
            echo "### landlock_audit_exec (root) $(cat "${RUNNER_TEMP}/lae-root.exit" 2>/dev/null || echo exit=missing)"
            grep -E '^landlock_audit_exec:' "${RUNNER_TEMP}/lae-root.log" 2>/dev/null | cut -c1-300
            echo "### audit.log LANDLOCK_ACCESS (count and redacted head)"
            sudo grep -c 'type=LANDLOCK_ACCESS' /var/log/audit/audit.log 2>&1
            sudo grep 'type=LANDLOCK_ACCESS' /var/log/audit/audit.log 2>/dev/null | head -n 3 | sed -E 's/(auid|ses)=[^ ]*/\1=<redacted>/g' | cut -c1-300
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          grep -qE '^escape_suite:' "${RUNNER_TEMP}/esc-nonroot.log" "${RUNNER_TEMP}/esc-root.log" 2>/dev/null || { echo "::error::no escape_suite output" >&2; exit 1; }

  # --------------------------------------------------
  # id-mapping-probe（ubuntu-latest で production_launcher のシナリオ I〔launcher 経由の
  # 範囲写像〕の前提を満たせるかの計測。#2244・CORE-6・SEC-5・REPAIR-7。計測のみで
  # 必須チェックではない。各項目の失敗ではジョブを落とさず、結果を表にして記録する）
  # --------------------------------------------------
  # production_launcher は A〜P を 1 つのバイナリで実行するため、シナリオ I 単独では
  # 回せない。前提は uidmap（setuid の newuidmap / newgidmap）・自ユーザーの
  # /etc/subuid・/etc/subgid の行・非 root の呼び出し元へ委譲された cgroup v2
  # サブツリー。本ジョブは特に「委譲 cgroup をどの経路で得られるか」を測る。
  # 結果は platform-ci へ組み込むかの判断材料（AGENTS.md の production_launcher の項）。
  id-mapping-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    defaults:
      run:
        shell: bash
    steps:
      - name: Probe uidmap, subordinate ids and delegated cgroup
        continue-on-error: true
        timeout-minutes: 8
        run: |
          set +e
          out="${RUNNER_TEMP}/idmap-probe.tsv"
          : > "${out}"
          record() { printf '%s\t%s\n' "$1" "$2" >> "${out}"; }
          me="$(id -un)"

          record "ImageOS / ImageVersion" "${ImageOS:-unknown} / ${ImageVersion:-unknown}"
          record "kernel" "$(uname -r)"
          record "user (id -un / id -u / USER set)" "${me} / $(id -u) / ${USER:+yes}"

          # uidmap と subuid / subgid（導入前の状態。値は範囲の数値のみで秘密情報ではない）
          record "uidmap package (before)" "$(dpkg-query -W -f='${Status}' uidmap 2>&1 | head -n1)"
          record "newuidmap / newgidmap (before)" "$(stat -c '%n %A %U' /usr/bin/newuidmap /usr/bin/newgidmap 2>&1 | tr '\n' ';')"
          record "subuid line (before)" "$(grep "^${me}:" /etc/subuid 2>&1 | head -n1)"
          record "subgid line (before)" "$(grep "^${me}:" /etc/subgid 2>&1 | head -n1)"

          if [ ! -u /usr/bin/newuidmap ] || [ ! -u /usr/bin/newgidmap ]; then
            sudo apt-get install -y -qq --no-install-recommends uidmap > /dev/null 2>&1
            record "apt-get install uidmap (exit)" "$?"
          fi
          record "newuidmap / newgidmap (after)" "$(stat -c '%n %A %U' /usr/bin/newuidmap /usr/bin/newgidmap 2>&1 | tr '\n' ';')"
          record "getcap newuidmap / newgidmap" "$(getcap /usr/bin/newuidmap /usr/bin/newgidmap 2>&1 | tr '\n' ';')"

          if ! grep -q "^${me}:" /etc/subuid 2>/dev/null; then
            sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "${me}"
            record "usermod add subuid/subgid (exit)" "$?"
          fi
          record "subuid line (after)" "$(grep "^${me}:" /etc/subuid 2>&1 | head -n1)"
          record "subgid line (after)" "$(grep "^${me}:" /etc/subgid 2>&1 | head -n1)"

          # userns の制限（newuidmap 経路にも効く）
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null)" = "1" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 > /dev/null 2>&1
          fi
          record "apparmor_restrict_unprivileged_userns (after)" "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo n/a)"

          # ステップ自身の cgroup（委譲されていないと production_launcher の prepare は失敗する）
          self_cg="$(cut -d: -f3 /proc/self/cgroup)"
          record "own cgroup" "${self_cg}"
          record "own cgroup owner / procs / subtree_control" "$(stat -c '%U' "/sys/fs/cgroup${self_cg}" 2>&1) / $(wc -l < "/sys/fs/cgroup${self_cg}/cgroup.procs" 2>&1) procs / $(cat "/sys/fs/cgroup${self_cg}/cgroup.subtree_control" 2>&1)"

          # ユーザー systemd マネージャ（値は出さず有無だけ記録する）
          record "XDG_RUNTIME_DIR set / DBUS_SESSION_BUS_ADDRESS set" "${XDG_RUNTIME_DIR:+yes} / ${DBUS_SESSION_BUS_ADDRESS:+yes}"
          record "loginctl list-users" "$(loginctl list-users --no-legend 2>&1 | tr '\n' ';')"
          sysrun="$(systemctl --user is-system-running 2>&1 | head -n1)"
          record "systemctl --user is-system-running" "${sysrun}"

          # 委譲 cgroup を得る経路を、追加の特権が少ない順に試す
          # 本番の DelegatedCgroup::detect / prepare が要求する条件（各インターフェースファイルの所有者・
          # cgroup.type・所属プロセス・利用可能な controller。REPAIR-4）も合わせて記録する
          probe_cmd='cg=$(cut -d: -f3 /proc/self/cgroup); d=/sys/fs/cgroup${cg}; pl=; while read -r x; do pl="${pl}${x},"; done < ${d}/cgroup.procs; echo "uid=$(id -u) cg=${cg} owner=$(stat -c %U ${d}) procs_owner=$(stat -c %U ${d}/cgroup.procs 2>&1) subtree_owner=$(stat -c %U ${d}/cgroup.subtree_control 2>&1) type=$(cat ${d}/cgroup.type 2>&1) pids=${pl} self=$$ controllers=$(cat ${d}/cgroup.controllers 2>&1)"'
          r1="$(timeout 30 systemd-run --user --scope -p Delegate=yes sh -c "${probe_cmd}" 2>&1 | tr '\n' ' ')"
          record "path1 systemd-run --user --scope (no extra privilege)" "${r1:0:600}"

          sudo loginctl enable-linger "${me}" > /dev/null 2>&1
          record "path2 enable-linger (exit)" "$?"
          sleep 3
          r2="$(XDG_RUNTIME_DIR="/run/user/$(id -u)" timeout 30 systemd-run --user --scope -p Delegate=yes sh -c "${probe_cmd}" 2>&1 | tr '\n' ' ')"
          record "path2 systemd-run --user --scope after linger" "${r2:0:600}"

          r3="$(sudo -n timeout 30 systemd-run --uid="$(id -u)" --gid="$(id -g)" -p Delegate=yes --wait --pipe --collect sh -c "${probe_cmd}" 2>&1 | tr '\n' ' ')"
          record "path3 transient service with User= and Delegate=yes" "${r3:0:600}"

          # rootless 系・supervisor・CLI の実機前提試験（#2596）の追加前提。値ではなく有無と数値だけを記録する
          record "Landlock ABI (syscall 444)" "$(python3 -c 'import ctypes; l=ctypes.CDLL(None, use_errno=True); print(l.syscall(444, None, 0, 1))' 2>&1 | head -n1)"
          record "systemd user manager private socket" "$([ -S "${XDG_RUNTIME_DIR}/systemd/private" ] && echo present || echo absent)"

          {
            echo "### id-mapping-probe results (production_launcher scenario I prerequisites)"
            echo ""
            echo "| Item | Result |"
            echo "| ---- | ------ |"
            while IFS=$'\t' read -r item value; do
              echo "| ${item} | ${value//|/\\|} |"
            done < "${out}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
