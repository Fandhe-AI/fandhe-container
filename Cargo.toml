# fandhe-container の仮想 workspace ルート。
# TASK-1（REPAIR-1・MS-0）。crate 一覧の出典は docs/design/crate-naming.md（#9・TASK-1.h1）。

[workspace]
# edition 2024 の仮想 workspace は resolver が暗黙に 1 になるため明示する。
resolver = "3"
# メンバー crate の実体は TASK-1.3（#11）で作成済み（docs/design/crate-naming.md の表の順、
# 最後に benches を追加）。crate を追加する際はこの一覧に追記し、対応する Cargo.toml・src/lib.rs
# を crates/<短縮名>/ に置く（コメント規約は .claude/rules/code-comment-style.md）。
# 新 crate の Cargo.toml には `[lints] workspace = true` も書く（[workspace.lints] の継承。#1138）。
members = [
    "crates/io",
    "crates/core",
    "crates/supervisor",
    "crates/guest-init", # macOS ゲスト用 PID 1（#1823 のオーナー判断 2026-10-12・#1875。crate-naming.md の表 #20）
    "crates/oci",
    "crates/cri",
    "crates/platform-macos",
    "crates/platform-windows",
    "crates/microvm",
    "crates/cli",
    "crates/plugin",
    "crates/gpu",
    "crates/net",
    "crates/stack",
    "crates/compose-convert",
    "crates/plugin-cri",
    "crates/plugin-macos",
    "crates/plugin-windows",
    "crates/plugin-microvm",
    "crates/plugin-mcp",
    "benches", # fandhe-container-benches（publish = false。crate-naming.md 決定 7）
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-container"

# 全メンバー crate が `[lints] workspace = true` で継承する lint 設定（#1138・REPAIR-9・TASK-86）。
# unsafe に `// SAFETY:` を付けることは sys モジュールの unsafe 事前承認条件であり（.claude/rules/coding-rust.md）、
# `unsafe` ブロックと `unsafe impl` の欠落を clippy で機械照合する。`unsafe extern` ブロックは対象外のため
# レビューで確かめる。`clippy::missing_safety_doc` は style グループで既定 warn（-D warnings で有効）のため
# ここには足さない。素の `cargo clippy`（-D warnings なし）でも失敗させるため warn でなく deny にする。
# メンバー crate は `[lints] workspace = true` を書かないと継承されないため、crate 追加時は必ず書く。
[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

# 共通依存の集約先。追加は =x.y.z 完全固定・ユーザー承認制（.claude/rules/dependency-policy.md）。
# 採用済みは serde / serde_json（承認: Issue #138・TASK-29.hdep1。OCI config.json のパース用）・sha2（#278）・
# objc2 系 5 件（#356・TASK-64.hdep1）・windows-sys（#371・TASK-67.hdep1）・
# ureq / rustls / rustls-graviola / rustls-native-certs（#399・TASK-51.hdep1。crates/oci のレジストリクライアント用）。
# tonic-prost-build / protox（#425・TASK-56.hdep1。build 時のみ）・tonic / tonic-prost / prost（#425。crates/cri の実行時依存。TASK-56.4）・
# tokio（#425 のオーナー判断 2026-10-10 で承認、workspace への追加は #453・TASK-108.1。crates/plugin の feature `grpc` のみ）・hyper-util（#425 の承認、追加は #454・TASK-108.2。同 feature のみ）。
# toml（#582・TASK-149.hdep1。crates/stack の独自 TOML スタック定義用。追加は #583・TASK-149.1）。
# workspace 内 crate の path 依存は外部クレートの追加ではない（TASK-111.1・#262・PLUG-3。core の optional 依存用）。
[workspace.dependencies]
fandhe-container-plugin = { path = "crates/plugin" }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = "=1.0.151"
# plugin バイナリの sha256 許可済みハッシュ照合（PLUG-11・TASK-122.3）。承認: Issue #278・TASK-122.hdep1。
# 純 Rust・MIT OR Apache-2.0。alloc / oid は不要のため default-features を無効化する。
sha2 = { version = "=0.11.0", default-features = false }
# macOS Virtualization.framework の橋渡し（MAC-1・TASK-64.1）。承認: Issue #356・TASK-64.hdep1。
# crates/platform-macos から cfg(target_os = "macos") ターゲット限定で参照する。features はメンバー側で列挙する。
# AppKit（objc2-app-kit）は引かない方針（VZVirtualMachineView は使わない）。
# 0.6.5 へ更新（承認: Issue #1889・#1895）。aarch64 macOS の release ビルドの use-after-free 修正版（upstream madsmtm/objc2 #861）。
objc2 = { version = "=0.6.5", default-features = false }
objc2-foundation = { version = "=0.3.2", default-features = false }
objc2-virtualization = { version = "=0.3.2", default-features = false }
block2 = { version = "=0.6.2", default-features = false }
dispatch2 = { version = "=0.3.1", default-features = false }
# Windows API の FFI 宣言（WIN-1・TASK-67.3）。承認: Issue #371・TASK-67.hdep1。
# crates/platform-windows から cfg(windows) ターゲット限定で参照し、features はメンバー側で使う名前空間のみ列挙する。
windows-sys = { version = "=0.61.2", default-features = false }
# NFC/NFD の別表記の衝突検出（IO-5・TASK-21.1）。承認: Issue #798（2026-09-26）、#1720（2026-10-10）で再確認。
# 配置は crates/io に限る。使うのは正準分解（nfd()）だけで、互換分解・合成は使わない。
# 純 Rust・MIT OR Apache-2.0。推移依存は tinyvec（alloc）のみ。nfd() は alloc だけで動くため std を無効化する。
unicode-normalization = { version = "=0.1.25", default-features = false }
# OCI レジストリクライアントの HTTP/TLS（OCI-1・TASK-51.1）。承認: Issue #399・TASK-51.hdep1（2026-10-10）。
# 配置は crates/oci に限る。暗号は rustls-graviola（純 Rust）に固定し、ring / aws-lc-rs / webpki-roots は引かない。
# Cargo.lock には rustls-webpki の optional 依存として ring / cc の項目が残るが、これは rustls-webpki 側の
# `ring?/alloc`（weak feature）をロック解決が拾うためで、有効な feature には ring が無く、
# `cargo tree -e normal,build -i ring --target all` は何も出力しない（ビルド・リンクされない）。
# rustls は RUSTSEC-2026-0346〜0349 の修正版 0.23.46。ルート証明書は OS のストア（rustls-native-certs）から読む。
ureq = { version = "=3.4.2", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "tls12", "logging"] }
rustls-graviola = { version = "=0.4.0" }
rustls-native-certs = { version = "=0.8.4" }
# cri-api の .proto から gRPC コードを生成する build.rs 用（CRI-3・TASK-56.3）。承認: Issue #425・TASK-56.hdep1。
# crates/cri の [build-dependencies] だけで使う（実行時の依存ではない）。protoc は使わず protox が純 Rust で .proto を解析する。
# cleanup-markdown（既定 feature）は外す。prost-build / tonic-build は推移依存として入り Cargo.lock で固定される。
tonic-prost-build = { version = "=0.14.6", default-features = false, features = ["transport"] }
protox = "=0.9.1"
# 生成した gRPC コードの取り込み先（CRI-3・TASK-56.4）。承認: Issue #425・TASK-56.hdep1。
# cri / plugin の gRPC 面のみで使い、core には入れない（PLUG-1・CORE-1）。承認条件のとおり `router` を有効にする。
tonic = { version = "=0.14.6", default-features = false, features = ["codegen", "transport", "router"] }
tonic-prost = "=0.14.6"
prost = "=0.14.4"
# gRPC 面（PLUG-2・TASK-108.1）の非同期ランタイム。承認: Issue #425 のオーナー判断（2026-10-10）、追加は #453。
# cri / plugin の gRPC 面に限り使い、core には入れない（PLUG-1・CORE-1・PLUG-4）。features はメンバー側で
# 承認範囲（rt / net / time / macros）から必要なものだけ列挙する。
tokio = { version = "=1.53.3", default-features = false }
# gRPC 面の UDS 接続（connector の `TokioIo`。PLUG-2・TASK-108.2）。承認: Issue #425 のオーナー判断（2026-10-10。依存要点に
# 「UDS の接続（#454）に hyper-util」と明記）、追加は #454。tonic の推移依存として Cargo.lock に既存（新規パッケージなし）。
# crates/plugin の feature `grpc` のみで使い、core には入れない（PLUG-1・CORE-1・PLUG-4）。features はメンバー側で列挙する。
hyper-util = { version = "=0.1.21", default-features = false }

# OCI レイヤー blob の gzip 展開（OCI-1・TASK-52.2）。承認: Issue #406・TASK-52.hdep2（オーナー判断 2026-10-10）。
# 配置は crates/oci に限る。backend は純 Rust の zlib-rs（libz-sys / cc を引かない）。展開後サイズの上限は呼び出し側で検証する。
# 純 Rust・MIT OR Apache-2.0（zlib-rs は Zlib）。default-features を無効化する。
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }
# OCI レイヤー tar の解析（OCI-1・TASK-52.3）。承認: Issue #408（オーナー判断 2026-10-10）。配置は crates/oci に限る。
# 解析（エントリ列挙）だけに使い、`Entry::unpack` / `unpack_in` は使わない（展開は crates/oci で自作する）。
# MIT OR Apache-2.0。xattr 等の既定 feature を無効化する。
tar = { version = "=0.4.46", default-features = false }
# YAML（CDI spec。GPU-1・TASK-126.1）。承認: Issue #540（2026-10-10）。配置は crates/gpu と crates/compose-convert に限り core には入れない。
# default-features を無効化し deserialize のみ有効にする。パースは from_str_with_options で Budget を明示し duplicate_keys: Error を維持する。
serde-saphyr = { version = "=1.3.0", default-features = false, features = ["deserialize"] }
# 独自 TOML スタック定義の parse / serialize（STACK-1・CLI-4）。承認: Issue #582・TASK-149.hdep1（オーナー判断 2026-10-10）。追加は #583・TASK-149.1。
# 配置は crates/stack（crates/compose-convert は必要になったときに限る）。`unbounded` は有効にせず既定の再帰上限 80 を保つ（深いネストによる DoS への備え）。
# crates.io 上の版は `1.1.8+spec-1.1.0` で、`=1.1.8` で一致する。
toml = { version = "=1.1.8", default-features = false, features = ["std", "serde", "parse", "display"] }
# 自前 FFI 宣言（各 crate の `sys`）と libc の機械照合（MVM-4・REPAIR-7・REPAIR-12）。承認: Issue #86・#1318（オーナー判断 2026-10-12）。
# dev-dependencies 専用。製品コードの依存（[dependencies]・[build-dependencies]）に入れない。製品の syscall・ioctl は各 crate の
# `sys` の自前宣言のままで、libc へは切り替えない。照合の方式は docs/design/ffi-libc-check.md（#1838）。
# 照合に使うのは定数・型・関数宣言だけで `std` feature は要らないため default-features を無効化する。
libc = { version = "=0.2.189", default-features = false }

# 依存クレート（workspace メンバー以外）のデバッグ情報を行番号のみにする。
# ローカルの `target/` は依存グラフ全体（tonic / prost・protox・objc2 系等）の full debuginfo が
# 容量とリンク時間を押し上げる。開発時に依存の内部変数・型をデバッガで追う必要は薄いため、
# それを諦めて両方を減らす。
# - 残るもの: panic 位置・バックトレースの file:line・プロファイラの行番号
# - 失うもの: デバッガ（lldb / gdb）で依存クレートの変数・型を見る機能のみ
# - `"*"` はメンバー以外にだけ効くため、本リポの crate は full debuginfo のまま
# - 依存のビルドスクリプト・proc-macro（`build-override` 側の既定は debuginfo なし）にも
#   適用され行番号付きになる（`build-override` より `package."*"` が優先されるため
#   打ち消せない）。増分は依存本体の削減に比べて小さい
# - `test` プロファイルは `dev` を継承し package 指定も継承されるため `cargo test` にも効く。
#   `release`・`bench`（`release` 継承）は既定どおり debuginfo なしで影響しない
# - 別 workspace の `poc/venus-decoder/jig` には効かない（profile は各 workspace のルートでのみ有効）
# CI の `rust-ci`（reusable `rust-base-ci`）の target キャッシュの key は Cargo.toml を含まないため、
# 本設定を変えたときは main の `fandhe-container-Linux-{clippy,test}-v4-*` を削除して保存し直させる
# （.claude/rules/github-actions.md「キャッシュ方針」）。
[profile.dev.package."*"]
debug = "line-tables-only"
