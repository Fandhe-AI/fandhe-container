# cargo-about 設定（TASK-103.1・OSS-5・MS-1 Phase 2）。
# 役割: 配布物へ同梱するサードパーティのライセンス表記を生成するときの、対象依存と受理
# ライセンスの定義。呼び出し元は `scripts/generate-third-party-licenses.sh`（`-c` で本ファイルを
# 渡す。`make third-party-licenses` 経由）。テンプレートは about.hbs。
# 検査（許可外ライセンスの fail-closed 検出）は deny.toml の cargo-deny が担い、本ファイルは
# 「表記の生成」だけを担う。cargo-about は Dockerfile と `make install-cargo-about` で版固定導入する（TASK-103.2）。

# deny.toml の [licenses].allow と同じ集合・同じ順で同期させる。片方だけ足さない。
# 識別子の追加は依存追加のユーザー承認（dependency-policy）とセットで行い、
# コピーレフト（GPL/LGPL/MPL 等）は列挙しない。
# `Apache-2.0 WITH LLVM-exception` を含め cargo-about 0.9.2 が受理することを実機で確認済み（TASK-103.2）。
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
]

# CI の cross-target-check の 3 ターゲットとホストに合わせ、3 OS・2 アーキの依存
# （objc2 系・windows-sys・libc 等）がすべて表記に現れるようにする。
# all-features は設定ファイルに書けないため、スクリプトが `--all-features` で指定する
# （deny.toml の [graph].all-features = true に合わせる）。
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

# dev 依存は配布物に入らないため表記から除く。deny.toml の include-dev = true は
# 監査のための設定で、こちらは配布物の表記のための設定であり、目的が異なる。
ignore-dev-dependencies = true
# proc-macro・build 依存が生成するコードはバイナリに入りうるため、保守的に含める。
ignore-build-dependencies = false
ignore-transitive-dependencies = false

# workspace の全メンバー crate は publish = false のため、自 crate は表記から除く。
# 本体のライセンスはルートの LICENSE-APACHE / LICENSE-MIT で示している。
# なお poc/venus-decoder/jig はルート workspace の外の PoC で配布しないため対象外
# （依存監査は make deny-poc-venus-jig が別に行う）。
[private]
ignore = true
