# crate をまたぐベンチ（TASK-113）と基準値（TASK-88・REPAIR-8）を置く root の workspace メンバー crate。
# 19 crate の確定一覧とは別枠で、`publish = false` を明示する（crate-naming.md 決定 7）。
# 雛形は TASK-1.3（#11・REPAIR-1・MS-0）。
#
# Cargo のベンチ自動発見は `<crate>/benches/*.rs` を探すため、本 crate（root `benches/`）配下では
# 実際の配置が `benches/benches/*.rs` になる。TASK-113.2（#271）で `path` 明示なしの自動発見位置に
# 統一すると決めた（plugin_boundary も同じ）。計測ロジックは `benches/src/` のライブラリ側に置き、
# `cargo test` でユニットテストする。ベンチの枠組みクレート（criterion 等）は使わず、
# まずは `harness = false` の自前計測で始める（依存を足すならユーザー承認が要る）。
#
# version は未指定（Cargo の既定で 0.0.0）。
# 依存の追加は =x.y.z 完全固定・ユーザー承認制（.claude/rules/dependency-policy.md）。
#
# [[bench]] regression_placeholder は TASK-86.3（REPAIR-7 第 4 段階・REPAIR-8）で
# CI のベンチ回帰ゲートを暫定的に稼働させるための stub ベンチ（本文は
# benches/regression_placeholder.rs。決定的な固定値を出力するだけで実測はしない）。
#
# [[bench]] plugin_boundary は TASK-113.2（#271・PLUG-5）の代表操作 B（イメージ一覧）計測ハーネス。
# `fandhe-container-plugin` への依存は workspace 内 path 依存（crates.io の外部依存の追加ではない。
# 前例: supervisor -> core）。

[package]
name = "fandhe-container-benches"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
fandhe-container-plugin = { path = "../crates/plugin" }

[[bench]]
name = "regression_placeholder"
harness = false

[[bench]]
name = "plugin_boundary"
harness = false
