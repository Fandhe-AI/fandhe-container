# crate をまたぐベンチ（TASK-113）と基準値（TASK-88・REPAIR-8）を置く root の workspace メンバー crate。
# 19 crate の確定一覧とは別枠で、`publish = false` を明示する（crate-naming.md 決定 7）。
# 雛形は TASK-1.3（#11・REPAIR-1・MS-0）。
#
# Cargo のベンチ自動発見は `<crate>/benches/*.rs` を探すため、本 crate（root `benches/`）配下では
# 実際の配置が `benches/benches/*.rs` になる。TASK-113.1 で `path` 明示はせず、この自動発見に
# 任せる配置方式に決定した。ベンチの枠組みクレート（criterion 等）は使わず、
# `harness = false` の自前計測とする（依存を足すならユーザー承認が要る）。
# `fandhe-container-plugin` は workspace 内の path 依存（外部クレートの追加ではない）。
#
# version は未指定（Cargo の既定で 0.0.0）。
# 依存の追加は =x.y.z 完全固定・ユーザー承認制（.claude/rules/dependency-policy.md）。
#
# [[bench]] regression_placeholder は TASK-86.3（REPAIR-7 第 4 段階・REPAIR-8）で
# CI のベンチ回帰ゲートを暫定的に稼働させるための stub ベンチ（本文は
# benches/regression_placeholder.rs。決定的な固定値を出力するだけで実測はしない）。
# [[bench]] plugin_boundary は TASK-113.1 の代表操作 A ベンチ（PLUG-5・PLUG-6）。
# Δp50 metric（TASK-113.3）も出力する。baseline.json 未登録のため bench-check にはまだ接続しない（実測基準値は TASK-88.h1・TASK-113.h1）。

[package]
name = "fandhe-container-benches"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bench]]
name = "regression_placeholder"
harness = false

[[bench]]
name = "plugin_boundary"
harness = false

[dependencies]
fandhe-container-plugin = { path = "../crates/plugin" }

# [[bench]] plugin_boundary_list_images は TASK-113.2（#271・PLUG-5）の代表操作 B（イメージ一覧）計測ハーネス。
# 代表操作 A（plugin_boundary。TASK-113.1）とは別ターゲットで、Δp50（TASK-113.3）も出力する。ゲート（bench-check）へは未接続（同上）。
[[bench]]
name = "plugin_boundary_list_images"
harness = false
