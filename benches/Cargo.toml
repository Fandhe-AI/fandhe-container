# crate をまたぐベンチ（TASK-113）と基準値（TASK-88・REPAIR-8）を置く root の workspace メンバー crate。
# 19 crate の確定一覧とは別枠で、`publish = false` を明示する（crate-naming.md 決定 7）。
# 雛形は TASK-1.3（#11・REPAIR-1・MS-0）。
#
# Cargo のベンチ自動発見は `<crate>/benches/*.rs` を探すため、本 crate（root `benches/`）配下では
# 実際の配置が `benches/benches/*.rs` になるか、`[[bench]] path` の明示指定が要る。どちらにするかは
# TASK-113（`benches/plugin_boundary.rs`）で決める。ベンチの枠組みクレート（criterion 等）は使わず、
# まずは `harness = false` の自前計測で始める（依存を足すならユーザー承認が要る）。
#
# version は未指定（Cargo の既定で 0.0.0）。
# 依存の追加は =x.y.z 完全固定・ユーザー承認制（.claude/rules/dependency-policy.md）。

[package]
name = "fandhe-container-benches"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
