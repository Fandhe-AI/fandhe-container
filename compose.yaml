# 開発コンテナの compose 定義（dev は make docker-build / docker-shell、ci は make docker-ci から利用）。
# 詳細は Dockerfile 冒頭のコメント参照。Fandhe-AI/rust-ai-library と同一方針。
services:
  dev:
    build:
      context: .
      args:
        # macOS の Docker Desktop では既定 1000 で問題ない。Linux ホストでは
        # `HOST_UID=$(id -u) docker compose build` で所有権を合わせられる
        # （環境変数名を HOST_UID とするのは、`UID` が Bash の読み取り専用変数で
        # `UID=$(id -u)` の形の指定が失敗するため）
        UID: ${HOST_UID:-1000}
    volumes:
      - .:/work
      # cargo のレジストリ・ビルドキャッシュを named volume に載せ、再ビルドを高速化する
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/work/target
    working_dir: /work
    command: bash
    stdin_open: true
    tty: true

  # make docker-ci 専用。dev と同じ設定で seccomp だけ外す（CORE-5・REPAIR-7・#2235）。
  # seccomp_enforcement / exec_restrictions_reapply は「外側に seccomp フィルタが無い」
  # ことを対照の前提にし、Docker 既定プロファイルでは kcmp が EPERM・Seccomp: 2 になって
  # 失敗するため。テストの skip・弱体化はしない。非 root・privileged 無し・cap_add 無しは
  # dev から引き継ぐ。docker-shell（dev）は既定 seccomp のまま。
  ci:
    extends:
      service: dev
    security_opt:
      - seccomp=unconfined

volumes:
  cargo-registry:
  target-cache:
