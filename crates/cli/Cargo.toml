# 統一 CLI・基本コマンド（create/start/stop/delete/list/logs/ps）、観測性（crate-naming.md の表 #9）。
# 雛形は TASK-1.3（#11・REPAIR-1・MS-0）。本体は G6（TASK-79〜98 の一部）で実装する。
# バイナリ `fandhe-container` の `[[bin]]` と `src/main.rs` は TASK-79.1（#638）で定義した（外部依存の追加なし）。
# version は未指定（Cargo の既定で 0.0.0）。公開方針は未決定のため publish = false を明記する。
# 依存の追加は =x.y.z 完全固定・ユーザー承認制（.claude/rules/dependency-policy.md）。

[package]
name = "fandhe-container-cli"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "fandhe-container"
path = "src/main.rs"

# NET-10 の診断（doctor）が net の読み取り照会を使う workspace 内 path 依存（TASK-148.1。外部クレートの追加ではない）。
[dependencies]
fandhe-container-net = { path = "../net" }
# create / start が core の oci_runtime を直接呼ぶ workspace 内 path 依存（TASK-79.2.1。外部クレートの追加ではない）。
fandhe-container-core = { path = "../core" }
# 親が受けた SIGINT・SIGTERM・SIGHUP を起動中の plugin へ転送する API を使う workspace 内 path 依存（#1513・PLUG-7。外部クレートの追加ではない）。
fandhe-container-plugin = { path = "../plugin" }

# workspace の lint 設定を継承する（ルート Cargo.toml の [workspace.lints]。#1138）。
[lints]
workspace = true
