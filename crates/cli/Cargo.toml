# 統一 CLI・基本コマンド（create/start/stop/delete/list/logs/ps）、観測性（crate-naming.md の表 #9）。
# 雛形は TASK-1.3（#11・REPAIR-1・MS-0）。本体は G6（TASK-79〜98 の一部）で実装する。
# バイナリ `fandhe-container` の `[[bin]]` と `src/main.rs` は TASK-79.1（#638）で定義した（外部依存の追加なし）。
# version は未指定（Cargo の既定で 0.0.0）。公開方針は未決定のため publish = false を明記する。
# 依存の追加は =x.y.z 完全固定・ユーザー承認制（.claude/rules/dependency-policy.md）。

[package]
name = "fandhe-container-cli"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "fandhe-container"
path = "src/main.rs"

# NET-10 の診断（doctor）が net の読み取り照会を使う workspace 内 path 依存（TASK-148.1。外部クレートの追加ではない）。
[dependencies]
fandhe-container-net = { path = "../net" }
# create / start が core の oci_runtime を直接呼ぶ workspace 内 path 依存（TASK-79.2.1。外部クレートの追加ではない）。
# core の plugin feature は下の cli の `plugin` feature が連動して有効にする（PLUG-3・#3204）。
fandhe-container-core = { path = "../core", default-features = false }
# 親が受けた SIGINT・SIGTERM・SIGHUP を起動中の plugin へ転送する API を使う workspace 内 path 依存（#1513・PLUG-7。外部クレートの追加ではない）。
# `plugin` feature の下の optional 依存（PLUG-3・#3204。無効なら plugin 境界基盤をリンクしない）。
fandhe-container-plugin = { path = "../plugin", optional = true }
# start が supervisor の bin を起動し、結果の 1 行を契約の型（`start_contract::StartReport`）で復号するための workspace 内 path 依存
# （#1718・REPAIR-2。外部クレートの追加ではない。循環なし: supervisor は core にのみ依存する）。
fandhe-container-supervisor = { path = "../supervisor" }
# image ls / system df / image rm が oci の管理 API（`image_management`）を呼ぶ workspace 内 path 依存
# （#2221・CLI-1・OCI-7。外部クレートの追加ではない。循環なし: oci は cli に依存しない）。
fandhe-container-oci = { path = "../oci" }

# signal-test-support: 結合試験（tests/signal_forward.rs）の plugin 役が使う、固定の記録ハンドラ（受信番号を
# 原子変数へ store するだけ）の登録と読み出し（`signals::install_recording_handler_for_test`・
# `signals::recorded_signal_for_test`）と、継承した SIG_IGN を上書きする記録ハンドラの登録・fork した子でシグナルを
# 受ける入口（`signals::install_recording_handler_overriding_ignore_for_test`・`signals::fork_and_raise_for_test`。
# #1605）と、環境変数 `FANDHE_CONTAINER_TEST_SIGNAL_INSTALL_FAILURE` による登録失敗の注入（#1778）を公開する（#1513・PLUG-7・PR #1572 事後監査の P2）。既定のビルドには
# 含めない。リリースビルドで有効にするとコンパイルが止まる（src/lib.rs の `compile_error!`）。依存は増えない。
[features]
# plugin: plugin 境界基盤（シグナル転送・延期した後始末の記録）と core の `plugin` feature を有効にする（既定で有効。PLUG-3・#3204）。
# 無効（`--no-default-features`）なら plugin crate がリンクされず、起動対象を構築する経路自体が無い（fail-open にならない）。
# `make plugin-feature-size` が CLI の実行ファイルの既定 / 除外を比べる。
default = ["plugin"]
plugin = ["dep:fandhe-container-plugin", "fandhe-container-core/plugin"]
signal-test-support = []
# start-test-support: start が systemd-run を解決する入口に、環境変数 `FANDHE_CONTAINER_TEST_SYSTEMD_RUN`（絶対パス）による
# 差し替えを足す（偽の systemd-run で既定集合の結合試験を動かすため。#2081・CORE-3）。既定のビルドには含めず、
# リリースビルドで有効にするとコンパイルが止まる（src/lib.rs の `compile_error!`）。依存は増えない。
start-test-support = []
# logs-test-support: logs --follow の期限を環境変数 `FANDHE_CONTAINER_TEST_LOGS_FOLLOW_DEADLINE_MS`（10 進ミリ秒）で短くできる
# ようにする（既定の期限は 24 時間で、終わる結合試験を書けないため。#2447・CLI-1・SUP-7）。既定のビルドには含めず、
# リリースビルドで有効にするとコンパイルが止まる（src/lib.rs の `compile_error!`）。依存は増えない。
logs-test-support = []

# 自己参照の dev-dependency（supervisor・core と同じ仕組み。外部クレートの追加ではない）: cli 自身のテストでは
# `signal-test-support`・`start-test-support`・`logs-test-support` を常に有効にし、試験専用の入口を使う結合試験（signal_forward）が `cargo test --workspace`
# の既定のテスト集合から外れないようにする。通常のビルド（`cargo build`・リリース成果物）は dev-dependency を
# 解決しないため、feature は無効のまま。
[dev-dependencies]
fandhe-container-cli = { path = ".", features = ["signal-test-support", "start-test-support", "logs-test-support"] }
# 実機前提の通し試験（tests/start_stop_delete_real.rs。#2450）のコンテナ内プローブが、core の
# `exec::exit_on_sigterm_for_test`（SIGTERM で `_exit(43)` するハンドラの登録）を使うための workspace 内 path 依存の
# feature の受け渡し（外部クレートの追加ではない）。通常のビルドは dev-dependency を解決しないため feature は無効のまま
# で、リリースビルドで有効にすると core の `compile_error!` が止める。
fandhe-container-supervisor = { path = "../supervisor", features = ["exec-test-support"] }

# `sys.rs` の自前 FFI 宣言を libc と照合する試験専用の依存（#1838・#1318・MVM-4・REPAIR-12）。製品の依存には入れない
# （cargo tree -e normal,build に現れない）。`sys.rs` は `cfg(unix)` のため unix に限る。方式は docs/design/ffi-libc-check.md。
[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

# workspace の lint 設定を継承する（ルート Cargo.toml の [workspace.lints]。#1138）。
[lints]
workspace = true

# 実機前提の結合試験（#2081）。`harness = false` の単一 main で、`-- --ignored` のときだけ実機シナリオを動かす。
[[test]]
name = "start_scope_real"
harness = false

# 実機前提の結合試験（#2061）。`harness = false` の単一 main で、`-- --ignored` のときだけ実機シナリオを動かす。
[[test]]
name = "delete_cgroup_real"
harness = false

# 実機前提の結合試験（#2011）。`harness = false` の単一 main で、`-- --ignored` のときだけ実機シナリオを動かす。
[[test]]
name = "start_recover_real"
harness = false

# 実機前提の通し試験（#2450）。`harness = false` の単一 main で、`-- --ignored` のときだけ実機シナリオを動かす。
[[test]]
name = "start_stop_delete_real"
harness = false

# 実機前提の結合試験（#3345）。`harness = false` の単一 main で、`-- --ignored` のときだけ実機シナリオを動かす。
[[test]]
name = "network_modes_real"
harness = false
