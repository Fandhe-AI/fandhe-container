# 統一 CLI・基本コマンド（create/start/stop/delete/list/logs/ps）、観測性（crate-naming.md の表 #9）。
# 雛形は TASK-1.3（#11・REPAIR-1・MS-0）。本体は G6（TASK-79〜98 の一部）で実装する。
# バイナリ `fandhe-container` の `[[bin]]` と `src/main.rs` は TASK-79.1（#638）で定義した（外部依存の追加なし）。
# version は未指定（Cargo の既定で 0.0.0）。公開方針は未決定のため publish = false を明記する。
# 依存の追加は =x.y.z 完全固定・ユーザー承認制（.claude/rules/dependency-policy.md）。

[package]
name = "fandhe-container-cli"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "fandhe-container"
path = "src/main.rs"

# NET-10 の診断（doctor）が net の読み取り照会を使う workspace 内 path 依存（TASK-148.1。外部クレートの追加ではない）。
[dependencies]
fandhe-container-net = { path = "../net" }
# create / start が core の oci_runtime を直接呼ぶ workspace 内 path 依存（TASK-79.2.1。外部クレートの追加ではない）。
fandhe-container-core = { path = "../core" }
# 親が受けた SIGINT・SIGTERM・SIGHUP を起動中の plugin へ転送する API を使う workspace 内 path 依存（#1513・PLUG-7。外部クレートの追加ではない）。
fandhe-container-plugin = { path = "../plugin" }

# signal-test-support: 結合試験（tests/signal_forward.rs）の plugin 役が使う、固定の記録ハンドラ（受信番号を
# 原子変数へ store するだけ）の登録と読み出し（`signals::install_recording_handler_for_test`・
# `signals::recorded_signal_for_test`）と、継承した SIG_IGN を上書きする記録ハンドラの登録・fork した子でシグナルを
# 受ける入口（`signals::install_recording_handler_overriding_ignore_for_test`・`signals::fork_and_raise_for_test`。
# #1605）を公開する（#1513・PLUG-7・PR #1572 事後監査の P2）。既定のビルドには
# 含めない。リリースビルドで有効にするとコンパイルが止まる（src/lib.rs の `compile_error!`）。依存は増えない。
[features]
signal-test-support = []

# 自己参照の dev-dependency（supervisor・core と同じ仕組み。外部クレートの追加ではない）: cli 自身のテストでは
# `signal-test-support` を常に有効にし、試験専用の入口を使う結合試験（signal_forward）が `cargo test --workspace`
# の既定のテスト集合から外れないようにする。通常のビルド（`cargo build`・リリース成果物）は dev-dependency を
# 解決しないため、feature は無効のまま。
[dev-dependencies]
fandhe-container-cli = { path = ".", features = ["signal-test-support"] }

# workspace の lint 設定を継承する（ルート Cargo.toml の [workspace.lints]。#1138）。
[lints]
workspace = true
