# compose.yaml → TOML の片方向変換ツール（変換レポート・キー分類・--downgrade 格下げ・GPU 予約変換・
# build: エラー処理・往復検証テスト。crate-naming.md の表 #14）。
# 雛形は TASK-1.3（#11・REPAIR-1・MS-0）。本体は G11（TASK-151 が本体、TASK-152〜154・156・182）で実装する。
# `fandhe-container-stack` の TOML 型を使う一方向依存（決定 5）。YAML パーサーの依存は本 crate に限定する。
# version は未指定（Cargo の既定で 0.0.0）。公開方針は未決定のため publish = false を明記する。
# TASK-151.0（#1070・STACK-3）で stack への path 依存と bin の雛形を追加した。bin の本体は TASK-151.7（#602）で作る。
# 依存の追加は =x.y.z 完全固定・ユーザー承認制（.claude/rules/dependency-policy.md）。

[package]
name = "fandhe-container-compose-convert"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# workspace の lint 設定を継承する（ルート Cargo.toml の [workspace.lints]。#1138）。
[lints]
workspace = true

# 独立ツールのバイナリ（決定 5）。現状は UNIMPLEMENTED を返すだけの雛形（REPAIR-3）。
[[bin]]
name = "fandhe-container-compose-convert"
path = "src/main.rs"

# workspace 内の path 依存で、外部クレートの追加ではない（決定 5。compose-convert -> stack の一方向で、
# stack からこの crate へは依存しない）。型の参照は TASK-151.7（#602）以降で始まり、現状は宣言だけ。
[dependencies]
fandhe-container-stack = { path = "../stack" }
# YAML の読み込みに使う workspace 依存（承認は #540 の 2026-10-10 のオーナー判断。TASK-151.1・#595 で参照を開始）。
# 汎用 Value 型を持たないため、serde の Deserialize を手で書いて単一モデル ComposeValue へ読む。
serde.workspace = true
serde-saphyr.workspace = true

# STACK-9 の GPU 予約変換結果の TOML 往復検証（TASK-156.3・#626）にだけ使う。dev-dependencies のみで製品には入らない。
# 版は workspace の =1.1.8 固定を継承する（承認は #582。判断資料と許容依存リストに compose-convert からの参照の
# 記載がある。本変更での新規承認は得ていない）。
[dev-dependencies]
toml.workspace = true
