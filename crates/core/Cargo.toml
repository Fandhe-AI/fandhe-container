# 実行層（namespace・cgroups v2・seccomp/Landlock・rootless・ログ・状態管理。crate-naming.md の表 #2）。
# 雛形は TASK-1.3（#11・REPAIR-1・MS-0）。本体は G3（TASK-27〜50）で実装する。
# version は未指定（Cargo の既定で 0.0.0）。公開方針は未決定のため publish = false を明記する。
# 依存の追加は =x.y.z 完全固定・ユーザー承認制（.claude/rules/dependency-policy.md）。

[package]
name = "fandhe-container-core"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# config.json のパース用（TASK-29.1.1。承認: Issue #138・TASK-29.hdep1）。3 OS 共通。
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# plugin バイナリの sha256 許可済みハッシュ照合（PLUG-11・TASK-122.3。承認: Issue #278・TASK-122.hdep1）。
# plugin_trust は `plugin` feature の外の無条件モジュールのため optional にしない。
sha2 = { workspace = true }
# plugin 境界基盤。`plugin` feature 有効時のみ依存する（PLUG-3・TASK-111.1・#262）。
fandhe-container-plugin = { workspace = true, optional = true }

# 結合試験 tests/escape_suite.rs 専用の任意クロージャ実行経路 `spawn_container_probe` を公開する feature
# （SEC-2・TASK-42.1・#199）。通常ビルドでは無効で、下の dev-dependency（自己参照）でテスト時のみ有効化する。
#
# `plugin` feature（PLUG-3・TASK-111.1・#262）: 未使用の plugin 相当機能をコンパイル時に除外して
# 軽量バイナリを作れるようにする。`default` を新設し既定では有効（従来の利用側は挙動が変わらない）。
# 無効化は `--no-default-features`。CI 組み込みとサイズ記録は TASK-111.2（#263）で導入済み（`make plugin-feature-size`・docs/design/plugin-feature-size-record.md）。
[features]
default = ["plugin"]
plugin = ["dep:fandhe-container-plugin"]
escape-probe = []
# 実機結合試験（crates/supervisor/tests/exec_setns_join.rs）専用の入口 `exec::Pid1Target::open_with_cgroup_path`
# （期待 cgroup パスを文字列で受ける）を公開する feature（SUP-6・SEC-1・TASK-163.1・#500）。既定のビルドでは無効で、
# 公開 API は記録の型から期待パスを組み立てる `Pid1Target::open` だけになる。依存は増えない。
# exec の子の `execveat` 前の手順を実プロセスで観測する `exec::observe_exec_child_setup`（tests/exec_child_setup.rs。
# TASK-163 追補・#1456）も同じ feature の下に置く。core 自身のテストでは下の dev-dependency（自己参照）で有効にし、
# `cargo test --workspace`・`make test-integration` の既定のテスト集合から外れないようにする。
exec-test-support = []

# default-features = false は、`--no-default-features` のテスト時に自己参照経由で default が
# 統合されて feature 無効構成を検証できなくなるのを防ぐ（既定の `cargo test` では影響しない）。
[dev-dependencies]
fandhe-container-core = { path = ".", default-features = false, features = ["escape-probe", "exec-test-support"] }

# namespace 分離の結合試験（CORE-1・TASK-27.2）。libtest はテストをスレッドで実行し
# CLONE_NEWUSER が EINVAL になるため、単一スレッドの独自 main（harness = false）で動かす。
[[test]]
name = "unshare_isolation"
path = "tests/unshare_isolation.rs"
harness = false

# rootfs 切替（pivot_root）の結合試験（CORE-1・TASK-27.3）。上と同じ理由で harness = false。
# `-- --ignored` 指定時のみ実行する実機前提テスト（AGENTS.md）。
[[test]]
name = "pivot_root_isolation"
path = "tests/pivot_root_isolation.rs"
harness = false

# fork / exec による子プロセス起動の結合試験（CORE-1・TASK-27.4.1）。上と同じ理由で harness = false
# （libtest はマルチスレッドで、CLONE_NEWUSER と単一スレッド前提の fork が拒否される）。
# `-- --ignored` 指定時のみ実行する実機前提テスト（AGENTS.md）。
[[test]]
name = "fork_exec_isolation"
path = "tests/fork_exec_isolation.rs"
harness = false

# capability 最小化の結合試験（SEC-1・TASK-37.3）。実プロセスの `/proc/<pid>/status` を照合する。
# 上と同じ理由で harness = false。`-- --ignored` 指定時のみ実機前提部分を実行する（AGENTS.md）。
[[test]]
name = "capabilities"
path = "tests/capabilities.rs"
harness = false

# 起動フローへの cgroup 参加（CgroupJoin 段）の結合試験（CORE-3・TASK-32.4）。上と同じ理由で harness = false。
# 委譲 cgroup v2 が必要な実機前提テストのため `-- --ignored` 指定時のみ実行する（AGENTS.md）。
# exec 用の子 cgroup と `cgroup.kill`（SUP-6・TASK-163 追補・#1466）の結合試験。委譲 cgroup を要する実機前提
# テストで、`-- --ignored` 指定時のみ実行する（AGENTS.md）。`exec-test-support` の入口を使う（上の自己参照で有効）。
[[test]]
name = "exec_cgroup_kill"
path = "tests/exec_cgroup_kill.rs"

[[test]]
name = "cgroup_join"
path = "tests/cgroup_join.rs"
harness = false

# cgroups 設定（memory・cpu 制限の設定＋起動フローへの参加）の通し結合試験（CORE-3・TASK-32.5・#162）。
# 上と同じ理由で harness = false。委譲 cgroup v2 が必要な実機前提テストのため `-- --ignored` 指定時のみ
# 実行する（AGENTS.md）。
[[test]]
name = "cgroups"
path = "tests/cgroups.rs"
harness = false

# cgroups v2 実効性の回帰テスト（CORE-3・TASK-36.1・#169）。fork は単一スレッドで行い、user namespace の
# 作成と委譲 cgroup が必要な実機前提テストのため harness = false。`-- --ignored` 指定時のみ実行する
# （AGENTS.md）。
[[test]]
name = "cgroups_regression"
path = "tests/cgroups_regression.rs"
harness = false

# OOM Kill 確認の結合試験（CORE-3・TASK-33.1・#164）。上と同じ理由で harness = false。委譲 cgroup v2 が
# 必要な実機前提テストのため `-- --ignored` 指定時のみ実行する（AGENTS.md）。
[[test]]
name = "cgroups_oom"
path = "tests/cgroups_oom.rs"
harness = false

# 基本デバイスノード作成（create_default_devices）の結合試験（CORE-1・TASK-27.6）。上と同じ理由で
# harness = false。`-- --ignored` 指定時のみ実行する実機前提テスト（AGENTS.md）。
# seccomp 適用後の遮断の結合試験（CORE-5・TASK-38.3・#178）。適用は単一スレッドを要するため harness = false。
[[test]]
name = "seccomp_enforcement"
path = "tests/seccomp_enforcement.rs"
harness = false

# exec プロセスへの seccomp / Landlock 再適用の結合試験（SUP-6・TASK-163.3・#502）。不可逆の制限適用と単一スレッド
# 前提のため harness = false。`-- --ignored` で Landlock ABI 6+ を必須にする実機前提モード（AGENTS.md）。
[[test]]
name = "exec_restrictions_reapply"
path = "tests/exec_restrictions_reapply.rs"
harness = false

# exec の子の `execveat` 前の手順（`setsid`・`/dev/null` の検証と置換・エントリポイントの検査）を実プロセスで
# 照合する結合試験（SUP-6・SEC-1・TASK-163 追補・#1456）。fork は単一スレッドの呼び出し元を要求するため
# harness = false。root・実コンテナは不要で、既定のテスト集合で実行する（`exec-test-support` は上の自己参照で有効）。
[[test]]
name = "exec_child_setup"
path = "tests/exec_child_setup.rs"
harness = false

[[test]]
name = "default_devices"
path = "tests/default_devices.rs"
harness = false

# tmpfs マウント（mount_tmpfs。--shm-size / --tmpfs）の結合試験（SUP-12・TASK-169.2）。上と同じ理由で
# harness = false。`-- --ignored` 指定時のみ実行する実機前提テスト（AGENTS.md）。
[[test]]
name = "tmpfs_mount"
path = "tests/tmpfs_mount.rs"
harness = false

# secrets / configs 注入（read-only tmpfs）の結合試験（SUP-12・TASK-169.4.2）。上と同じ理由で
# harness = false。`-- --ignored` 指定時のみ実行する実機前提テスト（AGENTS.md）。
[[test]]
name = "inject_files"
path = "tests/inject_files.rs"
harness = false

# user namespace UID/GID 写像（rootless）の結合試験（CORE-6・SEC-5・TASK-40.1）。上と同じ理由で
# harness = false。`-- --ignored` 指定時のみ実行する実機前提テスト（AGENTS.md）。
[[test]]
name = "rootless_id_map"
path = "tests/rootless_id_map.rs"
harness = false

# rootless 起動フローへの統合（subuid 範囲写像 → spawn_container）の結合試験（CORE-6・SEC-5・TASK-40.2）。
# 上と同じ理由で harness = false。`-- --ignored` 指定時のみ実行する実機前提テスト（AGENTS.md）。
[[test]]
name = "rootless_launch"
path = "tests/rootless_launch.rs"
harness = false

# rootless でコンテナ内 root が作るファイルの所有者写像（ホスト視点 stat）の結合試験（CORE-6・SEC-5・TASK-40.3）。
# 上と同じ理由で harness = false。`-- --ignored` 指定時のみ実行する実機前提テスト（AGENTS.md）。
[[test]]
name = "rootless_file_owner"
path = "tests/rootless_file_owner.rs"
harness = false

# rootless での OCI Runtime ライフサイクル（create → start → kill）の結合試験と既知課題の記録
# （CORE-6・SEC-5・TASK-40.4）。CLONE_NEWUSER のため単一スレッドの main が要り harness = false。
# `-- --ignored` 指定時のみ実行する実機前提テスト（AGENTS.md）。
[[test]]
name = "rootless"
path = "tests/rootless.rs"
harness = false

# rootless でコンテナ（PID 1・pivot 済み rootfs）内 root が作るファイルのホスト側所有者を照合する
# ESC-09 相当の結合試験（CORE-6・SEC-5・TASK-44）。libtest のマルチスレッドでは CLONE_NEWUSER が
# 拒否されるため単一スレッド main の harness = false。`-- --ignored` 指定時のみ実行する
# 実機前提テスト（AGENTS.md）。
[[test]]
name = "rootless_uid_mapping"
path = "tests/rootless_uid_mapping.rs"
harness = false

# 起動したコンテナプロセス内で禁止 syscall が遮断されることの結合試験（CORE-5・TASK-38.4・#179）。
# CLONE_NEWUSER / 単一スレッド前提の fork のため harness = false。`-- --ignored` 指定時のみ
# 実機前提部分を実行する（AGENTS.md）。
[[test]]
name = "seccomp"
path = "tests/seccomp.rs"
harness = false

# Landlock 適用後の遮断の結合試験（CORE-5・TASK-39.3・#183）。適用は不可逆・単一スレッド前提のため
# harness = false（使い捨ての子プロセス内で適用する）。実機前提はなく既定のテスト集合で動く。
[[test]]
name = "landlock_enforcement"
path = "tests/landlock_enforcement.rs"
harness = false

# Landlock の許可パス / 許可外パスの区別を観測する結合試験（CORE-5・TASK-39.5・#185）。適用は不可逆・
# 単一スレッド前提のため harness = false（使い捨ての子プロセス内で適用する）。Linux 6.12+・ABI 6+ の
# フル照合は `-- --ignored` 指定時のみ必須（AGENTS.md）。
[[test]]
name = "landlock"
path = "tests/landlock.rs"
harness = false

# 攻撃テストハーネス基盤（SEC-2・TASK-42.1・#199。ESC-01〜10 は #200〜#203 で追加）。CLONE_NEWUSER /
# 単一スレッド前提の fork のため harness = false。`-- --ignored` 指定時のみ実機前提部分を実行する（AGENTS.md）。
[[test]]
name = "escape_suite"
path = "tests/escape_suite.rs"
harness = false

# namespace 分離の実証テスト（CORE-1・TASK-28.1・#145）。分離後のコンテナから見たプロセス不可視・独自 hostname・
# 独自 rootfs を通しで照合する。上と同じ理由で harness = false。`-- --ignored` 指定時のみ実行する
# 実機前提テスト（AGENTS.md）。
[[test]]
name = "namespace_isolation"
path = "tests/namespace_isolation.rs"
harness = false

# workspace の lint 設定を継承する（ルート Cargo.toml の [workspace.lints]。#1138）。
[lints]
workspace = true
