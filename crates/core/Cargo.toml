# 実行層（namespace・cgroups v2・seccomp/Landlock・rootless・ログ・状態管理。crate-naming.md の表 #2）。
# 雛形は TASK-1.3（#11・REPAIR-1・MS-0）。本体は G3（TASK-27〜50）で実装する。
# version は未指定（Cargo の既定で 0.0.0）。公開方針は未決定のため publish = false を明記する。
# 依存の追加は =x.y.z 完全固定・ユーザー承認制（.claude/rules/dependency-policy.md）。

[package]
name = "fandhe-container-core"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# config.json のパース用（TASK-29.1.1。承認: Issue #138・TASK-29.hdep1）。3 OS 共通。
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

# namespace 分離の結合試験（CORE-1・TASK-27.2）。libtest はテストをスレッドで実行し
# CLONE_NEWUSER が EINVAL になるため、単一スレッドの独自 main（harness = false）で動かす。
[[test]]
name = "unshare_isolation"
path = "tests/unshare_isolation.rs"
harness = false

# rootfs 切替（pivot_root）の結合試験（CORE-1・TASK-27.3）。上と同じ理由で harness = false。
# `-- --ignored` 指定時のみ実行する実機前提テスト（AGENTS.md）。
[[test]]
name = "pivot_root_isolation"
path = "tests/pivot_root_isolation.rs"
harness = false

# fork / exec による子プロセス起動の結合試験（CORE-1・TASK-27.4.1）。上と同じ理由で harness = false
# （libtest はマルチスレッドで、CLONE_NEWUSER と単一スレッド前提の fork が拒否される）。
# `-- --ignored` 指定時のみ実行する実機前提テスト（AGENTS.md）。
[[test]]
name = "fork_exec_isolation"
path = "tests/fork_exec_isolation.rs"
harness = false

# capability 最小化の結合試験（SEC-1・TASK-37.3）。実プロセスの `/proc/<pid>/status` を照合する。
# 上と同じ理由で harness = false。`-- --ignored` 指定時のみ実機前提部分を実行する（AGENTS.md）。
[[test]]
name = "capabilities"
path = "tests/capabilities.rs"
harness = false

# 起動フローへの cgroup 参加（CgroupJoin 段）の結合試験（CORE-3・TASK-32.4）。上と同じ理由で harness = false。
# 委譲 cgroup v2 が必要な実機前提テストのため `-- --ignored` 指定時のみ実行する（AGENTS.md）。
[[test]]
name = "cgroup_join"
path = "tests/cgroup_join.rs"
harness = false

# 基本デバイスノード作成（create_default_devices）の結合試験（CORE-1・TASK-27.6）。上と同じ理由で
# harness = false。`-- --ignored` 指定時のみ実行する実機前提テスト（AGENTS.md）。
# seccomp 適用後の遮断の結合試験（CORE-5・TASK-38.3・#178）。適用は単一スレッドを要するため harness = false。
[[test]]
name = "seccomp_enforcement"
path = "tests/seccomp_enforcement.rs"
harness = false

[[test]]
name = "default_devices"
path = "tests/default_devices.rs"
harness = false

# user namespace UID/GID 写像（rootless）の結合試験（CORE-6・SEC-5・TASK-40.1）。上と同じ理由で
# harness = false。`-- --ignored` 指定時のみ実行する実機前提テスト（AGENTS.md）。
[[test]]
name = "rootless_id_map"
path = "tests/rootless_id_map.rs"
harness = false

# rootless 起動フローへの統合（subuid 範囲写像 → spawn_container）の結合試験（CORE-6・SEC-5・TASK-40.2）。
# 上と同じ理由で harness = false。`-- --ignored` 指定時のみ実行する実機前提テスト（AGENTS.md）。
[[test]]
name = "rootless_launch"
path = "tests/rootless_launch.rs"
harness = false

# rootless でコンテナ内 root が作るファイルの所有者写像（ホスト視点 stat）の結合試験（CORE-6・SEC-5・TASK-40.3）。
# 上と同じ理由で harness = false。`-- --ignored` 指定時のみ実行する実機前提テスト（AGENTS.md）。
[[test]]
name = "rootless_file_owner"
path = "tests/rootless_file_owner.rs"
harness = false

# rootless での OCI Runtime ライフサイクル（create → start → kill）の結合試験と既知課題の記録
# （CORE-6・SEC-5・TASK-40.4）。CLONE_NEWUSER のため単一スレッドの main が要り harness = false。
# `-- --ignored` 指定時のみ実行する実機前提テスト（AGENTS.md）。
[[test]]
name = "rootless"
path = "tests/rootless.rs"
harness = false

# rootless でコンテナ（PID 1・pivot 済み rootfs）内 root が作るファイルのホスト側所有者を照合する
# ESC-09 相当の結合試験（CORE-6・SEC-5・TASK-44）。libtest のマルチスレッドでは CLONE_NEWUSER が
# 拒否されるため単一スレッド main の harness = false。`-- --ignored` 指定時のみ実行する
# 実機前提テスト（AGENTS.md）。
[[test]]
name = "rootless_uid_mapping"
path = "tests/rootless_uid_mapping.rs"
harness = false

# 起動したコンテナプロセス内で禁止 syscall が遮断されることの結合試験（CORE-5・TASK-38.4・#179）。
# CLONE_NEWUSER / 単一スレッド前提の fork のため harness = false。`-- --ignored` 指定時のみ
# 実機前提部分を実行する（AGENTS.md）。
[[test]]
name = "seccomp"
path = "tests/seccomp.rs"
harness = false

# Landlock 適用後の遮断の結合試験（CORE-5・TASK-39.3・#183）。適用は不可逆・単一スレッド前提のため
# harness = false（使い捨ての子プロセス内で適用する）。実機前提はなく既定のテスト集合で動く。
[[test]]
name = "landlock_enforcement"
path = "tests/landlock_enforcement.rs"
harness = false

# Landlock の許可パス / 許可外パスの区別を観測する結合試験（CORE-5・TASK-39.5・#185）。適用は不可逆・
# 単一スレッド前提のため harness = false（使い捨ての子プロセス内で適用する）。Linux 6.12+・ABI 6+ の
# フル照合は `-- --ignored` 指定時のみ必須（AGENTS.md）。
[[test]]
name = "landlock"
path = "tests/landlock.rs"
harness = false
