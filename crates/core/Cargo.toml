# 実行層（namespace・cgroups v2・seccomp/Landlock・rootless・ログ・状態管理。crate-naming.md の表 #2）。
# 雛形は TASK-1.3（#11・REPAIR-1・MS-0）。本体は G3（TASK-27〜50）で実装する。
# version は未指定（Cargo の既定で 0.0.0）。公開方針は未決定のため publish = false を明記する。
# TASK-163 追補（#1594）で本番用 AuditSink（FileAuditSink）を追加した（依存は不変）。
# 依存の追加は =x.y.z 完全固定・ユーザー承認制（.claude/rules/dependency-policy.md）。

[package]
name = "fandhe-container-core"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# config.json のパース用（TASK-29.1.1。承認: Issue #138・TASK-29.hdep1）。3 OS 共通。
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# plugin バイナリの sha256 許可済みハッシュ照合（PLUG-11・TASK-122.3。承認: Issue #278・TASK-122.hdep1）。
# plugin_trust は `plugin` feature の外の無条件モジュールのため optional にしない。
sha2 = { workspace = true }
# plugin 境界基盤。`plugin` feature 有効時のみ依存する（PLUG-3・TASK-111.1・#262）。
fandhe-container-plugin = { workspace = true, optional = true }

# 結合試験 tests/escape_suite.rs 専用の任意クロージャ実行経路 `spawn_container_probe` を公開する feature
# （SEC-2・TASK-42.1・#199）。通常ビルドでは無効で、下の dev-dependency（自己参照）でテスト時のみ有効化する。
#
# `plugin` feature（PLUG-3・TASK-111.1・#262）: 未使用の plugin 相当機能をコンパイル時に除外して
# 軽量バイナリを作れるようにする。`default` を新設し既定では有効（従来の利用側は挙動が変わらない）。
# 無効化は `--no-default-features`。CI 組み込みとサイズ記録は TASK-111.2（#263）で導入済み（`make plugin-feature-size`・docs/design/plugin-feature-size-record.md）。
[features]
default = ["plugin"]
plugin = ["dep:fandhe-container-plugin"]
escape-probe = []
# 実機結合試験（crates/supervisor/tests/exec_setns_join.rs）専用の入口 `exec::Pid1Target::open_with_cgroup_path`
# （期待 cgroup パスを文字列で受ける）を公開する feature（SUP-6・SEC-1・TASK-163.1・#500）。既定のビルドでは無効で、
# 公開 API は記録の型から期待パスを組み立てる `Pid1Target::open` だけになる。依存は増えない。
# exec の子の `execveat` 前の手順を実プロセスで観測する `exec::observe_exec_child_setup`（tests/exec_child_setup.rs。
# TASK-163 追補・#1456）と、標準 fd を閉じた呼び出し側を作る `exec::close_standard_fds_for_test`（tests/exec_child_setup.rs・
# tests/fork_exec_isolation.rs。#1299）も同じ feature の下に置く。core 自身のテストでは下の dev-dependency（自己参照）で有効にし、
# `cargo test --workspace`・`make test-integration` の既定のテスト集合から外れないようにする。
exec-test-support = []

# default-features = false は、`--no-default-features` のテスト時に自己参照経由で default が
# 統合されて feature 無効構成を検証できなくなるのを防ぐ（既定の `cargo test` では影響しない）。
[dev-dependencies]
fandhe-container-core = { path = ".", default-features = false, features = ["escape-probe", "exec-test-support"] }

# namespace 分離の結合試験（CORE-1・TASK-27.2）。libtest はテストをスレッドで実行し
# CLONE_NEWUSER が EINVAL になるため、単一スレッドの独自 main（harness = false）で動かす。
[[test]]
name = "unshare_isolation"
path = "tests/unshare_isolation.rs"
harness = false

# rootfs 切替（pivot_root）の結合試験（CORE-1・TASK-27.3）。上と同じ理由で harness = false。
# `-- --ignored` 指定時のみ実行する実機前提テスト（AGENTS.md）。
[[test]]
name = "pivot_root_isolation"
path = "tests/pivot_root_isolation.rs"
harness = false

# fork / exec による子プロセス起動の結合試験（CORE-1・TASK-27.4.1）。上と同じ理由で harness = false
# （libtest はマルチスレッドで、CLONE_NEWUSER と単一スレッド前提の fork が拒否される）。
# `-- --ignored` 指定時のみ実行する実機前提テスト（AGENTS.md）。
[[test]]
name = "fork_exec_isolation"
path = "tests/fork_exec_isolation.rs"
harness = false

