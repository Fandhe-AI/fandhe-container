# 実行層（namespace・cgroups v2・seccomp/Landlock・rootless・ログ・状態管理。crate-naming.md の表 #2）。
# 雛形は TASK-1.3（#11・REPAIR-1・MS-0）。本体は G3（TASK-27〜50）で実装する。
# version は未指定（Cargo の既定で 0.0.0）。公開方針は未決定のため publish = false を明記する。
# 依存の追加は =x.y.z 完全固定・ユーザー承認制（.claude/rules/dependency-policy.md）。

[package]
name = "fandhe-container-core"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# config.json のパース用（TASK-29.1.1。承認: Issue #138・TASK-29.hdep1）。3 OS 共通。
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

# namespace 分離の結合試験（CORE-1・TASK-27.2）。libtest はテストをスレッドで実行し
# CLONE_NEWUSER が EINVAL になるため、単一スレッドの独自 main（harness = false）で動かす。
[[test]]
name = "unshare_isolation"
path = "tests/unshare_isolation.rs"
harness = false

# rootfs 切替（pivot_root）の結合試験（CORE-1・TASK-27.3）。上と同じ理由で harness = false。
# `-- --ignored` 指定時のみ実行する実機前提テスト（AGENTS.md）。
[[test]]
name = "pivot_root_isolation"
path = "tests/pivot_root_isolation.rs"
harness = false

# fork / exec による子プロセス起動の結合試験（CORE-1・TASK-27.4.1）。上と同じ理由で harness = false
# （libtest はマルチスレッドで、CLONE_NEWUSER と単一スレッド前提の fork が拒否される）。
# `-- --ignored` 指定時のみ実行する実機前提テスト（AGENTS.md）。
[[test]]
name = "fork_exec_isolation"
path = "tests/fork_exec_isolation.rs"
harness = false

# 基本デバイスノード作成（create_default_devices）の結合試験（CORE-1・TASK-27.6）。上と同じ理由で
# harness = false。`-- --ignored` 指定時のみ実行する実機前提テスト（AGENTS.md）。
[[test]]
name = "default_devices"
path = "tests/default_devices.rs"
harness = false

# user namespace UID/GID 写像（rootless）の結合試験（CORE-6・SEC-5・TASK-40.1）。上と同じ理由で
# harness = false。`-- --ignored` 指定時のみ実行する実機前提テスト（AGENTS.md）。
[[test]]
name = "rootless_id_map"
path = "tests/rootless_id_map.rs"
harness = false
