# CRI 実装ライブラリ（Runtime/ImageService・shim v2・streaming。crate-naming.md の表 #5）。
# 雛形は TASK-1.3（#11・REPAIR-1・MS-0）。本体は G4（TASK-56〜63）で実装する。
# version は未指定（Cargo の既定で 0.0.0）。公開方針は未決定のため publish = false を明記する。
# TASK-56.1（#423・CRI-3）で雛形を確認済み。build.rs・build-dependencies は TASK-56.3（#426）で追加済み、実行時依存 tonic・tonic-prost・prost は TASK-56.4（#427）で追加（承認: #425）。
# 依存の追加は =x.y.z 完全固定・ユーザー承認制（.claude/rules/dependency-policy.md）。

[package]
name = "fandhe-container-cri"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# workspace の lint 設定を継承する（ルート Cargo.toml の [workspace.lints]。#1138）。
[lints]
workspace = true

# .proto → Rust のコード生成（build.rs 専用。CRI-3・TASK-56.3）。実行時の依存は下の [dependencies]。
[build-dependencies]
tonic-prost-build.workspace = true
protox.workspace = true

# 生成コード（runtime.v1）が参照する gRPC・protobuf の実行時依存（CRI-3・TASK-56.4。承認: #425）。
# PullImage（TASK-61.3・#446・CRI-4）: oci の pull 経路（同期 HTTP）を呼ぶため workspace 内の fandhe-container-oci
# （path 依存。外部クレートの追加ではない）と、ブロッキング処理を async ハンドラから切り離す tokio（承認: #425 の
# オーナー判断 2026-10-10 の cri / plugin の gRPC 面。features は rt のみ。workspace 既存の tokio で新規パッケージなし）。
[dependencies]
fandhe-container-oci = { path = "../oci" }
# ContainerRuntime トレイト境界の呼び出しアダプタ（TASK-59.1・#437・CRI-2・CRI-7）。workspace 内 path 依存で外部クレートの追加ではない。
# 参照は core の traits のみ。plugin feature は引き込まない（default-features = false）。
fandhe-container-core = { path = "../core", default-features = false }
tokio = { workspace = true, features = ["rt"] }
# bundle の config.json 生成（CRI-1・CRI-2・#2395）。serde / serde_json は #138 で承認済み（用途: OCI config.json）。
# workspace 既存の =x.y.z 固定版を参照するだけで Cargo.lock に新規パッケージは増えない。
serde.workspace = true
serde_json.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
prost.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

# CRI 記録の fsync が RPC のレイテンシ（p50・p95）に与える影響の計測ハーネス（#3224・CORE-10・CRI-1・REPAIR-8）。
# 自前の main（harness = false）。依存は足さない（既存の normal / dev 依存だけ）。CI では実行せず、
# metrics.json・BENCH_NAMES・baseline にも登録しない（基準値の確定は #230 の別件）。
[[bench]]
name = "record_store_rpc_latency"
harness = false
