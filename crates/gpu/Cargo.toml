# GPU CDI spec 解析・edits 適用・Landlock/seccomp・cgroup device・読み取り専用 rootfs（crate-naming.md の表 #11）。
# 雛形は TASK-1.3（#11・REPAIR-1・MS-0）。本体は G9（TASK-126〜135）で実装する（TASK-127.1 で deviceNodes の mknod を追加。TASK-127.3 で createContainer フックの実行を追加〔sys に `fcntl`（非ブロッキング化）と `geteuid` のラッパー、試験専用の `unshare` のラッパーを追加〕。unsafe は src/sys.rs に限る）。#2989 で sys の FFI 宣言と libc の照合を追加〔dev-dependencies の libc〕。
# version は未指定（Cargo の既定で 0.0.0）。公開方針は未決定のため publish = false を明記する。
# 依存の追加は =x.y.z 完全固定・ユーザー承認制（.claude/rules/dependency-policy.md）。

[package]
name = "fandhe-container-gpu"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# workspace の lint 設定を継承する（ルート Cargo.toml の [workspace.lints]。#1138）。
[lints]
workspace = true

# CDI spec（YAML / JSON）の読み込み（GPU-1・TASK-126.1）。serde-saphyr は #540 で承認済み。
[dependencies]
serde.workspace = true
serde-saphyr.workspace = true

# 自前 FFI 宣言（`src/sys.rs`）と libc のコンパイル時照合（`libc_abi`。#2989・#3290・#1318・MVM-4・REPAIR-12。
# 方式は docs/design/ffi-libc-check.md）。dev-dependencies のみで製品コードの依存には入れない。sys は Linux 限定。
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc.workspace = true
