# KVM 直接制御・最小 virtio デバイスモデル（Linux オプション。crate-naming.md の表 #8）。
# 雛形は TASK-1.3（#11・REPAIR-1・MS-0）。本体は G5（TASK-74〜78）で実装する。
# version は未指定（Cargo の既定で 0.0.0）。公開方針は未決定のため publish = false を明記する。
# 依存の追加は =x.y.z 完全固定・ユーザー承認制（.claude/rules/dependency-policy.md）。
# TASK-74.1.1 で error・device・sys を追加（依存は増やさない）。unsafe は src/sys.rs に限る。
# TASK-75.4.1 で microvm に start / stop（vCPU 実行ループ）を追加（依存は増やさない。unsafe なし）。
# TASK-75.4.2 で起動失敗時の後始末の検証と ERR-1 の TIMEOUT 表記を追加（依存・feature は変えない。unsafe なし）。
# TASK-75.5 の #3740 で UART の COM1 への結線と取り出し API を追加（依存は増やさない。unsafe なし）。
# TASK-74.1.2 で vCPU 作成（KVM_CREATE_VCPU・aarch64 の初期化）を追加（依存は増やさない）。
# TASK-74.4.1 で KVM_RUN・kvm_run の mmap・VM exit の型（exit.rs）を追加（依存は増やさない）。
# TASK-74.2.1 で virtio_mmio（OS 非依存の共通トランスポート）を追加（依存は増やさない。unsafe なし）。
# TASK-74.4.2 で dispatch（VM exit の振り分け・OS 非依存・unsafe なし）と kvm_run への応答の書き戻しを追加（依存は増やさない）。
# TASK-74.2.2 で guest_memory・virtqueue・virtio_block を追加（依存は増やさない。unsafe なし）。
# TASK-74.2.3 で interrupt・irq と KVM_IRQFD / KVM_IOEVENTFD / KVM_CREATE_IRQCHIP / eventfd を追加（依存は増やさない。unsafe は sys.rs のみ）。
# TASK-74.3.1 で virtio_net を追加（依存は増やさない。unsafe なし）。
# TASK-75.1 で microvm（ゲスト RAM の mmap と KVM 登録）を追加（依存は増やさない。unsafe は sys.rs のみ）。
# TASK-74.3.2 で interrupt に virtio-net の割り込み通知を追加（依存は増やさない。unsafe なし）。
# TASK-74.5 で tests/device.rs（VM exit 振り分け経由の結合試験）と crate 全体の deny(unsafe_code) を追加（依存は増やさない。unsafe は sys.rs のみ）。
# TASK-75.2 で microvm に VM 構成体の組み立てを追加（依存は増やさない。unsafe なし）。
# TASK-75.3.1 で boot_x86（カーネル・initrd のゲストメモリへのロード）を追加（依存は増やさない。unsafe なし）。
# TASK-75.5 の #3739 で uart（8250 / 16550 互換の UART のレジスタモデル）を追加（依存は増やさない。unsafe なし）。
# TASK-75.3.2 で vCPU のレジスタ初期化（KVM_GET/SET_REGS・KVM_GET/SET_SREGS・boot_x86 の GDT・ページテーブル）を追加（依存は増やさない。unsafe は sys.rs のみ）。
# #3734 で x86_64 の起動用 MSR・FPU の設定（boot_x86 の表と VcpuFd の set_msrs / msrs / set_fpu / fpu）を追加（依存は増やさない。unsafe 追加なし）。
# #3731 で x86_64 の CPUID・MSR・FPU・LAPIC・TSS / identity map の ioctl ラッパーを追加（依存は増やさない。unsafe は sys.rs のみ）。
# #3732 で TSS / identity map のアドレス選択と assemble での重なり検証を追加（依存は増やさない。unsafe なし）。
# #3783（TASK-192.1）で src/sys/hvf.rs・hvf_abi・hvf を追加（依存は増やさない。unsafe は sys/hvf.rs のみ）。
# #3786（TASK-192.2）で sys/hvf.rs に vCPU・レジスタ・exit・vtimer の宣言と HvVcpu・VcpuCanceller を追加（依存は増やさない。unsafe は sys/hvf.rs のみ）。
