# netlink・nftables・bridge/veth/netns・DNS ヘルパー・host/none モード・ポート公開（crate-naming.md の表 #12）。
# 雛形は TASK-1.3（#11・REPAIR-1・MS-0）。本体は G10（TASK-136〜148・185〜186）で実装する。
# version は未指定（Cargo の既定で 0.0.0）。公開方針は未決定のため publish = false を明記する。
# 依存の追加は =x.y.z 完全固定・ユーザー承認制（.claude/rules/dependency-policy.md）。

[package]
name = "fandhe-container-net"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# 試験専用の故障注入（attach の巻き戻しの特定の段を失敗させる。NET-1・REPAIR-3・#2971）。依存は増えない。
# リリースビルドで有効なら lib.rs の compile_error! で止める。結合試験 network_attach_privileged が使う。
[features]
attach-fault-test-support = []

[dev-dependencies]
# core・supervisor・cli と同じ方式の自己参照（外部クレートの追加ではない）。dev-dependency は通常のビルドでは
# 解決されないため、製品の既定ビルドでは feature は無効のまま。`required-features` は使わない（既定の
# `cargo test` から結合試験が外れないようにするため）。
fandhe-container-net = { path = ".", features = ["attach-fault-test-support"] }

# bridge・veth の作成 → netns 移動 → up の実機結合試験（NET-11・TASK-136.3.2・#846）。libtest のスレッド実行と
# 子の再入（--child）を分けるため harness = false。root と unshare --net が要る実機前提テストなので
# -- --ignored 指定時のみ実行する（AGENTS.md）。
[[test]]
name = "link_netns_privileged"
path = "tests/link_netns_privileged.rs"
harness = false

# 3 netns（container / router / external）での masquerade 実機結合試験（NET-11・TASK-138.2・#310）。
# 子の再入（--child）と root 前提の分離のため harness = false。`-- --ignored` 指定時のみ実行する（AGENTS.md）。
[[test]]
name = "nftables_masq_privileged"
path = "tests/nftables_masq_privileged.rs"
harness = false

# 3 netns（container / router / external）での DNAT・ハンドル指定削除の実機結合試験（NET-11・TASK-138.3・#311）。
# 子の再入（--child）と root 前提の分離のため harness = false。`-- --ignored` 指定時のみ実行する（AGENTS.md）。
[[test]]
name = "nftables_dnat_privileged"
path = "tests/nftables_dnat_privileged.rs"
harness = false

# bridge・DNAT・masquerade の 3 経路疎通の実機結合試験（NET-11・TASK-138.4・#312）。
# 子の再入（--child）と root 前提の分離のため harness = false。`-- --ignored` 指定時のみ実行する（AGENTS.md）。
[[test]]
name = "nftables_paths_privileged"
path = "tests/nftables_paths_privileged.rs"
harness = false

# bridge の所有トークン（作成後の RTM_SETLINK で付ける IFLA_IFALIAS）が実カーネルで付くことの実機結合試験（NET-1・Issue #1925）。
# root と util-linux の `unshare --net`、iproute2 の `ip` が要り、子の再入（--child）のため harness = false。
# `-- --ignored` 指定時のみ実行する。既定集合に置かない理由: 非特権 user namespace を AppArmor が制限する環境で
# `unshare -rn` が失敗するため、root 前提の実機前提テストとして分離する（AGENTS.md）。
[[test]]
name = "bridge_owner_token_privileged"
path = "tests/bridge_owner_token_privileged.rs"
harness = false

# コンテナ接続（netns 作成・pin、veth 作成、bridge 接続、peer の netns 移動）の実機結合試験（NET-1・TASK-139.2.1・#847）。
# 子の再入（--inner。プロセスをまたぐ回収の子モード --attach-child / --reclaim-child もこの実行ファイルの再入）と
# root 前提の分離のため harness = false。`-- --ignored` 指定時のみ実行する（AGENTS.md）。
[[test]]
name = "network_attach_privileged"
path = "tests/network_attach_privileged.rs"
harness = false

# 統合 API（create_network / attach_container / delete_network）を通しで使う 3 経路疎通の実機結合試験と、
# 作成・接続・削除の所要時間計測（NET-1・TASK-139.5・#318）。子の再入（--inner / --child）と root 前提の分離のため
# harness = false。`--ignored`（疎通）、`--measure`（計測）、`--hold --max-secs N`（トポロジーの保持。#1881）の
# 指定時のみ実行する（AGENTS.md）。
[[test]]
name = "network_paths_privileged"
path = "tests/network_paths_privileged.rs"
harness = false

# 1 バイト TCP 往復の p50・p99 計測プログラム（NET-3・TASK-140 準備・#1881）。root 不要・std のみで、引数なしは
# loopback の自己試験（3 OS の既定のテスト集合）。--serve / --client は保持入口の netns 内で nsenter 越しに使う。
# 自身を子プロセスとして再入するため harness = false。
[[test]]
name = "tcp_rtt_probe"
path = "tests/tcp_rtt_probe.rs"
harness = false

# host モード（ホスト netns 共有）の実機結合試験（NET-6・TASK-143.1・#326）。root と util-linux の `unshare --net` が要り、
# 子の再入（--child）のため harness = false。`-- --ignored` 指定時のみ実行する（AGENTS.md）。
[[test]]
name = "host_mode_privileged"
path = "tests/host_mode_privileged.rs"
harness = false

# DNS ヘルパーのプロセス起動・準備完了待ち・ループバック UDP 往復・回収の非特権結合試験（NET-5・TASK-141.1・#321）。
# 自身をヘルパーとして再実行するため harness = false。root 不要で 3 OS の既定集合で実行する。
[[test]]
name = "dns_helper_process"
path = "tests/dns_helper_process.rs"
harness = false

# DNS ヘルパーを bridge 上のネットワーク用 netns で起動しコンテナ netns から UDP 疎通する実機結合試験
# （NET-5・TASK-141.1・#321）。子の再入（--inner / --listen / --dns-client）と root 前提の分離のため
# harness = false。`-- --ignored` 指定時のみ実行する（AGENTS.md）。
# `--measure`（正答率・レイテンシ・常駐 PSS の実機計測。TASK-141.3・#323。再入口は --inner-measure /
# --dns-measure-helper / --dns-bench）は scripts/bench/dns_helper_measure.sh が起動する。
[[test]]
name = "dns_helper_privileged"
path = "tests/dns_helper_privileged.rs"
harness = false

# DNS ヘルパーのオンデマンド起動・終了（参照カウント経由）の実機結合試験（NET-7・TASK-144.2・#330）。
# 子の再入（--inner / --dns-client / --dns-expect-silent）と root 前提の分離のため harness = false。`-- --ignored` 指定時のみ実行する（AGENTS.md）。
[[test]]
name = "dns_helper_ondemand_privileged"
path = "tests/dns_helper_ondemand_privileged.rs"
harness = false

# none モード（lo のみの netns 作成・解放）の実機結合試験（NET-6・TASK-143.2・#327）。
# 子の再入（--inner / --probe）と root 前提の分離のため harness = false。`-- --ignored` 指定時のみ実行する（AGENTS.md）。
[[test]]
name = "none_mode_privileged"
path = "tests/none_mode_privileged.rs"
harness = false

# --add-host の /etc/hosts 追記が none モードで反映されることの実機前提テスト（NET-12・TASK-185.2）。
# 子の再入（--inner / --probe）と root 前提の分離のため harness = false。`-- --ignored` 指定時のみ実行する（AGENTS.md）。
[[test]]
name = "add_host_privileged"
path = "tests/add_host_privileged.rs"
harness = false

# 軽量運用（StaticHosts）の bridge ネットワークで /etc/hosts 静的注入によりサービス名が解決され、DNS ヘルパーが
# 起動しないことの実機前提テスト（NET-8・NET-7・TASK-146.1・#334）。子の再入（--inner / --probe）と root 前提の
# 分離のため harness = false。`-- --ignored` 指定時のみ実行する（AGENTS.md）。
[[test]]
name = "etc_hosts_privileged"
path = "tests/etc_hosts_privileged.rs"
harness = false

# 軽量運用（StaticHosts）の bridge ネットワークで --dns の値が resolv.conf へ直接書かれ、コンテナからのクエリが
# 指定サーバーへ直接到達することの実機前提テスト（NET-8・NET-12・TASK-146.3・#337）。子の再入（--inner / --probe）と
# root 前提の分離のため harness = false。`-- --ignored` 指定時のみ実行する（AGENTS.md）。
[[test]]
name = "static_dns_privileged"
path = "tests/static_dns_privileged.rs"
harness = false

# 非特権の user + network namespace（`unshare -rn`）で、`lo` が down のときの自己宛て UDP の受信期限切れと、
# up 後の配送を照合する実機前提テスト（NET-2・NET-11・TASK-140 追補・#2077）。root は不要で、非特権 user namespace が要る。
# 子の再入（--child）のため harness = false。`-- --ignored` 指定時のみ実行する。CI では platform-ci（ubuntu）が
# AppArmor 緩和ステップの後に実行し、成功行を照合する（AGENTS.md）。
[[test]]
name = "lo_self_delivery"
path = "tests/lo_self_delivery.rs"
harness = false

# ネットワーク定義ストアのプロセス間結合試験（排他・共有ロック・期限・保持プロセス終了後の再取得。
# NET-6・REPAIR-5・REPAIR-12・#3059）。自分自身を子として再実行する。root 不要・Linux のみ（他 OS は空の試験）。
[[test]]
name = "network_store_process"
path = "tests/network_store_process.rs"

# `sys.rs` の自前 FFI 宣言を libc と照合する試験専用の依存（#1841・#1318・#1837・MVM-4・REPAIR-12）。製品の依存には
# 入れない（cargo tree -e normal,build に現れない）。`sys.rs` は Linux 限定のため Linux に限る。
# 方式は docs/design/ffi-libc-check.md。
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc.workspace = true

# workspace の lint 設定を継承する（ルート Cargo.toml の [workspace.lints]。#1138）。
[lints]
workspace = true
