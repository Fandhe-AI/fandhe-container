# OCI イメージ管理（pull・キャッシュ・image ls/rm/tag。crate-naming.md の表 #4）。
# 雛形は TASK-1.3（#11・REPAIR-1・MS-0）。本体は G4（TASK-51〜55・183〜184）で実装する。
# version は未指定（Cargo の既定で 0.0.0）。公開方針は未決定のため publish = false を明記する。
# 依存は #399（TASK-51.hdep1）で承認済みの 4 件（レジストリクライアント基盤。TASK-51.1・#400）。
# TASK-51.2（#401）で serde / serde_json（#138 で承認済み）を workspace 参照で追加（トークン応答の JSON パース）。
# 依存の追加は =x.y.z 完全固定・ユーザー承認制（.claude/rules/dependency-policy.md）。

[package]
name = "fandhe-container-oci"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# workspace の lint 設定を継承する（ルート Cargo.toml の [workspace.lints]。#1138）。
[lints]
workspace = true

[dependencies]
ureq.workspace = true
rustls.workspace = true
rustls-graviola.workspace = true
rustls-native-certs.workspace = true
serde.workspace = true
serde_json.workspace = true
# 承認: Issue #278・TASK-122.hdep1（workspace 承認済みの用途「OCI blob の digest 検証」）。TASK-52.1（#405）で利用。
sha2.workspace = true
# 承認: Issue #406・TASK-52.hdep2（workspace 承認済みの用途「レイヤー gzip 展開」）。TASK-52.2（#407）で利用。
flate2.workspace = true
