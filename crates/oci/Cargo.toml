# OCI イメージ管理（pull・キャッシュ・image ls/rm/tag。crate-naming.md の表 #4）。
# 雛形は TASK-1.3（#11・REPAIR-1・MS-0）。本体は G4（TASK-51〜55・183〜184）で実装する。
# version は未指定（Cargo の既定で 0.0.0）。公開方針は未決定のため publish = false を明記する。
# 依存は #399（TASK-51.hdep1）で承認済みの 4 件（レジストリクライアント基盤。TASK-51.1・#400）。
# TASK-51.2（#401）で serde / serde_json（#138 で承認済み）を workspace 参照で追加（トークン応答の JSON パース）。
# TASK-52.3（#409）で tar（#408 で承認済み。解析のみ）を workspace 参照で追加。
# 依存の追加は =x.y.z 完全固定・ユーザー承認制（.claude/rules/dependency-policy.md）。

[package]
name = "fandhe-container-oci"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# workspace の lint 設定を継承する（ルート Cargo.toml の [workspace.lints]。#1138）。
[lints]
workspace = true

[dependencies]
ureq.workspace = true
rustls.workspace = true
rustls-graviola.workspace = true
rustls-native-certs.workspace = true
serde.workspace = true
serde_json.workspace = true
# 承認: Issue #278・TASK-122.hdep1（workspace 承認済みの用途「OCI blob の digest 検証」）。TASK-52.1（#405）で利用。
sha2.workspace = true
# 承認: Issue #406・TASK-52.hdep2（workspace 承認済みの用途「レイヤー gzip 展開」）。TASK-52.2（#407）で利用。
flate2.workspace = true
# 承認: Issue #408（workspace 承認済みの用途「レイヤー tar の解析」）。TASK-52.3（#409）で利用。unpack 系 API は使わない。
tar.workspace = true

# 実機前提ハーネス tests/pull_e2e.rs（TASK-55.1・#420・OCI-1）の実行段が TASK-29 の create / start と
# ProductionLauncher を使うための workspace 内 path 依存（dev のみ。外部 crate の追加ではない。cri と同形）。
[dev-dependencies]
fandhe-container-core = { path = "../core", default-features = false }

# `sys.rs` / `sys/at.rs` の自前 FFI 宣言を libc と照合する試験専用の依存（#2590・#1318・#1837・REPAIR-12）。
# 承認: #2590 のオーナーコメント（2026-10-23。版は workspace の =0.2.189 のまま・用途は照合の試験に限る）。
# 製品の依存には入れない（cargo tree -e normal,build に現れない）。方式は docs/design/ffi-libc-check.md。
[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

# pull・digest 検証・展開・rootfs 実行の自動検証ハーネス（OCI-1・TASK-55.1・#420）。実行段で fork するため
# 単一スレッドの独自 main（harness = false）。`-- --ignored` 指定時のみ実機前提の部分（外向き HTTPS・委譲 cgroup v2・
# 非特権 user namespace）を実行し、未指定時はオフライン自己検証だけを行う（AGENTS.md）。
[[test]]
name = "pull_e2e"
path = "tests/pull_e2e.rs"
harness = false

# rootless の user namespace の中でのレイヤー展開の実機前提試験（#2382・OCI-2・SEC-5）。`unshare` で子を
# user namespace へ入れる単一スレッドの独自 main。`-- --ignored` 指定時のみ実行する（AGENTS.md）。
[[test]]
name = "userns_extract"
path = "tests/userns_extract.rs"
harness = false

# root 配下の別マウント（実マウント）がイメージストアで FailedPrecondition になることの実機前提試験（#2701・OCI-7・SEC-1・ERR-1）。
# `unshare` で子を user / mount namespace へ入れる単一スレッドの独自 main。`-- --ignored` 指定時のみ実行する（AGENTS.md）。
[[test]]
name = "image_store_xdev"
path = "tests/image_store_xdev.rs"
harness = false
