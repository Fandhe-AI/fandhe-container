# macOS Virtualization.framework 経由の VM 起動・VirtioFS（crate-naming.md の表 #6）。
# 雛形は TASK-1.3（#11・REPAIR-1・MS-0）。依存と cfg ガードの整備は TASK-64.1（#357・MAC-1）。
# 本体は G5（TASK-64.2〜66）で実装する。
# version は未指定（Cargo の既定で 0.0.0）。公開方針は未決定のため publish = false を明記する。
# 依存は承認済み（Issue #356・TASK-64.hdep1）で、=x.y.z 完全固定・macOS ターゲット限定
# （.claude/rules/dependency-policy.md）。実行には com.apple.security.virtualization entitlement と
# コード署名（ad-hoc 可）が必要。実質の最低 macOS は 13（vsock 11・virtio-fs 12・virtio-graphics 13）。
# 使ってはならない feature: objc2-virtualization の既定 feature（VZVirtualMachineView 経由で
# objc2-app-kit を引く）・objc2 の exception（cc のネイティブビルドを引く）・unstable-* / gnustep-*。
# virtio-fs・vsock・graphics 用の feature は、使う時点の各タスク（TASK-65 等）が追加する。

[package]
name = "fandhe-container-platform-macos"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true, features = ["std"] }
objc2-foundation = { workspace = true, features = ["std"] }
objc2-virtualization = { workspace = true, features = [
    "std", "block2", "dispatch2",
    "VZVirtualMachine", "VZVirtualMachineConfiguration", "VZVirtualMachineDelegate",
    "VZBootLoader", "VZLinuxBootLoader",
    "VZPlatformConfiguration", "VZGenericPlatformConfiguration",
    "VZStorageDeviceConfiguration", "VZVirtioBlockDeviceConfiguration",
    "VZStorageDeviceAttachment", "VZDiskImageStorageDeviceAttachment",
    "VZSerialPortConfiguration", "VZVirtioConsoleDeviceSerialPortConfiguration",
    "VZSerialPortAttachment", "VZFileHandleSerialPortAttachment",
    "VZEntropyDeviceConfiguration", "VZVirtioEntropyDeviceConfiguration",
    "VZError",
] }
block2 = { workspace = true, features = ["std"] }
dispatch2 = { workspace = true, features = ["std", "block2", "objc2"] }
