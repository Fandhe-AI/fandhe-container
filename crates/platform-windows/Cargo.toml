# Windows WSL2 経由（virtiofs opt-in）の実装（crate-naming.md の表 #7）。
# 雛形は TASK-1.3（#11・REPAIR-1・MS-0）。本体は G5（TASK-67〜72）で実装する。
# version は未指定（Cargo の既定で 0.0.0）。公開方針は未決定のため publish = false を明記する。
# TASK-67.1（#372・WIN-1/WIN-2・MS-5）: モジュールの骨格と cfg ガード方針を整備した。
# cfg 方針: Windows 固有の処理（wsl.exe 起動・Win32 API）はモジュール単位で cfg(target_os = "windows") を付け、
# OS 非依存の処理（.wslconfig の解析・生成、エラー型）は全 OS でビルド・テストする。
# windows-sys は承認済み（#371・TASK-67.hdep1。=0.61.2）で、[target.'cfg(windows)'.dependencies] に限り
# 使う名前空間の feature だけを列挙する。利用は src/sys.rs（unsafe の事前承認範囲）に閉じる。
# 現在の用途: wsl.exe・子孫プロセスの管理（TASK-67.3・WIN-1・REPAIR-5）。
#   Win32_Foundation（HANDLE・CloseHandle）・Win32_Security（CreateJobObjectW の引数型）・
#   Win32_System_JobObjects（Job Object）・Win32_System_Threading（CREATE_SUSPENDED・OpenThread・ResumeThread）・
#   Win32_System_Diagnostics_ToolHelp（スレッド列挙）・Win32_System_SystemInformation（GetSystemDirectoryW）。
# 依存の追加は =x.y.z 完全固定・ユーザー承認制（.claude/rules/dependency-policy.md）。

[package]
name = "fandhe-container-platform-windows"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
] }
