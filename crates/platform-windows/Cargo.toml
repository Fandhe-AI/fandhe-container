# Windows WSL2 経由（virtiofs opt-in）の実装（crate-naming.md の表 #7）。
# 雛形は TASK-1.3（#11・REPAIR-1・MS-0）。本体は G5（TASK-67〜72）で実装する。
# version は未指定（Cargo の既定で 0.0.0）。公開方針は未決定のため publish = false を明記する。
# TASK-67.1（#372・WIN-1/WIN-2・MS-5）: モジュールの骨格と cfg ガード方針を整備した。
# cfg 方針: Windows 固有の処理（wsl.exe 起動・Win32 API）はモジュール単位で cfg(target_os = "windows") を付け、
# OS 非依存の処理（.wslconfig の解析・生成、エラー型）は全 OS でビルド・テストする。
# windows-sys は承認済み（#371・TASK-67.hdep1。=0.61.2）で、[target.'cfg(windows)'.dependencies] に限り
# 使う名前空間の feature だけを列挙する。利用は src/sys.rs（unsafe の事前承認範囲）に閉じる。
# 現在の用途: wsl.exe・子孫プロセスの管理（TASK-67.3・WIN-1・REPAIR-5）。
#   Win32_Foundation（HANDLE・INVALID_HANDLE_VALUE・LocalFree・エラーコード・GENERIC_WRITE。ハンドルを閉じるのは
#   std の OwnedHandle）・
#   Win32_Security（CreateJobObjectW の引数型 SECURITY_ATTRIBUTES、.wslconfig 置換の SD 操作〔ACL・
#   GetSecurityDescriptorLength / Control・*_SECURITY_INFORMATION〕。TASK-67.2）・
#   Win32_Security_Authorization（GetSecurityInfo・SetSecurityInfo・SE_FILE_OBJECT。TASK-67.2）・
#   Win32_Storage_FileSystem（GetFileInformationByHandleEx・FILE_ID_INFO・ReOpenFile・アクセス権定数。TASK-67.2）・
#   Win32_System_SystemServices（ACCESS_SYSTEM_SECURITY・ACE 種別定数。TASK-67.2）・
#   Win32_System_JobObjects（Job Object）・
#   Win32_System_Threading（CREATE_SUSPENDED・OpenThread・ResumeThread・GetProcessIdOfThread）・
#   Win32_System_Diagnostics_ToolHelp（スレッド列挙）・Win32_System_SystemInformation（GetSystemDirectoryW）。
# 依存の追加は =x.y.z 完全固定・ユーザー承認制（.claude/rules/dependency-policy.md）。

[package]
name = "fandhe-container-platform-windows"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# WSL2 検出の結合試験（TASK-67.3・WIN-1・REPAIR-5・REPAIR-12）用の偽 `wsl.exe` と、実行するプログラムを
# 差し替える API（`wsl2::test_support`）を専用 feature でのみビルド・公開する（crates/io の
# crash-test-server と同じ仕組み）。feature を付けないビルド（リリース成果物を含む）ではこの bin も
# 差し替え API も存在しないため、任意のプログラムを wsl.exe として起動する経路が本番に入らない。
# 中身のない feature で、依存は引き込まない。
[features]
wsl2-test-support = []

[[bin]]
name = "fake_wsl"
path = "tests/bin/fake_wsl.rs"
required-features = ["wsl2-test-support"]
bench = false
doc = false

# 呼び出し側の結合試験 tests/wsl2_detect.rs は `env!("CARGO_BIN_EXE_fake_wsl")` を使うため同じ feature で
# 有効にするが、required-features ではなくファイル先頭の `#![cfg(feature = "wsl2-test-support")]` で
# 切り替える（`make test-integration` の `cargo test --workspace --test '*'` は required-features を
# 満たさない target があるとエラーで止まるため。feature なしでは 0 件の test target になる）。
# 公開 API だけを使う結合試験（tests/wsl2_public_api.rs）は feature なしで実行される。

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
] }
