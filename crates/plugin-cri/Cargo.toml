# CRI サーバー plugin バイナリ（fandhe-container-cri の実装を別プロセス化。crate-naming.md の表 #15）。
# 雛形は TASK-1.3（#11・REPAIR-1・MS-0）。本体は G8（TASK-114）で実装する。
# バイナリ名は `fandhe-container-plugin-cri`（発見対象。PLUG-4・PLUG-11）。TASK-114.1（#457）で `[[bin]]`/`main.rs` を追加した（起動引数の解析のみ。サーバー本体は TASK-114.2 以降）。
# TASK-114.1（#457）の依存追加は workspace 内 path 依存 fandhe-container-plugin のみ（外部クレートの追加なし）。
# version は未指定（Cargo の既定で 0.0.0）。公開方針は未決定のため publish = false を明記する。
# 外部依存の追加は =x.y.z 完全固定・ユーザー承認制（.claude/rules/dependency-policy.md）。

[package]
name = "fandhe-container-plugin-cri"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# workspace 内の path 依存（外部クレートの追加ではない。PLUG-1: 境界機構 plugin crate を使う側）。
# TASK-114.2（#458）: adapter 用に cri・core への path 依存を足した（外部クレートの追加ではない。依存は plugin-cri → cri → core の一方向。CRI-7）。
fandhe-container-plugin = { workspace = true }
fandhe-container-cri = { path = "../cri" }
# core は plugin feature を有効にしない（feature 統合で core の成果物が変わらないよう cri と揃える。PLUG-4）。
fandhe-container-core = { path = "../core", default-features = false }
# TASK-114.4（#460・MS-4）: NetworkPlugin の実装が TASK-139 の統合 API（create_network・attach_container・delete_network）を呼ぶ。
# workspace 内 path 依存で外部クレートの追加ではない。net は依存を持たない core 側ライブラリで、辺は plugin-cri → net の一方向（PLUG-1・CRI-7）。
fandhe-container-net = { path = "../net" }

[[bin]]
name = "fandhe-container-plugin-cri"
path = "src/main.rs"
# lib と bin の rustdoc 出力名の衝突を避ける。
doc = false
bench = false

# workspace の lint 設定を継承する（ルート Cargo.toml の [workspace.lints]。#1138）。
[lints]
workspace = true
