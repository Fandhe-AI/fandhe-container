# CRI サーバー plugin バイナリ（fandhe-container-cri の実装を別プロセス化。crate-naming.md の表 #15）。
# 雛形は TASK-1.3（#11・REPAIR-1・MS-0）。本体は G8（TASK-114）で実装する。
# バイナリ名は `fandhe-container-plugin-cri`（発見対象。PLUG-4・PLUG-11）。TASK-114.1（#457）で `[[bin]]`/`main.rs` を追加した（起動引数の解析のみ。サーバー本体は TASK-114.2 以降）。
# TASK-114.1（#457）の依存追加は workspace 内 path 依存 fandhe-container-plugin のみ（外部クレートの追加なし）。
# version は未指定（Cargo の既定で 0.0.0）。公開方針は未決定のため publish = false を明記する。
# 外部依存の追加は =x.y.z 完全固定・ユーザー承認制（.claude/rules/dependency-policy.md）。

[package]
name = "fandhe-container-plugin-cri"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# workspace 内の path 依存（外部クレートの追加ではない。PLUG-1: 境界機構 plugin crate を使う側）。
# TASK-114.2（#458）: adapter 用に cri・core への path 依存を足した（外部クレートの追加ではない。依存は plugin-cri → cri → core の一方向。CRI-7）。
# TASK-114.3.1（#849）: UDS＋gRPC のサーバー結線のため feature `grpc` を有効にし、tokio（rt・net・time）と tonic を足す。
# 承認: #425 のオーナー判断（2026-10-10。配置に plugin-cri を含む）。workspace 既存の版で新規パッケージなし。
# core には入れない（PLUG-3・PLUG-4）。signal・sync・rt-multi-thread は承認範囲外のため使わない。
fandhe-container-plugin = { workspace = true, features = ["grpc"] }
tokio = { workspace = true, features = ["rt", "net", "time"] }
tonic = { workspace = true }
fandhe-container-cri = { path = "../cri" }
# core 自身は plugin feature を要求しない（PLUG-4）。ただし下の supervisor が core を既定 feature（`plugin`）で引くため、
# `-p fandhe-container-plugin-cri` でビルドすると feature 統合で core の `plugin` feature が有効になる（#2434）。
# PLUG-4 の core 不変性の判定は core 単体のビルドで行うため影響しない。
fandhe-container-core = { path = "../core", default-features = false }
# #2434（CRI-2・PLUG-1・SUP-1・SUP-9）: start・kill・stop と cgroup remover を CLI と同じ本番経路へ結線するため supervisor へ path 依存を
# 足した（workspace 内 path 依存で外部クレートの追加ではない。辺は plugin-cri → supervisor の一方向で、supervisor は core
# にのみ依存するため循環しない。CLI の private 実装を複製せず supervisor の公開 API を共有する。REPAIR-1）。
fandhe-container-supervisor = { path = "../supervisor" }
# TASK-114.4（#460・MS-4）: NetworkPlugin の実装が TASK-139 の統合 API（create_network・attach_container・delete_network）を呼ぶ。
# workspace 内 path 依存で外部クレートの追加ではない。net は依存を持たない core 側ライブラリで、辺は plugin-cri → net の一方向（PLUG-1・CRI-7）。
fandhe-container-net = { path = "../net" }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "net", "time"] }
# #2484: 結合試験 `peer_auth_audit_delivery` が `UdsIncoming` の期待 UID だけを差し替える口（feature `test-support`。
# 既定で無効・workspace 内 path 依存の feature 追加のみで外部依存の追加ではない）を使う。本番の依存では有効にしない。
fandhe-container-plugin = { workspace = true, features = ["grpc", "test-support"] }

[[test]]
name = "peer_auth_audit_delivery"
path = "tests/peer_auth_audit_delivery.rs"
# `ControlAuditRelay::spawn` は単一スレッドの呼び出し元を要求するため、単一スレッドの `main` で動かす。
harness = false

# #2594: create の `mounts[].destination` 拒否が、中継 sink（ControlAuditRelay）を通って @audit.log へ届くことの結合試験
# （SEC-4・OCI-4・CRI-7）。relay の fork は単一スレッドの呼び出し元を要求するため、単一スレッドの `main` で動かす。
[[test]]
name = "create_destination_audit_relay"
path = "tests/create_destination_audit_relay.rs"
harness = false

[[bin]]
name = "fandhe-container-plugin-cri"
path = "src/main.rs"
# lib と bin の rustdoc 出力名の衝突を避ける。
doc = false
bench = false

# workspace の lint 設定を継承する（ルート Cargo.toml の [workspace.lints]。#1138）。
[lints]
workspace = true
