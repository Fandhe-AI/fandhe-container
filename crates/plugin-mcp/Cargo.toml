# MCP サーバー plugin バイナリ（参照実装。crate-naming.md の表 #19）。
# 雛形は TASK-1.3（#11・REPAIR-1・MS-0）。本体は G8（TASK-118、PoC-13）で実装する。
# バイナリ名は `fandhe-container-plugin-mcp`（発見対象。PLUG-4・PLUG-11）。TASK-118.1（#464）で `[[bin]]`/`main.rs` を追加した。TASK-118.4（#467）で fandhe-container-plugin への path 依存（PLUG-12 の UDS 接続）を追加。TASK-118.2（#465）で serde / serde_json（workspace 参照。承認: #138）を追加。
# version は未指定（Cargo の既定で 0.0.0）。公開方針は未決定のため publish = false を明記する。
# 依存の追加は =x.y.z 完全固定・ユーザー承認制（.claude/rules/dependency-policy.md）。

[package]
name = "fandhe-container-plugin-mcp"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# workspace の lint 設定を継承する（ルート Cargo.toml の [workspace.lints]。#1138）。
[lints]
workspace = true

# 独立バイナリ。名前は plugin の発見規約の接頭辞に合わせる（PLUG-4・PLUG-11）。
[[bin]]
name = "fandhe-container-plugin-mcp"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

# workspace 内 path 依存。外部クレートの追加ではない（cli→core と同じ。TASK-118.3・#466: 状態ストアの読み出し）。
fandhe-container-core = { path = "../core" }

# workspace 内 path 依存。外部クレートの追加ではない（TASK-118.4・#467: PLUG-12 の peer 認証つき UDS 接続）。
fandhe-container-plugin = { path = "../plugin" }
