# microVM 制御 plugin バイナリ（fandhe-container-microvm の実装を別プロセス化。crate-naming.md の表 #18）。
# 雛形は TASK-1.3（#11・REPAIR-1・MS-0）。本体は G8（TASK-117）で実装する。
# TASK-117.1（#710）で `[[bin]]`/`main.rs`・起動設定の解決・UDS 接続・フレーム送受信ループ・最小 adapter（ping）を追加した（外部クレートの追加なし）。
# TASK-117.4（#713）で結合試験 `tests/e2e.rs` を追加した（依存・feature の変更なし）。
# バイナリ名は `fandhe-container-plugin-microvm`（発見対象。PLUG-4・PLUG-11）。
# version は未指定（Cargo の既定で 0.0.0）。公開方針は未決定のため publish = false を明記する。
# 依存の追加は =x.y.z 完全固定・ユーザー承認制（.claude/rules/dependency-policy.md）。
# rust-vmm 系クレートは禁止（MVM-4・.claude/rules/dependency-policy.md）。
# #4726: sys.rs の自前 FFI 宣言を libc と照合するため dev-dependencies（unix）に libc を追加した（#3290 の承認・MVM-4・REPAIR-12）。

[package]
name = "fandhe-container-plugin-microvm"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# workspace 内の path 依存（外部クレートの追加ではない。PLUG-1: 境界機構 plugin crate を使う側）。
fandhe-container-plugin = { workspace = true }
# TASK-117.2（#711）: microVM 本体（start / stop の委譲先）。外部クレートの追加ではない。
fandhe-container-microvm = { path = "../microvm" }

# `sys.rs` の自前 FFI 宣言を libc と照合する試験専用の依存（#4726・#3290・MVM-4・REPAIR-12）。製品の依存には入れない
# （cargo tree -e normal,build に現れない）。`sys.rs` の照合対象は unix のみ。方式は docs/design/ffi-libc-check.md。
[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[[bin]]
name = "fandhe-container-plugin-microvm"
path = "src/main.rs"
# lib と bin の rustdoc 出力名の衝突を避ける。
doc = false
bench = false

# workspace の lint 設定を継承する（ルート Cargo.toml の [workspace.lints]。#1138）。
[lints]
workspace = true
