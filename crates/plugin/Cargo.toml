# plugin 境界機構（UDS・長さ接頭辞フレーム・gRPC・常駐/都度起動・信頼性検証。crate-naming.md の表 #10）。
# 雛形は TASK-1.3（#11・REPAIR-1・MS-0）。本体は G8（TASK-107・TASK-108 等）で実装する。
# crate 名は `fandhe-container-plugin`（旧称 `plugin-api`）。plugin バイナリ専用の
# `fandhe-container-plugin-*` とは区別する（決定 4）。
# version は未指定（Cargo の既定で 0.0.0）。公開方針は未決定のため publish = false を明記する。
# エラー型は TASK-107.1（#244）、フレームヘッダ型は TASK-107.2（#245）、制御メッセージの
# serde_json 符号化は TASK-107.3（#247）、UDS listener は TASK-107.4（#248）、UDS client 接続は TASK-107.5（#249）、ACK/RPC 待機のタイムアウトは TASK-107.6（#250）、runtime directory の解決・作成は TASK-123.1（#286）、socket パスの bind 前検証は TASK-123.3（#288）、XDG 未設定時のフォールバックは TASK-123.4（#289）で追加。依存は serde / serde_json（workspace 参照。
# 都度起動モードは TASK-110.1（#258）、常駐モードは TASK-110.2（#259）、モード選択 API は TASK-110.3（#260）、Linux の peer 認証（SO_PEERCRED）の検証集約は TASK-124.1（#292）、別 UID 接続拒否の結合試験は TASK-124.4（#295）、peer 認証の順序照合テストは TASK-124.6（#1389）で追加（依存追加なし）。
# 異常終了で残った都度起動の socket・ロックファイルの掃除は #1310 で追加（依存追加なし）。
# 起動 API が受け取る検証済み fd つきの起動対象の型は #1856（依存追加なし）。
# 起動中 plugin の登録表と親が受けたシグナルの転送 API は #1513（依存追加なし）。
# peer 認証で拒否した接続の監査イベントは TASK-124.5（#1388。依存追加なし）。
# macOS の socket 識別情報取得の fstatat 化は #1307（依存追加なし）。
# Linux の PR_SET_PDEATHSIG による親の強制終了時の plugin 停止は #1514（依存追加なし）。
# 自発終了した plugin の孫のグループ停止（`waitid(WNOWAIT)` で終了を観測してから SIGKILL を送り回収する）は #1604（依存追加なし）。
# RSS サンプラーは TASK-112.1（#265）、常駐 plugin の RSS 計測テスト（実機前提）は TASK-112.3（#267）で追加（依存追加なし）。
# 承認: #138・#246）のみ。依存の追加は =x.y.z 完全固定・ユーザー承認制（.claude/rules/dependency-policy.md）。
# core からは `fandhe-container-core` の `plugin` feature 経由で optional に参照される（PLUG-3・TASK-111.1・#262）。
# gRPC 面（`grpc` モジュール。TASK-108.1・#453・PLUG-2）は非既定 feature `grpc` の背後に置く。tonic / tokio（承認: #425 の
# オーナー判断 2026-10-10）は optional で、core が既定 feature で本 crate を引いても tokio / tonic は core に入らない（PLUG-3・PLUG-4）。
# UDS 上の tonic 統合（TASK-108.2・#454）は hyper-util（承認: #425 のオーナー判断。同 feature `grpc` のみ・Cargo.lock に既存）を追加。
# CRI proto 由来 RPC の UDS 疎通試験（TASK-108.3・#455）のため、dev-dependency に workspace 内 path の `fandhe-container-cri` を追加
# （外部依存の追加なし。test 専用で core の normal 依存木に影響しない。PLUG-3・PLUG-4）。cri→plugin の通常依存は足さない。
# license は workspace 継承（Apache-2.0）をやめ、本 crate だけ `MIT OR Apache-2.0` にする
# （#13 のオーナー判断 2026-10-10・TASK-3・OSS-3。外部の plugin の作者もリンクする境界ライブラリのため）。
# 全文はルートの LICENSE-MIT・LICENSE-APACHE。依存の serde / serde_json も MIT OR Apache-2.0。

[package]
name = "fandhe-container-plugin"
edition.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
publish = false

[features]
default = []
grpc = ["dep:tonic", "dep:tokio", "dep:hyper-util"]
# 結合試験用: `UdsIncoming` の期待 UID だけを差し替える口を公開する（#2484・PLUG-12。照合を省く経路ではない）。
# 本番の依存（core・plugin-cri・cli）では有効にしない。
test-support = ["grpc"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tonic = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["time", "net"] }
hyper-util = { workspace = true, optional = true, features = ["tokio"] }

# grpc の結合試験用（hand-written な prost メッセージ・codec と `#[tokio::test]`）。
[dev-dependencies]
prost = { workspace = true }
tonic-prost = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time", "net"] }
fandhe-container-cri = { path = "../cri" }

# `sys.rs` の自前 FFI 宣言を libc と照合する試験専用の依存（#1843・#1318・#1837・REPAIR-12）。
# 承認: #1318 のオーナー判断 2026-10-12（版は workspace の =0.2.189 のまま・用途は照合の試験に限る）。
# 製品の依存には入れない（`cargo tree -e normal,build` に現れない。外部の plugin の作者の依存グラフも変えない）。
# 方式は docs/design/ffi-libc-check.md。
[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[[test]]
name = "grpc_basic"
required-features = ["grpc"]

[[test]]
name = "grpc_uds"
required-features = ["grpc"]

# workspace の lint 設定を継承する（ルート Cargo.toml の [workspace.lints]。#1138）。
[lints]
workspace = true
