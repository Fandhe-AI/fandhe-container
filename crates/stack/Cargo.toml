# TOML スキーマ・depends_on 起動順・profiles 絞り込み（crate-naming.md の表 #13）。
# 雛形は TASK-1.3（#11・REPAIR-1・MS-0）。本体は G11（TASK-149・150・187〜188）で実装する。
# version は未指定（Cargo の既定で 0.0.0）。公開方針は未決定のため publish = false を明記する。
# 依存（serde・toml）は TASK-149.1（#583）で追加した。追加は =x.y.z 完全固定・ユーザー承認制（.claude/rules/dependency-policy.md）。

[package]
name = "fandhe-container-stack"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# workspace の lint 設定を継承する（ルート Cargo.toml の [workspace.lints]。#1138）。
[lints]
workspace = true

# 独自 TOML スタック定義の型と parse / serialize 用（STACK-1・CLI-4）。serde は #138、toml は #582 で承認済み。
[dependencies]
serde.workspace = true
toml.workspace = true
