[project]
name = "up-network"

[services.db]
image = "example/db:1"
networks = ["backend"]

[services.api]
image = "example/api:1"
networks = ["backend"]
[services.api.depends_on]
db = "started"

[services.web]
image = "example/web:1"
networks = ["frontend"]
[services.web.depends_on]
api = "started"

[services.worker]
image = "example/worker:1"
[services.worker.depends_on]
db = "started"

[services.cache]
image = "example/cache:1"
networks = ["shared"]

[networks.frontend]
driver = "bridge"

[networks.backend]

[networks.shared]
external = true

[networks.unused]
