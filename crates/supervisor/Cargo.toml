# コンテナごとの軽量監視プロセス（restart・healthcheck・exec・logs・stats。crate-naming.md の表 #3）。
# 雛形は TASK-1.3（#11・REPAIR-1・MS-0）。本体は G12（TASK-157〜171）で実装する。
# version は未指定（Cargo の既定で 0.0.0）。公開方針は未決定のため publish = false を明記する。
# #2070 で bin の入口の継承 fd の整理を追加した（依存は不変）。
# TASK-171.2（#537）でランチャーの入口にセッション切り離し（setsid・pty 非経由の検証）を追加した（依存は不変）。
# TASK-171.3（#538）で sudo（pty の保持者）を SIGKILL しても切り離した子孫が動き続ける結合試験 tests/privilege.rs を追加した（依存は不変）。
# TASK-163 追補（#1594）で exec の本番用 AuditSink の構築入口 default_audit_sink を追加した（依存は不変）。
# TASK-163 追補（#1698）で exec の entrypoint_mode のログを core の待たない出力経路へ載せ替えた（依存は不変）。
# TASK-164 追補（#1469）でロックファイルの掃除経路（remove_all・open 失敗時の削除）を追加した（依存は不変）。
# TASK-157.1（#235・SUP-1）で雛形を確認し、受け入れ基準の照合テスト（tests/skeleton.rs）を追加した。
# TASK-164.3（#507・SUP-7）でログ sink の書き込みバッファ・flush 制御を追加した（依存の追加なし）。
# TASK-157.3（#237）で fandhe-container-core への workspace 内 path 依存（supervisor -> core の一方向。
# crate-naming.md 決定 6）を導入した。状態のファイルベース実装は core に一本化し、supervisor は配線のみを持つ。
# TASK-157.7（#241）で logs 捕捉の土台（src/logs.rs）を追加した（std のみ。依存は不変）。
# TASK-168.1（#523）で inspect 出力（src/inspect.rs）を追加した（std のみ。依存は不変）。
# TASK-168.2（#524）で inspect 出力の型・キー順・値域の照合テストを追加した（依存は不変）。
# TASK-164.1（#505）で行単位捕捉のバッファ境界跨ぎの照合テストを追加した（依存は不変）。
# TASK-164.2（#506）でローテーション sink（src/logs/rotating.rs）を追加した（std のみ。依存は不変）。
# TASK-169.1（#526）で container_options（ulimit の指定モデル。core の rlimits 型へ変換）を追加した（依存は不変）。
# TASK-169.3（#528）で --ipc の指定モデルと実機前提の結合試験 container_options_ipc を追加した（依存は不変）。
# TASK-169.4（#529）で container_options::env（env / env ファイルの指定モデル）を追加した（依存は不変）。
# TASK-169.5.1（#855）で container_options::labels（label の指定モデル。state.json の annotations へ反映）を追加した（依存は不変）。
# TASK-169.5.2（#856）で ContainerOptions に --shm-size / --tmpfs を結線し全オプション組み合わせの結合テストを追加した（依存は不変）。
# TASK-169.4.2（#1473）で container_options::secrets（secrets / configs の指定モデル。core の注入仕様型へ変換）を追加した（依存は不変）。
# TASK-171.1.2（#858）で privilege（権限昇格の必要最小集合と検証。純ロジック・unsafe なし）を追加した（依存は不変）。
# TASK-164.4（#508）で 100 万行規模の欠落 0・重複 0 の結合テストを追加した（依存は不変）。
# TASK-163.3（#502）で exec に seccomp / Landlock 再適用の配線を追加した（core の安全 API を呼ぶだけ。依存は不変）。
# TASK-171.1.3（#1475）で privilege::elevate の実体（src/sys/linux.rs の自前 extern 宣言を使う。依存は不変）を追加した。
# TASK-163.4（#503）で exec にコマンド実行（run_command）と実コンテナへの通し結合試験 tests/exec.rs を追加した（依存は不変）。
# TASK-163 追補（#1465）で exec::run_command に監査の記録先を必須の引数として追加した（依存は不変）。
# TASK-164 追補（#1470）で Windows の世代 rename 再試行・ロックファイル ID 照合（src/sys.rs。自前 FFI 宣言）を追加した（依存は不変）。
# TASK-157 追補（#1819）で ProductionStartDeps を core の本番 launcher へ結線した（依存は不変）。
# TASK-157 追補（#1717）で bin の入口（src/main.rs）と起動の契約（start_contract・start_entry）を追加した（依存は不変）。
# TASK-171 追補（#1719）で特権ランチャーの bin（src/launcher.rs・src/bin/）を追加した（依存は不変）。
# TASK-157 追補（#2058）で CLI からのシグナル送信を受ける制御チャネル（src/control）を追加した（依存は不変）。
# #2140 で制御チャネルの sys ラッパーを LP64 に限定し、別 uid の拒否の監査配送の結合試験 control_audit_delivery を追加した（依存は不変）。
# #2835 で範囲写像の rootless コンテナへ create・start・exec を本番の入口だけで通す実機前提の結合試験 exec_subordinate_e2e を追加した（依存は不変）。
# #1840 で sys の自前 FFI 宣言と libc の照合試験を追加した（dev-dependencies に workspace の libc =0.2.189。Linux のみ）。
# #3065 で fandhe-container-net への workspace 内 path 依存（supervisor -> net の一方向。network-wiring.md D5）を追加した（外部クレートの追加なし）。
# #3198 で netns holder の起動・回収（src/netns_holder.rs）と bin の振り分けを追加した（依存は不変）。
# 外部クレート（crates.io）の追加は =x.y.z 完全固定・ユーザー承認制（.claude/rules/dependency-policy.md）。

[package]
name = "fandhe-container-supervisor"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# --ipc=host / shareable の IPC namespace 共有・分離の結合試験（SUP-12・TASK-169.3）。
# CLONE_NEWUSER はマルチスレッドから EINVAL になるため harness = false（core の unshare_isolation と同じ理由）。
# `-- --ignored` 指定時のみ実行する実機前提テスト（AGENTS.md）。
[[test]]
name = "container_options_ipc"
path = "tests/container_options_ipc.rs"
harness = false

# supervisor の bin（起動 → 結果の返却 → 監視。#1717）。doc = false は lib の rustdoc の出力名との衝突を避けるため。
[[bin]]
name = "fandhe-container-supervisor"
path = "src/main.rs"
doc = false

# 特権ランチャーの bin（入口検証 → 権限昇格 → 検証済み fd で supervisor を exec。#1719・SUP-14）。名前は spec（TASK-171 の成果物欄）で確定。
# doc = false は supervisor の bin と同じ理由（lib の rustdoc の出力名との衝突を避ける）。
[[bin]]
name = "fandhe-container-launcher"
path = "src/bin/fandhe-container-launcher.rs"
doc = false

[dependencies]
# core の plugin feature を要求しない（PLUG-3・#3204）。supervisor は `fandhe_container_core::plugin`（plugin 境界基盤の再エクスポート）を
# 使わないため、既定 feature のまま引くと CLI など依存元の実行ファイルで feature 統合により core の `plugin` が再有効化されてしまう
# （plugin-cri の #2434 と同じ原因）。oci・cri・plugin-cri と同じく default-features = false で引く。
fandhe-container-core = { path = "../core", default-features = false }
fandhe-container-net = { path = "../net" }

# exec-test-support: 実機結合試験（tests/exec_setns_join.rs）専用の入口 `exec::identify_pid1_in`（期待 cgroup
# パスを呼び出し側から受け取る）を公開する。既定のビルドには含めず、記録から期待値を導く `identify_pid1` だけを
# 公開 API にする（SEC-1。crates/io の crash-test-server と同じ仕組み。依存は増えない）。core 側の同名 feature
# （`Pid1Target::open_with_cgroup_path`）を連動して有効にする。
# worker 機構を任意の `work` で直接呼ぶ `exec::run_in_worker_for_test`（tests/exec_timeout.rs）も同じ feature の下に
# 置く（TASK-163 追補・#1460）。縮退経路の通しの入口 `exec::run_command` も同じ feature の下に置く（#1617。本番の通しの
# 入口は `run_command_with_pidfd` だけ）。リリースビルドで有効にするとコンパイルが止まる（src/lib.rs の `compile_error!`）。
[features]
exec-test-support = ["fandhe-container-core/exec-test-support"]

# 自己参照の dev-dependency（core の escape-probe と同じ仕組み。外部クレートの追加ではない）: supervisor 自身の
# テストでは `exec-test-support` を常に有効にし、試験専用の入口を使う結合試験（exec_timeout・exec_setns_join・exec）が
# `cargo test --workspace`・`make test-integration` の既定のテスト集合から外れないようにする（TASK-163 追補・#1460）。
# 通常のビルド（`cargo build`・リリース成果物）は dev-dependency を解決しないため、feature は無効のまま。
[dev-dependencies]
fandhe-container-supervisor = { path = ".", features = ["exec-test-support"] }

# 自前 FFI 宣言と libc のコンパイル時照合（`src/sys/linux.rs` の `libc_abi`。#1840・#1318・MVM-4・REPAIR-12。
# 方式は docs/design/ffi-libc-check.md）。dev-dependencies のみで製品コードの依存には入れない。sys は Linux 限定。
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc.workspace = true

# 実 pid1 の 5 種 namespace への setns 参加の結合試験（TASK-163.1・#500・SUP-6）。
# setns(CLONE_NEWNS) は複数スレッドのプロセスから拒否されるため、単一スレッドの独自 main（harness = false）で動かす。
# `-- --ignored` 指定時のみ実行する実機前提テスト（AGENTS.md）。本体は exec-test-support feature を付けたときだけ
# コンパイルする（上の自己参照の dev-dependency で常に有効になる。テスト側の cfg は、feature が外れた構成で
# 検証せずに成功しないための分岐で、feature なしの `--ignored` 実行は非ゼロ終了にする）。
[[test]]
name = "exec_setns_join"
path = "tests/exec_setns_join.rs"
harness = false

# 実 cgroup に対する `identify_pid1`（既定ビルドの公開入口）の成功経路・拒否経路の結合試験（TASK-163 追補・#1464・
# SUP-6・SEC-1）。`DelegatedCgroup::prepare`（自プロセスの退避）と `setns` が単一スレッド・単一プロセスを要するため、
# 独自 main（harness = false）で動かす。非特権ユーザーに委譲された cgroup v2 サブツリーと非特権 user namespace を
# 要する実機前提テストで、`-- --ignored` 指定時のみ実行する（AGENTS.md）。`exec-test-support` の入口は使わない。
[[test]]
name = "exec_identify_cgroup"
path = "tests/exec_identify_cgroup.rs"
harness = false

# 稼働中コンテナへのコマンド実行の通し結合試験（TASK-163.4・#503・SUP-6）。setns は複数スレッドのプロセスから
# 拒否されるため、単一スレッドの独自 main（harness = false）で動かす。root・委譲 cgroup v2・Landlock・x86_64 を要する
# 実機前提テストで、`-- --ignored` 指定時のみ実行する（AGENTS.md）。本体は exec-test-support feature を付けたときだけ
# コンパイルする（exec_setns_join と同じ理由で required-features にしない）。
[[test]]
name = "exec"
path = "tests/exec.rs"
harness = false

# exec の全体上限時間（worker プロセス隔離）の結合試験（REPAIR-5・TASK-163.4・#503・SUP-6）。fork は単一スレッドの
# 呼び出し元を要求するため、単一スレッドの独自 main（harness = false）で動かす。root・実コンテナは不要で、
# 既定のテスト集合で実行する（試験専用の入口 `run_in_worker_for_test` は exec-test-support の下にあり、上の
# 自己参照の dev-dependency で有効になる。TASK-163 追補・#1460）。
[[test]]
name = "exec_timeout"
path = "tests/exec_timeout.rs"
harness = false

# exec の worker が seccomp の listener を親へ渡す経路（実カーネルでの受け渡し・fail-closed。SEC-4・SUP-6・#2385）の
# 結合試験。fork は単一スレッドの呼び出し元を要求するため harness = false。root・実コンテナ不要で、既定のテスト集合で
# 実行する（依存は不変。exec-test-support は自己参照の dev-dependency で有効になる）。
[[test]]
name = "exec_seccomp_listener"
path = "tests/exec_seccomp_listener.rs"
harness = false

# exec の対象の拒否が層 exec_target の監査レコードとして 1 拒否 1 件記録されることの結合試験（SEC-4・SUP-6・
# TASK-163 追補・#1465）。fork は単一スレッドの呼び出し元を要求するため harness = false。root・実コンテナ不要で、
# 既定のテスト集合で実行する（依存は不変）。worker の rootfs_is_host_root の拒否が層 mount に 1 件記録される
# シナリオ（#1614 の事後監査）は exec-test-support の入口（run_in_worker_audited_for_test・core の
# reject_own_root_for_test）を使う（上の自己参照の dev-dependency で有効になる）。
[[test]]
name = "exec_audit"
path = "tests/exec_audit.rs"
harness = false

# exec の対象を起動時から保持する pidfd で固定する経路の結合試験（SUP-6・SEC-1・CORE-1・TASK-163 追補・#1461）。
# fork は単一スレッドの呼び出し元を要求するため、単一スレッドの独自 main（harness = false）で動かす。
# root・実コンテナは不要で、既定のテスト集合で実行する。
[[test]]
name = "exec_launch_pidfd"
path = "tests/exec_launch_pidfd.rs"
harness = false

# 権限昇格の実体 elevate の結合試験（SUP-14・SEC-1・TASK-171.1.3・#1475）。capset・keepcaps はスレッド単位で
# elevate は単一スレッドを要求するため、単一スレッドの独自 main（harness = false）で動かす。昇格できない環境での
# fail-closed の拒否は既定のテスト集合で実行し、root・setpriv・setcap を要する縮退の実機シナリオは
# `-- --ignored` 指定時のみ実行する（AGENTS.md）。依存は不変。
[[test]]
name = "privilege_elevate"
path = "tests/privilege_elevate.rs"
harness = false

# 特権ランチャー bin の実機シナリオ（昇格後の CapPrm・CapEff・CapAmb・CapBnd が必要最小集合ちょうどであることの照合。
# SUP-14・TASK-171 追補・#1719）。同じ実行ファイルが supervisor の代役も兼ねるため独自 main（harness = false）で動かす。
# root・setcap・xattr を要する実機前提テストで、`-- --ignored` 指定時のみ実行する（AGENTS.md）。実行は人間担当。
[[test]]
name = "launcher_entry_real"
path = "tests/launcher_entry_real.rs"
harness = false

# workspace の lint 設定を継承する（ルート Cargo.toml の [workspace.lints]。#1138）。
[lints]
workspace = true

# bin の入口（start_entry::run_main）が継承 fd（fd 3 以降）を閉じること（SEC-1・SUP-14・CORE-1・#2070）。単一スレッドの
# main で入口の手順 2 を通し、CLOEXEC の無い fd を sh の exec で仕込む自己再実行のため独自 main（harness = false）で動かす。
[[test]]
name = "inherited_fds"
path = "tests/inherited_fds.rs"
harness = false

# supervisor の bin から core の本番 launcher を経て monitor まで通す実機シナリオ（起動 → 報告 → 監視 → Stopped の記録、
# 起動失敗で何も残らないこと、restart の fail-closed、SIGTERM の配送 → Stopped → 停止後の delete。SUP-1・SUP-3・SUP-4・CORE-1・CORE-2・TASK-157 追補・#1819・#2392）。同じ実行ファイルが
# コンテナ内のプローブも兼ねるため独自 main（harness = false）で動かす。非特権ユーザー・Linux 6.12 以上・委譲された
# cgroup v2（systemd-run --user）を要する実機前提テストで、`-- --ignored` 指定時のみ実行する（AGENTS.md）。実行は人間担当。
[[test]]
name = "supervisor_bin_real"
path = "tests/supervisor_bin_real.rs"
harness = false

# 制御チャネルの別 uid の拒否が監査の記録先（@audit.log）へ届くことの結合試験（SEC-4・SEC-1・SUP-1・PLUG-12・#2140）。
# 監査 helper の fork は単一スレッドの呼び出し元を要求するため、単一スレッドの独自 main（harness = false）で動かす。
# 既定のシナリオは root 不要で既定のテスト集合で実行し、本物の別 uid（65534）での実機シナリオは `-- --ignored` 指定時のみ
# 実行する（root 必須。AGENTS.md「実機前提テスト」。依存は不変）。
[[test]]
name = "control_audit_delivery"
path = "tests/control_audit_delivery.rs"
harness = false

# start の bind mount の元の拒否が、中継 sink（ControlAuditRelay）を通って監査の記録先（@audit.log）へ届くことの結合試験
# （SEC-4・OCI-4・SUP-1・#2481）。監査 helper の fork は単一スレッドの呼び出し元を要求するため、単一スレッドの
# 独自 main（harness = false）で動かす。root 不要で既定のテスト集合で実行する（依存は不変）。
[[test]]
name = "start_bind_audit_relay"
path = "tests/start_bind_audit_relay.rs"
harness = false

# start の rootfs 固定（`RootfsDir::pin`）の検証後の差し替えの違反が、中継 sink（ControlAuditRelay）を通って
# @audit.log へ届くことの結合試験（SEC-4・SEC-1・SUP-1・#2623）。監査 helper の fork は単一スレッドの呼び出し元を
# 要求するため、単一スレッドの独自 main（harness = false）で動かす。root 不要で既定のテスト集合で実行する
# （`exec-test-support` の入口 `claim_start_with_pin_swap_for_test` を使う。依存は不変）。
[[test]]
name = "start_rootfs_pin_audit_relay"
path = "tests/start_rootfs_pin_audit_relay.rs"
harness = false

# start の再検証（手順 5 の `load_resource_limits_audited`・手順 8 の `build_spec`）で起きる `mounts[].destination` の
# 拒否が、中継 sink（ControlAuditRelay）を通って @audit.log へ届くことの結合試験（SEC-4・OCI-4・SUP-1・#2594）。
# 監査 helper の fork は単一スレッドの呼び出し元を要求するため、単一スレッドの独自 main（harness = false）で動かす。
# root 不要で既定のテスト集合で実行する（依存は不変）。
[[test]]
name = "start_destination_audit_relay"
path = "tests/start_destination_audit_relay.rs"
harness = false

# seccomp の通知を受けて記録し EPERM で応答する経路の実カーネル end-to-end 試験（SEC-4・REPAIR-5・#2025）。
# 監査 helper の fork は単一スレッドの呼び出し元を要求するため、単一スレッドの独自 main（harness = false）で動かす。
# root 不要で既定のテスト集合で実行する（`exec-test-support` の probe を使う。依存は不変）。
[[test]]
name = "seccomp_notify_audit"
path = "tests/seccomp_notify_audit.rs"
harness = false

# sudo（pty の保持者）の SIGKILL で切り離した子孫が巻き添えにならないことの結合試験（SUP-14・TASK-171.3・#538）。
# setsid がプロセス全体に効くため、切り離す役は同じ実行ファイルの自己再実行で別プロセスにする独自 main（harness = false）で動かす。
# root 不要で util-linux の script を使い、既定のテスト集合で実行する（依存は不変）。
[[test]]
name = "privilege"
path = "tests/privilege.rs"
harness = false

# 範囲写像（subordinate ids）の rootless コンテナへ、本番の入口（ProductionLauncher の create → start と
# `run_command_with_pidfd`）だけで exec を通す実機前提の結合試験（SEC-5・CORE-6・SUP-6・#2835）。setns・fork が単一スレッドの
# 呼び出し元を要求し、`DelegatedCgroup::prepare` は 1 プロセスで 1 回だけのため、単一スレッドの独自 main（harness = false）で動かす。
# `FANDHE_CONTAINER_TEST_ID_HELPER=1`・uidmap・subuid / subgid・委譲 cgroup v2・Landlock ABI 6 以上を要し、`-- --ignored` 指定時のみ
# 実行する（AGENTS.md「実機前提テスト」）。`exec-test-support` の試験専用入口は使わない。
[[test]]
name = "exec_subordinate_e2e"
path = "tests/exec_subordinate_e2e.rs"
harness = false

# supervisor の bin の `netns-holder` 振り分けと、holder の起動の失敗・期限・回収の結合試験（NET-9・CORE-1・REPAIR-5・#3198）。
# 同じ実行ファイルが holder の代役も兼ねる（`/proc/self/exe` の exec し直し）ため独自 main（harness = false）で動かす。
# root・user namespace 不要で既定のテスト集合で実行する（試験専用の入口は exec-test-support の下。依存は不変）。
[[test]]
name = "netns_holder_launch"
path = "tests/netns_holder_launch.rs"
harness = false

# holder が実 namespace へ参加し、メモリを継承せず、supervisor の異常終了で消えることの実機前提の結合試験
# （NET-9・CORE-1・CORE-6・SUP-12・SEC-5・#3198）。非特権 user namespace を要し、`-- --ignored` 指定時のみ実行する
# （AGENTS.md「実機前提テスト」）。依存は不変。
[[test]]
name = "netns_holder_launch_userns"
path = "tests/netns_holder_launch_userns.rs"
harness = false
