# cargo-deny 設定。`make deny` が本ファイルと Cargo.toml の両方が存在する時点で
# 自動有効化され、`cargo deny --locked check advisories bans licenses sources` として
# 実行される。scripts/targets/deny.sh の Cargo.toml / deny.toml / member crate の有無の判定は、必要なファイルや
# メンバー crate が欠けた場合のみ skip する仕様。workspace とメンバー crate が揃った現在は
# 有効化済みで skip されない（TASK-90.1・#126 で確認。OSS-4・OSS-5・REPAIR-9）。
# 出力に `skip:` が出た場合は異常であり、合格の根拠にしない。
# 依存方針（.claude/rules/dependency-policy.md）: 依存最小・`=x.y.z` 完全固定・
# 追加はユーザー承認制。Fandhe-AI/rust-ai-library の deny.toml と同一方針。

[graph]
# feature gate 配下の optional 依存（OS 別・GPU 別の plugin 依存等）を既定 feature
# 集合のみの監査対象から漏らさないため、optional 依存を含む全 feature を監査対象に
# する（fail-closed）。
all-features = true

[advisories]
# RUSTSEC アドバイザリ監査（vulnerability / unmaintained / unsound / yanked）。
# ignore へアドバイザリ ID を追加する場合は、理由・解消予定（追跡 Issue 番号）を
# コメント付きで記録し、レビューを必須とする。
version = 2
ignore = [
]

[licenses]
version = 2
include-dev = true
# OSS-4・OSS-5 対応: `cargo deny check licenses` による許可外ライセンス
# （GPL/LGPL/AGPL 系・MPL-2.0 等）の fail-closed 検出
# （`.github/workflows/ci.yml` の `rust-ci` ジョブから呼び出す）。
# 本リポは OSS-3 に従い中核 crate を Apache-2.0 単独とし、汎用再利用可能な補助 crate は
# `MIT OR Apache-2.0` を選択肢として残す（`fandhe-container-plugin` が採用。#13・TASK-3）。
# 依存もこれと互換な permissive ライセンスのみ許可する。allow には互換 permissive の代表集合（rust-ai-library の
# Cargo.lock 全域実測で出現した SPDX 識別子集合と同一）を事前許可しておき、推移的依存が
# BSD/ISC 等の一般的な permissive を持つだけで make deny が不要に失敗しないようにする。
# 現在の依存に出現しない識別子は `license-not-encountered` 警告になるが、事前許可による
# 想定内の警告であり fail 対象ではない。
# ここに無い識別子の追加は依存追加のユーザー承認
# （dependency-policy.md）とセットで行い、コピーレフト（GPL/LGPL/MPL 等）は列挙しない
# ことで fail-closed に検出する。
# この fail-closed は `make deny-license-fail-closed-selftest`（scripts/deny-license-fail-closed-selftest.sh）が
# 使い捨て workspace で機械的に確認する（TASK-90.2・#127）。
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
]
# allow・[licenses.exceptions] へ識別子を追加する際は、SPDX 識別子の機械判定だけに
# 頼らず、対象クレートのライセンス文言（LICENSE ファイル・Cargo.toml license 欄）を
# 目視確認してから追加する。
confidence-threshold = 0.8

[sources]
# git 依存・代替レジストリの混入をサプライチェーン観点で fail-closed 検出する
# （全依存は crates.io 由来のみを許可）。
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[bans]
# 同一クレートの複数バージョン混入の検出。`=x.y.z` 完全固定方針では重複は原則
# 発生しない前提だが、推移的依存経由の重複は依存元側の追随を待つほかなく "deny" では
# ノイズが上回るため、警告に留めて CI ログで増加傾向を観測する（rust-ai-library と同一判断）。
multiple-versions = "warn"

# バージョン要求 `*` の依存宣言を拒否する（バージョン無指定はサプライチェーン上
# 任意の最新版を受け入れる宣言であり、`=x.y.z` 完全固定方針に反するため fail-closed で弾く）。
wildcards = "deny"
# workspace 内クレート（`crates/<短縮名>`）同士の相互参照はバージョン無しの path 依存
# （cargo 上は `*` 扱い）になるため、private（`publish = false`）クレートの path 依存に
# 限り wildcards の対象外とする（cargo-deny の仕様上、公開対象クレートの path 依存は
# 引き続き検出される。crates.io 公開する crate はバージョン併記の path 依存にする）。
allow-wildcard-paths = true

# C/C++ ネイティブビルドを引き込む暗号実装とビルドヘルパーを依存グラフ（normal・build・dev）から
# 締め出す（#1779）。TLS の暗号実装は純 Rust の rustls-graviola に限る #399 の採用方針と、
# docs/design/from-scratch-policy.md「不採用の記録」の `ring`・`aws-lc-rs`（#399）を機械的に守る。
# Cargo.lock には rustls-webpki の optional 依存（`ring?/alloc` の弱い参照）として `ring`・`cc` の
# 項目が残るが、cargo-deny は有効な feature で解決した依存グラフだけを見るため現状は通る。
# feature の変更等で実際にビルド対象へ入った時点で fail する（fail-closed）。
# 解除・例外の追加は依存追加のユーザー承認（dependency-policy.md）とセットで行う。
deny = [
  { crate = "ring", reason = "C/assembly native build; TLS crypto must be rustls-graviola (#399, #1779)" },
  { crate = "cc", reason = "C/C++ native build helper; dependencies must stay pure Rust (#399, #1779)" },
  { crate = "aws-lc-rs", reason = "C/C++ native build (aws-lc-sys); TLS crypto must be rustls-graviola (#399, #1779)" },
  # rust-vmm 系クレートの禁止（MVM-4・TASK-73.2・#686。dependency-policy.md の禁止クレート）。
  # 一覧の正は `scripts/check-microvm-deps.sh --list` で、ここはその写し。一致と検出力は
  # `make deny-bans-fail-closed-selftest` が機械照合する。cargo-deny は名前の完全一致で見るため、
  # check-microvm-deps.sh は `_` 表記の path crate（照合 A: 名前の正規化）と、rust-vmm の repository URL を
  # 保持した別名クレート（照合 B: 自己申告の repository URL）だけを補う。repository を書き換えた改名 fork や
  # 別名 crate へコピーした vendoring は検出対象外（スクリプトの「限界」節）。
  # youki・Firecracker・Cloud Hypervisor 由来は範囲外
  # （AGENTS.md の P0 観点が担う）。範囲を広げるときは両方を同時に更新する。
  # 解除・例外の追加は依存追加のユーザー承認とセットで行う。
  { crate = "vm-memory", reason = "rust-vmm crate; microVM must be from scratch (MVM-4, TASK-73.2, #686)" },
  { crate = "kvm-ioctls", reason = "rust-vmm crate; microVM must be from scratch (MVM-4, TASK-73.2, #686)" },
  { crate = "kvm-bindings", reason = "rust-vmm crate; microVM must be from scratch (MVM-4, TASK-73.2, #686)" },
  { crate = "vhost", reason = "rust-vmm crate; microVM must be from scratch (MVM-4, TASK-73.2, #686)" },
  { crate = "vhost-user-backend", reason = "rust-vmm crate; microVM must be from scratch (MVM-4, TASK-73.2, #686)" },
  { crate = "virtio-queue", reason = "rust-vmm crate; microVM must be from scratch (MVM-4, TASK-73.2, #686)" },
  { crate = "vmm-sys-util", reason = "rust-vmm crate; microVM must be from scratch (MVM-4, TASK-73.2, #686)" },
  { crate = "linux-loader", reason = "rust-vmm crate; microVM must be from scratch (MVM-4, TASK-73.2, #686)" },
  { crate = "event-manager", reason = "rust-vmm crate; microVM must be from scratch (MVM-4, TASK-73.2, #686)" },
  { crate = "vm-superio", reason = "rust-vmm crate; microVM must be from scratch (MVM-4, TASK-73.2, #686)" },
]
