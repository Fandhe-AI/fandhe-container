# 試験治具 VMM 向け capset アダプタ（GPU-6・TASK-172.4・#888）。PoC 用の独立パッケージで製品 crate ではない。
# 確定 19 crate＋benches の crate 境界（docs/design/crate-naming.md）を変えないため、空の [workspace] を持たせて
# ルート workspace の外に置く（ルート Cargo.toml の members には加えない）。製品 crate から本パッケージへは依存しない（一方向）。
# 依存は workspace 内の path 依存（自前 venus デコーダ）のみで、外部クレートの追加はない。
# ルートの `make ci` には入らないため、`make poc-venus-jig-check` で test / clippy / fmt-check を回す
# （CI は .github/workflows/ci.yml の platform-ci ジョブが同ターゲットを実行する。PR は ubuntu・main は 3 OS）。

[package]
name = "fandhe-container-poc-venus-jig"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace]

[dependencies]
fandhe-container-plugin-macos = { path = "../../../crates/plugin-macos" }

# ルート workspace の [workspace.lints] と同等（unsafe の SAFETY コメント欠落を機械検出）。
[lints.clippy]
undocumented_unsafe_blocks = "deny"

# 起動入口（UDS の bind・期限つき accept・ログのファイル出力。F4・#1598）。Linux 以外では UNSUPPORTED を出して終わる。
[[bin]]
name = "venus-jig"
path = "src/bin/venus-jig.rs"
